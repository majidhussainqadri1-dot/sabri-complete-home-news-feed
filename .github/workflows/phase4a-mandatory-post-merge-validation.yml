name: Phase 4A Mandatory Post-Merge Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase4a-mandatory-post-merge-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4a-mandatory-post-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHASE4A_HEAD_SHA: 808a7a85a3f5aae4ed6566725b097d28dbcfd562
  PHASE4A_MERGE_SHA: 0bf78d651b908e4d0441ffb19c1da1a5b3a8bbb2

jobs:
  source-playground:
    name: Exact Phase 4A source (${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact Phase 4A head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE4A_HEAD_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PHASE4A_HEAD_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Build exact Phase 4A package for packaged permalink regression
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase4a-source-package
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase4a-source-package
          cp "$package" phase4a-source-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase4a-source-package/candidate.sha256
          printf '%s\n' "${PHASE4A_HEAD_SHA}" > phase4a-source-package/exact-commit.txt
          echo "SABRI_DATE_PERMALINK_PLUGIN_ZIP=phase4a-source-package/candidate.zip" >> "$GITHUB_ENV"
      - name: Run source activation, packaged permalink routing, and Phase 4A integration
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          log="phase4a-source-${{ matrix.wp }}-php-${{ matrix.php }}.log"
          node tests/run-playground-integration-tests.mjs 2>&1 | tee "$log"
          SABRI_PLUGIN_ZIP="${SABRI_DATE_PERMALINK_PLUGIN_ZIP}" node tests/run-date-permalink-playground-tests.mjs 2>&1 | tee -a "$log"
          node tests/run-phase4a-playground-tests.mjs 2>&1 | tee -a "$log"
          test "$(cat phase4a-source-package/exact-commit.txt)" = "${PHASE4A_HEAD_SHA}"
          (cd phase4a-source-package && sha256sum -c candidate.sha256)
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-post-merge-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.PHASE4A_HEAD_SHA }}
          retention-days: 60
          path: |
            phase4a-source-${{ matrix.wp }}-php-${{ matrix.php }}.log
            phase4a-source-package/candidate.sha256
            phase4a-source-package/exact-commit.txt
          if-no-files-found: error

  mandatory-second-one-hour:
    name: Exact Phase 4A mandatory 3,900-second QA
    needs: source-playground
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact Phase 4A head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE4A_HEAD_SHA }}
          fetch-depth: 1
      - name: Verify exact head and runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PHASE4A_HEAD_SHA}"
          php -v
          node -v
          pwsh -v
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Execute mandatory second one-hour repeated QA
        shell: bash
        run: bash tests/run-phase4a-second-one-hour-qa.sh
      - name: Verify duration, cycles, exact commit, manifests, package checksum, and structure
        shell: bash
        run: |
          set -euo pipefail
          source phase4a-second-one-hour-qa/result.env
          test "$status" = "passed"
          test "$duration_seconds" -ge 3900
          test "$cycles_required" -eq 13
          test "$head_sha" = "${PHASE4A_HEAD_SHA}"
          test "$head_sha" = "$(git rev-parse HEAD)"
          test -n "$tracked_manifest_sha256"
          test "$tracked_manifest_sha256" = "$(sha256sum phase4a-second-one-hour-qa/initial-tracked-files.sha256 | awk '{print $1}')"
          cmp phase4a-second-one-hour-qa/initial-tracked-files.sha256 phase4a-second-one-hour-qa/final-tracked-files.sha256
          package=$(find phase4a-second-one-hour-qa/package -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          checksum=$(find phase4a-second-one-hour-qa/package -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          printf 'package_sha256=%s\n' "$actual" >> phase4a-second-one-hour-qa/result.env
      - name: Use Node.js 22 for packaged tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI for packaged tests
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Locate immutable package
        shell: bash
        run: |
          set -euo pipefail
          package=$(find phase4a-second-one-hour-qa/package -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          test -n "$package"
          echo "SABRI_PLUGIN_ZIP=$package" >> "$GITHUB_ENV"
      - name: Test packaged runtime on WordPress latest / PHP 8.3
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: |
          set -euo pipefail
          node tests/run-packaged-playground-integration-tests.mjs 2>&1 | tee phase4a-second-one-hour-qa/final/packaged-playground-latest-php-8.3.log
          node tests/run-date-permalink-playground-tests.mjs 2>&1 | tee -a phase4a-second-one-hour-qa/final/packaged-playground-latest-php-8.3.log
          node tests/run-phase4a-playground-tests.mjs 2>&1 | tee -a phase4a-second-one-hour-qa/final/packaged-playground-latest-php-8.3.log
      - name: Test packaged runtime on WordPress 6.8 / PHP 8.1
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: '6.8'
          SABRI_PLAYGROUND_PHP: '8.1'
        run: |
          set -euo pipefail
          node tests/run-packaged-playground-integration-tests.mjs 2>&1 | tee phase4a-second-one-hour-qa/final/packaged-playground-wp-6.8-php-8.1.log
          node tests/run-date-permalink-playground-tests.mjs 2>&1 | tee -a phase4a-second-one-hour-qa/final/packaged-playground-wp-6.8-php-8.1.log
          node tests/run-phase4a-playground-tests.mjs 2>&1 | tee -a phase4a-second-one-hour-qa/final/packaged-playground-wp-6.8-php-8.1.log
      - name: Re-verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PHASE4A_HEAD_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload passed mandatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4a-SECOND-ONE-HOUR-QA-PASSED-${{ env.PHASE4A_HEAD_SHA }}
          retention-days: 60
          path: phase4a-second-one-hour-qa/
          if-no-files-found: error

  merge-validation:
    name: Exact Phase 4A merge-commit validation
    needs: mandatory-second-one-hour
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE4A_MERGE_SHA }}
          fetch-depth: 1
      - name: Verify merge commit and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PHASE4A_MERGE_SHA}"
          grep -Fq 'Version: 1.0.0' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run merge-commit regressions and static checks
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Rebuild and verify merge package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase4a-post-merge
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase4a-post-merge
          cp "$package" phase4a-post-merge/merge-candidate.zip
          printf '%s  merge-candidate.zip\n' "$actual" > phase4a-post-merge/merge-package.sha256
          printf 'status=passed\nphase4a_head_sha=%s\nmerge_sha=%s\nmerge_package_sha256=%s\nplugin_version=1.0.0\nschema_version=1.0.0\ncheckpoint=4A\npublic_gates_enabled=0\nauto_publish_enabled=0\n' "${PHASE4A_HEAD_SHA}" "${PHASE4A_MERGE_SHA}" "$actual" > phase4a-post-merge/result.env
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4a-post-merge/merge-tracked-files.sha256
          sha256sum phase4a-post-merge/merge-tracked-files.sha256 > phase4a-post-merge/merge-manifest-digest.sha256
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload merge validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4a-POST-MERGE-VALIDATION-PASSED-${{ env.PHASE4A_MERGE_SHA }}
          retention-days: 60
          path: phase4a-post-merge/
          if-no-files-found: error

  acceptance:
    name: Retain Phase 4A mandatory acceptance record
    needs:
      - mandatory-second-one-hour
      - merge-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
      - name: Download mandatory evidence
        uses: actions/download-artifact@v4
        with:
          name: sabri-phase4a-SECOND-ONE-HOUR-QA-PASSED-${{ env.PHASE4A_HEAD_SHA }}
          path: mandatory-evidence
      - name: Download merge evidence
        uses: actions/download-artifact@v4
        with:
          name: sabri-phase4a-POST-MERGE-VALIDATION-PASSED-${{ env.PHASE4A_MERGE_SHA }}
          path: merge-evidence
      - name: Verify and retain final acceptance
        shell: bash
        run: |
          set -euo pipefail
          source mandatory-evidence/result.env
          test "$status" = "passed"
          test "$duration_seconds" -ge 3900
          test "$cycles_required" -eq 13
          test "$head_sha" = "${PHASE4A_HEAD_SHA}"
          grep -Fxq 'status=passed' merge-evidence/result.env
          grep -Fxq "phase4a_head_sha=${PHASE4A_HEAD_SHA}" merge-evidence/result.env
          grep -Fxq "merge_sha=${PHASE4A_MERGE_SHA}" merge-evidence/result.env
          mkdir -p phase4a-final-acceptance
          cp mandatory-evidence/result.env phase4a-final-acceptance/mandatory-result.env
          cp mandatory-evidence/cycles.log phase4a-final-acceptance/
          cp mandatory-evidence/initial-tracked-files.sha256 phase4a-final-acceptance/
          cp mandatory-evidence/final-tracked-files.sha256 phase4a-final-acceptance/
          cp merge-evidence/result.env phase4a-final-acceptance/merge-result.env
          cp merge-evidence/merge-package.sha256 phase4a-final-acceptance/
          cp merge-evidence/merge-manifest-digest.sha256 phase4a-final-acceptance/
      - name: Upload final Phase 4A acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4a-MANDATORY-POST-MERGE-QA-PASSED-${{ env.PHASE4A_HEAD_SHA }}
          retention-days: 60
          path: phase4a-final-acceptance/
          if-no-files-found: error
