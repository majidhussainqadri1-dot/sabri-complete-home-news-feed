name: Apply File 21 subject-policy fix

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2
    paths:
      - '.file21-subject-fix/files.tar.gz'
      - '.github/workflows/apply-file21-subject-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify, test, and apply bounded subject-policy fix
        shell: bash
        run: |
          set -euo pipefail
          echo '550e6172719ea508b4abceaa1f37c0afd37e8aa91309e5231dcfe8d9e58901ca  .file21-subject-fix/files.tar.gz' | sha256sum -c -
          tar -xzf .file21-subject-fix/files.tar.gz -C .
          php -l includes/class-composer-permissions.php
          php -l includes/class-privileged-publishing-policy.php
          php -l includes/class-legacy-founder-post-migration.php
          php tests/run-file21-corrective-tests.php
          php tests/run-file21-harmonization-tests.php
          php tests/run-file21-harmonization-negative-tests.php
          php tools/run-tests.php
          python3 tools/build-release.py --source-sha "${GITHUB_SHA}"
          rm -rf release .file21-subject-fix
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-composer-permissions.php includes/class-privileged-publishing-policy.php includes/class-legacy-founder-post-migration.php .file21-subject-fix/files.tar.gz
          git diff --cached --check
          git commit -m 'fix: separate actor authorization from author policy checks'
          git push origin "HEAD:${GITHUB_REF_NAME}"
