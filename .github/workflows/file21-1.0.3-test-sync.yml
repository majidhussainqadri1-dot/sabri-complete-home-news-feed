name: File 21 temporary 1.0.3 test synchronization

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/file21-1.0.3-test-sync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/file-21-production-rejection-1.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-21-production-rejection-1.0.3
          fetch-depth: 0
      - name: Synchronize tests and tools only
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('tests'), Path('tools')]
          files = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.php', '.mjs', '.js', '.ps1', '.sh'}:
                      files.append(path)

          old_packages = [
              '21-sabri-complete-home-news-feed-1.0.2-PUBLIC-VISIBILITY-CANDIDATE',
              '21-sabri-complete-home-news-feed-1.0.2-COMPATIBILITY-CANDIDATE',
              '21-sabri-complete-home-news-feed-1.0.1-HARMONIZED-CANDIDATE',
              '21-sabri-complete-home-news-feed-1.0.0-PHASE-3-STAGING-CANDIDATE',
              '21-sabri-complete-home-news-feed-1.0.0-PHASE-2-STAGING-CANDIDATE',
          ]
          current_package = '21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE'
          changed = []
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r"'1\.0\.2'(\s*===\s*\$identity\['version'\])", r"'1.0.3'\1", text)
              text = re.sub(r"\$identity\['version'\](\s*===\s*)'1\.0\.2'", r"$identity['version']\1'1.0.3'", text)
              text = re.sub(r"'1\.0\.2'(\s*===\s*SABRI_HNF_VERSION)", r"'1.0.3'\1", text)
              text = re.sub(r"SABRI_HNF_VERSION(\s*===\s*)'1\.0\.2'", r"SABRI_HNF_VERSION\1'1.0.3'", text)
              text = text.replace('Plugin identity runtime version must be 1.0.2.', 'Plugin identity runtime version must be 1.0.3.')
              text = text.replace('runtime 1.0.2 while preserving schema 1.0.0', 'runtime 1.0.3 while preserving schema 1.0.0')
              text = text.replace('runtime 1.0.1 while preserving schema 1.0.0', 'runtime 1.0.3 while preserving schema 1.0.0')
              text = text.replace('Version: 1.0.2', 'Version: 1.0.3')
              text = text.replace("SABRI_HNF_VERSION', '1.0.2", "SABRI_HNF_VERSION', '1.0.3")
              text = text.replace('plugin_version=1.0.2', 'plugin_version=1.0.3')
              text = text.replace('runtime_version=1.0.2', 'runtime_version=1.0.3')
              text = text.replace('version=1.0.2', 'version=1.0.3')
              for old in old_packages:
                  text = text.replace(old, current_package)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed))
      - name: Commit tests and tools synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests tools
          git diff --cached --quiet && exit 1
          git commit -m 'Synchronize File 21 1.0.3 test and tool assertions'
          git push origin HEAD:fix/file-21-production-rejection-1.0.3
