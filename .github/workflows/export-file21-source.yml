name: Export File 21 Exact Source

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=file21-exact-source.zip HEAD
          sha256sum file21-exact-source.zip > file21-exact-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: file21-exact-source-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            file21-exact-source.zip
            file21-exact-source.zip.sha256
