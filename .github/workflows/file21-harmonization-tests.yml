name: File 21 Comprehensive Harmonization Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'FILE-21-*.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/file21-harmonization-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file21-harmonization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    name: Harmonization contracts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Use PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' ! -path './vendor/*' ! -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Safe Boot settings recursion regression
        run: php tests/run-file21-settings-recursion-tests.php
      - name: Public visibility recovery contracts
        run: php tests/run-file21-public-visibility-tests.php
      - name: Harmonization positive contracts
        run: php tests/run-file21-harmonization-tests.php
      - name: Harmonization negative contracts
        run: php tests/run-file21-harmonization-negative-tests.php
      - name: Legacy interaction migration behavior
        run: php tests/run-file21-legacy-interaction-migration-tests.php
      - name: Phase 5 corrective contracts
        run: php tests/run-file21-corrective-tests.php
      - name: Phase 5 completion audit
        run: php tests/run-file21-completion-audit-tests.php
      - name: Phase 5 final contracts
        run: php tests/run-phase5-final-tests.php
      - name: Phase 5 security and privacy
        run: php tests/run-phase5-security-privacy-tests.php
      - name: Phase 5 migrations
        run: php tests/run-phase5-migration-tests.php
      - name: Phase 5 UI completeness
        run: php tests/run-phase5-ui-completeness-tests.php
      - name: Phase 5 traceability
        run: php tests/run-phase5-traceability-tests.php
      - name: Phase 4C behavior
        run: php tests/run-phase4c-public-news-tests.php
      - name: Phase 4C security
        run: php tests/run-phase4c-security-tests.php
      - name: Phase 4C UI completeness
        run: php tests/run-phase4c-ui-completeness-tests.php
      - name: Phase 4B newsroom behavior
        run: php tests/run-phase4b-newsroom-tests.php
      - name: Phase 4B UI completeness
        run: php tests/run-phase4b-ui-completeness-tests.php
      - name: Phase 4A content model
        run: php tests/run-phase4a-content-model-tests.php
      - name: Core regression suite
        run: php tools/run-tests.php
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/phase5-public.js
          node --check assets/js/phase5-admin.js
          node --check tests/run-phase5-playground-tests.mjs
          node --check tests/run-phase5-browser-tests.mjs
      - name: Static safety scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --include='*.php' '(eval\s*\(|shell_exec\s*\(|passthru\s*\(|proc_open\s*\()' includes admin public templates
          ! grep -RInE --include='*.php' '(DROP TABLE|TRUNCATE TABLE|DELETE FROM wp_posts)' includes admin public templates
          test -z "$(git status --porcelain --untracked-files=no)"

  package:
    name: Public visibility immutable package
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release file21-public-visibility-package
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE.sha256' ! -name '*-MANIFEST.sha256' -print -quit)
          manifest=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE-MANIFEST.sha256' -print -quit)
          test -n "$package" && test -n "$checksum" && test -n "$manifest"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          unzip -Z1 "$package" > package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/sabri-complete-home-news-feed.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-corrective-public-mount.php \
            sabri-complete-home-news-feed/includes/class-canonical-identity-adapter.php \
            sabri-complete-home-news-feed/includes/class-companion-integration-registry.php \
            sabri-complete-home-news-feed/includes/class-companion-home-row-adapters.php \
            sabri-complete-home-news-feed/includes/class-search-provider-registry.php \
            sabri-complete-home-news-feed/includes/class-viral-ranking-signals.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/includes/class-legacy-interaction-migration-adapter.php \
            sabri-complete-home-news-feed/includes/class-legacy-publication-migration.php \
            sabri-complete-home-news-feed/includes/class-legacy-publication-rollback.php \
            sabri-complete-home-news-feed/includes/class-harmonization-diagnostics.php \
            sabri-complete-home-news-feed/includes/class-harmonized-settings.php \
            sabri-complete-home-news-feed/admin/class-corrective-admin.php \
            sabri-complete-home-news-feed/admin/views/corrective-wizard.php \
            sabri-complete-home-news-feed/admin/views/migration.php \
            sabri-complete-home-news-feed/admin/views/system-check.php \
            sabri-complete-home-news-feed/assets/css/home-composition.css \
            sabri-complete-home-news-feed/assets/css/corrective-public.css \
            sabri-complete-home-news-feed/FILE-21-HARMONIZATION-COMPLETION-PLAN.md \
            sabri-complete-home-news-feed/FILE-21-PUBLIC-VISIBILITY-RECOVERY-1.0.2.md; do
            grep -Fxq "$entry" package-entries.txt
          done
          mkdir -p file21-public-visibility-package
          cp "$package" file21-public-visibility-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > file21-public-visibility-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > file21-public-visibility-package/exact-commit.txt
          cp package-entries.txt file21-public-visibility-package/
          cp "$manifest" file21-public-visibility-package/runtime-manifest.sha256
          printf 'status=passed\nhead_sha=%s\nplugin_version=1.0.2\nschema_version=1.0.0\npackage_sha256=%s\npublic_visibility_recovery=1\nlive_deployed=0\n' "${TEST_SHA}" "$actual" > file21-public-visibility-package/result.env
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: file21-public-visibility-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: file21-public-visibility-package/
          if-no-files-found: error
