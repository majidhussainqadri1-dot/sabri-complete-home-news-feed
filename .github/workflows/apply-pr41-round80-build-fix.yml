name: Apply PR41 Round 80 Lean Harness Fix

on:
  push:
    branches: [ file21-eighty-round-review-20260809 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: file21-eighty-round-review-20260809
          fetch-depth: 1
      - name: Complete lean WordPress core stubs required by stricter public rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/wp-stubs.php')
          s = p.read_text()
          day = "define( 'DAY_IN_SECONDS', 86400 );\n"
          if "define( 'HOUR_IN_SECONDS', 3600 );" not in s:
              if day not in s:
                  raise SystemExit('DAY_IN_SECONDS anchor missing')
              s = s.replace(day, day + "define( 'HOUR_IN_SECONDS', 3600 );\ndefine( 'WEEK_IN_SECONDS', 604800 );\n", 1)
          status = "function get_post_status( $post_id ) { return get_post_field( 'post_status', $post_id ); }\n"
          if 'function get_post_type(' not in s:
              if status not in s:
                  raise SystemExit('get_post_status anchor missing')
              s = s.replace(status, status + "function get_post_type( $post_id = 0 ) { return get_post_field( 'post_type', $post_id ); }\n", 1)
          p.write_text(s)
          PY
      - name: Verify the exact behavior suite and eighty-round evidence
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/wp-stubs.php
          php tests/run-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-eighty-round-review-tests.php
      - name: Commit harness correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git rm .github/workflows/apply-pr41-round80-build-fix.yml
          git add tests/wp-stubs.php
          git diff --cached --check
          git commit -m 'Fix Round 80 lean WordPress behavior harness'
          git push origin HEAD:file21-eighty-round-review-20260809
