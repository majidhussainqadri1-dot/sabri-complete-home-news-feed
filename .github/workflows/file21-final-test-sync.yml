name: File 21 final runtime assertion synchronization

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/file21-final-test-sync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/file-21-production-rejection-1.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-21-production-rejection-1.0.3
          fetch-depth: 0
      - name: Update current runtime assertions only
        shell: python
        run: |
          from pathlib import Path
          import re
          changed = []
          for root in (Path('tests'), Path('tools')):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php','.mjs','.js','.ps1','.sh'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  replacements = {
                      "result.version === '1.0.2'": "result.version === '1.0.3'",
                      "version === '1.0.2'": "version === '1.0.3'",
                      "'version' => '1.0.2'": "'version' => '1.0.3'",
                      "'runtime_version' => '1.0.2'": "'runtime_version' => '1.0.3'",
                      "runtime_version=1.0.2": "runtime_version=1.0.3",
                      "plugin_version=1.0.2": "plugin_version=1.0.3",
                      "Version: 1.0.2": "Version: 1.0.3",
                      "SABRI_HNF_VERSION', '1.0.2": "SABRI_HNF_VERSION', '1.0.3",
                      "expectedVersion = '1.0.2'": "expectedVersion = '1.0.3'",
                  }
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  text = re.sub(r"(['\"])1\.0\.2\1(\s*[,;&)]\s*.*(?:runtime|plugin|identity|version))", lambda m: m.group(0).replace('1.0.2','1.0.3'), text, flags=re.I)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
      - name: Commit tests/tools only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests tools
          git diff --cached --quiet && exit 1
          git commit -m 'Synchronize remaining File 21 1.0.3 runtime assertions'
          git push origin HEAD:fix/file-21-production-rejection-1.0.3
