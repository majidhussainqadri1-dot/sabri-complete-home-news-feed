name: Build and Test Home News Feed

on:
  pull_request:
  push:
    branches:
      - main
      - build/**
  workflow_dispatch:

jobs:
  build-test:
    name: Build, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runtime versions
        run: |
          php -v
          node -v
          pwsh -v

      - name: PHP syntax lint
        run: find . -name '*.php' -not -path './release/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Complete PHP behavior test suite
        shell: bash
        run: |
          set -o pipefail
          php tools/run-tests.php 2>&1 | tee phase2-behavior-test.log

      - name: Phase 3 checkpoint contract tests
        run: php tests/run-phase3-contract-tests.php

      - name: Phase 3A infrastructure tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3-infrastructure-tests.php 2>&1 | tee phase3a-test.log

      - name: Phase 3B reactions and saves tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3b-reactions-saves-tests.php 2>&1 | tee phase3b-test.log

      - name: Phase 3B race and Saved Posts tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3b-race-shortcode-tests.php 2>&1 | tee phase3b-race-test.log

      - name: Phase 3C comments and replies tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3c-comments-tests.php 2>&1 | tee phase3c-test.log

      - name: Phase 3D Follow and Following tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3d-follows-tests.php 2>&1 | tee phase3d-test.log

      - name: Phase 3E reports and moderation tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3e-reports-tests.php 2>&1 | tee phase3e-test.log

      - name: Phase 3F Polls tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3f-polls-tests.php 2>&1 | tee phase3f-test.log

      - name: Phase 3G Notification Bridge and Views tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3g-notifications-views-tests.php 2>&1 | tee phase3g-test.log

      - name: Phase 3H hardening and release-readiness tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-phase3h-hardening-tests.php 2>&1 | tee phase3h-test.log

      - name: WordPress dynamic option-filter compatibility tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-wordpress-option-filter-compatibility-tests.php 2>&1 | tee wordpress-option-filter-test.log

      - name: Duplicate plugin-folder activation compatibility tests
        shell: bash
        run: |
          set -o pipefail
          php tests/run-duplicate-plugin-compat-tests.php 2>&1 | tee duplicate-plugin-test.log

      - name: Upload Phase 3 test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-test-logs
          path: |
            phase2-behavior-test.log
            phase3a-test.log
            phase3b-test.log
            phase3b-race-test.log
            phase3c-test.log
            phase3d-test.log
            phase3e-test.log
            phase3f-test.log
            phase3g-test.log
            phase3h-test.log
            wordpress-option-filter-test.log
            duplicate-plugin-test.log
          if-no-files-found: warn

      - name: JavaScript syntax validation
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: CSS, JSON, security, and whitespace checks
        shell: pwsh
        run: ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build Phase 3 staging candidate
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: ZIP structure verification
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem release/*-PHASE-3-STAGING-CANDIDATE.zip | Select-Object -First 1
          if (-not $zip) {
            throw 'Phase 3 staging candidate ZIP was not created.'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
            if (-not ($entries | Where-Object { $_ -eq 'sabri-complete-home-news-feed/' })) {
              throw 'Missing single top-level plugin folder.'
            }
            if (-not ($entries | Where-Object { $_ -eq 'sabri-complete-home-news-feed/sabri-complete-home-news-feed.php' })) {
              throw 'Missing main WordPress plugin file.'
            }
            if (-not ($entries | Where-Object { $_ -eq 'sabri-complete-home-news-feed/includes/class-poll-composer-integration.php' })) {
              throw 'Missing corrected Poll Composer integration.'
            }
            $bad = $entries | Where-Object {
              $_ -match '^(\.github|tools|tests|release|vendor|node_modules|TASK_LOG\.md|\.gitignore)' -or
              $_ -match '^sabri-complete-home-news-feed/(\.github|tools|tests|release|vendor|node_modules|TASK_LOG\.md|\.gitignore)' -or
              $_ -match '\.log$'
            }
            if ($bad) {
              throw "Development files included in staging ZIP: $($bad -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: SHA-256 verification
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-PHASE-3-STAGING-CANDIDATE.zip | Select-Object -First 1
          $sha = Get-ChildItem release/*-PHASE-3-STAGING-CANDIDATE.sha256 | Select-Object -First 1
          if (-not $zip -or -not $sha) {
            throw 'Staging ZIP or checksum file is missing.'
          }
          $expected = (Get-Content $sha.FullName -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw 'SHA-256 mismatch.'
          }

      - name: Upload Phase 3 staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: sabri-home-news-feed-phase-3-staging-candidate
          path: |
            release/*-PHASE-3-STAGING-CANDIDATE.zip
            release/*-PHASE-3-STAGING-CANDIDATE.sha256
            release/*-PHASE-3-STAGING-CANDIDATE-TEST-REPORT.md
