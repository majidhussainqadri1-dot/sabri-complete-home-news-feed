name: Build and Test Home News Feed

on:
  pull_request:
  push:
    branches:
      - main
      - build/**
      - fix/**
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE

jobs:
  build-test:
    name: Exact-head build, regression, and canonical package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1

      - name: Show and verify runtime versions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          php -v
          node -v
          pwsh -v
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: PHP syntax lint
        run: find . -name '*.php' -not -path './release/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Complete PHP behavior and phase regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/run-phase3-contract-tests.php
            tests/run-phase3-infrastructure-tests.php
            tests/run-phase3b-reactions-saves-tests.php
            tests/run-phase3b-race-shortcode-tests.php
            tests/run-phase3c-comments-tests.php
            tests/run-phase3d-follows-tests.php
            tests/run-phase3e-reports-tests.php
            tests/run-phase3f-polls-tests.php
            tests/run-phase3g-notifications-views-tests.php
            tests/run-phase3h-hardening-tests.php
            tests/run-phase3-social-features-share-tests.php
            tests/run-public-query-routing-tests.php
            tests/run-wordpress-option-filter-compatibility-tests.php
            tests/run-duplicate-plugin-compat-tests.php
            tests/run-file21-settings-recursion-tests.php
            tests/run-file21-production-rejection-tests.php
            tests/run-file21-public-visibility-tests.php
            tests/run-file21-harmonization-tests.php
            tests/run-file21-harmonization-negative-tests.php
            tests/run-file21-corrective-tests.php
            tests/run-file21-completion-audit-tests.php
            tests/run-file21-legacy-interaction-migration-tests.php
            tests/run-file21-file22-founder-gateway-regression.php
            tests/run-file21-file23-provider-integration-tests.php
            tests/run-file21-file26-connector-contract-tests.php
            tests/run-file21-four-plan-final-completion-tests.php
          )
          : > exact-head-regression.log
          php tools/run-tests.php 2>&1 | tee -a exact-head-regression.log
          for test in "${tests[@]}"; do
            printf '\n=== %s ===\n' "$test" | tee -a exact-head-regression.log
            FILE21_ROOT="$PWD" php "$test" 2>&1 | tee -a exact-head-regression.log
          done

      - name: JavaScript syntax validation
        run: |
          set -euo pipefail
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do node --check "$test"; done

      - name: Static security and whitespace checks
        shell: pwsh
        run: ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build canonical corrective package
        shell: bash
        run: python3 tools/build-release.py --source-sha "${TEST_SHA}"

      - name: Verify canonical ZIP, checksum, manifest, and structure
        shell: bash
        run: |
          set -euo pipefail
          package="release/${CANONICAL_BASE}.zip"
          checksum="release/${CANONICAL_BASE}.sha256"
          manifest="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$package" && test -f "$checksum" && test -f "$manifest" && test -f "$report"
          grep -Fq -- "- Exact source commit: ${TEST_SHA}" "$report"
          grep -Fq -- "- Canonical global Search/Discovery/Ranking owner: File 26" "$report"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          unzip -Z1 "$package" > package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/sabri-complete-home-news-feed.php \
            sabri-complete-home-news-feed/includes/class-home-integration.php \
            sabri-complete-home-news-feed/includes/class-public-query-guard.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/includes/class-integrations.php \
            sabri-complete-home-news-feed/includes/class-search-provider-registry.php \
            sabri-complete-home-news-feed/includes/class-file23-publishing-dashboard-bridge.php \
            sabri-complete-home-news-feed/public/class-news-public-runtime.php; do
            grep -Fxq "$entry" package-entries.txt
          done
          if grep -Eq '^sabri-complete-home-news-feed/(\.github|tools|tests|release|vendor|node_modules)/' package-entries.txt; then
            echo 'Development-only files are present in the package.'
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload canonical package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file21-canonical-candidate-${{ env.TEST_SHA }}
          path: |
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE.zip
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE.sha256
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE-MANIFEST.sha256
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE-TEST-REPORT.md
            exact-head-regression.log
            package-entries.txt
          if-no-files-found: warn
          retention-days: 30

  playground-integration:
    name: Real Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run activation, Pages, social actions, deactivation, and reactivation
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-playground-integration-tests.mjs 2>&1 | tee playground-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload Playground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          path: playground-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: warn
          retention-days: 30
