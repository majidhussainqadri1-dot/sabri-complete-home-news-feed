name: Fix File 21 Core Runtime Identity 1.0.2

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-file21-core-runtime-identity-1.0.2.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'fix/file-21-public-surface-visibility-1.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-21-public-surface-visibility-1.0.2
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Update only the promoted runtime identity assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/run-tests.php')
          text = p.read_text(encoding='utf-8')
          old = "sabri_assert( '1.0.1' === $identity['version'], 'Plugin identity version must be 1.0.0.' );"
          new = "sabri_assert( '1.0.2' === $identity['version'], 'Plugin identity runtime version must be 1.0.2.' );"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one old runtime identity assertion.')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-file21-core-runtime-identity-1.0.2.yml
          php -l tests/run-tests.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update File 21 core runtime identity assertion to 1.0.2'
          git push origin HEAD:fix/file-21-public-surface-visibility-1.0.2
