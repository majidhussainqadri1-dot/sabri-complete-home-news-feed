name: Phase 4 One-Hour Planning QA

on:
  push:
    branches:
      - build/phase-4-editorial-news-1.2.0
    paths:
      - 'PHASE-4-*.md'
      - 'tests/run-phase4-contract-tests.php'
      - 'tests/run-phase4-document-audit.php'
      - 'tests/run-phase4-one-hour-document-qa.sh'
      - '.github/workflows/phase4-one-hour-document-qa.yml'
  pull_request:
    paths:
      - 'PHASE-4-*.md'
      - 'tests/run-phase4-contract-tests.php'
      - 'tests/run-phase4-document-audit.php'
      - 'tests/run-phase4-one-hour-document-qa.sh'
      - '.github/workflows/phase4-one-hour-document-qa.yml'
  workflow_dispatch:

concurrency:
  group: phase4-one-hour-planning-qa-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  repeated-planning-qa:
    name: 65-minute repeated contract and document QA
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Fresh checkout of exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short

      - name: Execute repeated Phase 4 planning QA
        shell: bash
        run: bash tests/run-phase4-one-hour-document-qa.sh

      - name: Verify duration, cycles, commit, and manifest
        shell: bash
        run: |
          set -euo pipefail
          source phase4-one-hour-document-qa/result.env
          test "$status" = "passed"
          test "$duration_seconds" -ge 3900
          test "$cycles" -eq 13
          test "$final_commit" = "$(git rev-parse HEAD)"
          test -n "$document_manifest_sha256"
          actual_manifest_sha="$(sha256sum phase4-one-hour-document-qa/initial-document-manifest.sha256 | awk '{print $1}')"
          test "$document_manifest_sha256" = "$actual_manifest_sha"

      - name: Upload passed QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4-PLANNING-ONE-HOUR-QA-PASSED
          retention-days: 30
          path: |
            phase4-one-hour-document-qa/
            phase4-document-audit/manifest.json

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-planning-one-hour-qa-failure-evidence
          retention-days: 30
          path: |
            phase4-one-hour-document-qa/
            phase4-document-audit/
          if-no-files-found: warn
