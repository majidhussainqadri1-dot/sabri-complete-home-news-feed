name: Phase 5 Mandatory Two-Hour Visible QA v3

on:
  pull_request:
    branches:
      - build/phase-4c-public-news-1.2.0
    paths:
      - 'PHASE-5-*.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'uninstall.php'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/phase5-final-completion-tests.yml'
      - '.github/workflows/phase5-two-hour-visible-qa-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-two-hour-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Exact-head preflight and immutable pre-soak package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fq 'Version: 1.0.0' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run complete pre-soak acceptance
        shell: bash
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/phase5-public.js
          node --check assets/js/phase5-admin.js
          node --check tests/run-phase5-playground-tests.mjs
          node --check tests/run-phase5-browser-tests.mjs
          node --check tests/run-phase5-performance-playground.mjs
          bash tools/run-phase5-local-tests.sh
          php tests/run-phase4c-public-news-tests.php
          php tests/run-phase4c-security-tests.php
          php tests/run-phase4c-ui-completeness-tests.php
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Build immutable pre-soak package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase5-two-hour-package
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*.sha256' ! -name '*-MANIFEST.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase5-two-hour-package
          cp "$package" phase5-two-hour-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase5-two-hour-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > phase5-two-hour-package/exact-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-two-hour-v3-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-two-hour-package/
          if-no-files-found: error

  source-playground:
    name: Pre-soak source WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source lifecycle
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase5-playground-tests.mjs 2>&1 | tee source-${{ matrix.wp }}-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-two-hour-v3-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: source-${{ matrix.wp }}-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Pre-soak packaged WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: [preflight, source-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-two-hour-v3-package-${{ env.TEST_SHA }}
          path: phase5-two-hour-package
      - run: cd phase5-two-hour-package && sha256sum -c candidate.sha256 && unzip -tqq candidate.zip && test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged lifecycle
        env:
          SABRI_PLUGIN_ZIP: phase5-two-hour-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase5-playground-tests.mjs 2>&1 | tee packaged-${{ matrix.wp }}-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-two-hour-v3-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: packaged-${{ matrix.wp }}-${{ matrix.php }}.log
          if-no-files-found: error

  two-hour-soak:
    name: Observable uninterrupted 7,200-second, 24-cycle soak v3
    needs: packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Run exactly 24 complete cycles for at least 7,200 seconds
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly MINIMUM_SECONDS=7200
          readonly REQUIRED_CYCLES=24
          readonly CYCLE_INTERVAL_SECONDS=300
          readonly START_EPOCH=$(date +%s)
          mkdir -p phase5-two-hour-soak/cycle-logs
          git rev-parse HEAD > phase5-two-hour-soak/exact-commit.txt
          test "$(cat phase5-two-hour-soak/exact-commit.txt)" = "${TEST_SHA}"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase5-two-hour-soak/initial-tracked-files.sha256

          current_cycle=0
          on_error() {
            status=$?
            now=$(date +%s)
            printf 'status=failed\nhead_sha=%s\ncycle=%s\nelapsed_seconds=%s\nexit_status=%s\n' "${TEST_SHA}" "$current_cycle" "$((now-START_EPOCH))" "$status" > phase5-two-hour-soak/failure.env
            exit "$status"
          }
          trap on_error ERR

          run_complete_suite() {
            bash tools/run-phase5-local-tests.sh
            php tests/run-phase4c-public-news-tests.php
            php tests/run-phase4c-security-tests.php
            php tests/run-phase4c-ui-completeness-tests.php
            php tests/run-phase4b-newsroom-tests.php
            php tests/run-phase4b-ui-completeness-tests.php
            php tests/run-phase4a-content-model-tests.php
            php tools/run-tests.php
            node --check assets/js/phase5-public.js
            node --check assets/js/phase5-admin.js
            node --check tests/run-phase5-playground-tests.mjs
            node --check tests/run-phase5-browser-tests.mjs
            node --check tests/run-phase5-performance-playground.mjs
            pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
          }

          verify_fresh_package() {
            rm -rf release
            pwsh -NoProfile -File ./tools/build-release.ps1
            local package checksum expected actual
            package=$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)
            checksum=$(find release -maxdepth 1 -type f -name '*.sha256' ! -name '*-MANIFEST.sha256' -print -quit)
            test -n "$package" && test -n "$checksum"
            expected=$(awk '{print tolower($1)}' "$checksum")
            actual=$(sha256sum "$package" | awk '{print $1}')
            test "$expected" = "$actual"
            test "${#actual}" -eq 64
            unzip -tqq "$package"
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-phase5-database.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-phase5-rest.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/public/class-phase5-public-runtime.php'
            LAST_PACKAGE="$package"
            LAST_PACKAGE_SHA="$actual"
          }

          LAST_PACKAGE=''
          LAST_PACKAGE_SHA=''
          for cycle in $(seq 1 "${REQUIRED_CYCLES}"); do
            current_cycle=$cycle
            cycle_start=$(date +%s)
            log_file=$(printf 'phase5-two-hour-soak/cycle-logs/cycle-%02d.log' "$cycle")
            {
              printf 'Starting cycle %02d at %s\n' "$cycle" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              test "$(git rev-parse HEAD)" = "${TEST_SHA}"
              run_complete_suite
              verify_fresh_package
              test -n "$LAST_PACKAGE"
              test "${#LAST_PACKAGE_SHA}" -eq 64
              test -z "$(git status --porcelain --untracked-files=no)"
            } > >(tee "$log_file") 2>&1
            wait
            cycle_end=$(date +%s)
            printf 'cycle=%02d start_epoch=%s end_epoch=%s elapsed=%s package_sha256=%s\n' "$cycle" "$cycle_start" "$cycle_end" "$((cycle_end-cycle_start))" "$LAST_PACKAGE_SHA" >> phase5-two-hour-soak/cycles.log
            if [ "$cycle" -lt "${REQUIRED_CYCLES}" ]; then
              target_epoch=$((START_EPOCH + cycle * CYCLE_INTERVAL_SECONDS))
              now_epoch=$(date +%s)
              if [ "$now_epoch" -lt "$target_epoch" ]; then sleep "$((target_epoch-now_epoch))"; fi
            fi
          done

          minimum_end=$((START_EPOCH + MINIMUM_SECONDS))
          now_epoch=$(date +%s)
          if [ "$now_epoch" -lt "$minimum_end" ]; then sleep "$((minimum_end-now_epoch))"; fi

          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -n "$LAST_PACKAGE"
          test "${#LAST_PACKAGE_SHA}" -eq 64
          test "$(grep -Ec '^cycle=[0-9]{2} .* package_sha256=[0-9a-f]{64}$' phase5-two-hour-soak/cycles.log)" -eq "$REQUIRED_CYCLES"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase5-two-hour-soak/final-tracked-files.sha256
          cmp phase5-two-hour-soak/initial-tracked-files.sha256 phase5-two-hour-soak/final-tracked-files.sha256
          sha256sum phase5-two-hour-soak/initial-tracked-files.sha256 > phase5-two-hour-soak/tracked-manifest-digest.sha256
          sha256sum PHASE-5-DATABASE-SCHEMA-MANIFEST.md > phase5-two-hour-soak/schema-document.sha256
          sha256sum PHASE-5-MIGRATION-UPGRADE-GUIDE.md > phase5-two-hour-soak/migration-guide.sha256
          cp "$LAST_PACKAGE" phase5-two-hour-soak/final-candidate.zip
          printf '%s  final-candidate.zip\n' "$LAST_PACKAGE_SHA" > phase5-two-hour-soak/final-package.sha256
          END_EPOCH=$(date +%s)
          DURATION_SECONDS=$((END_EPOCH-START_EPOCH))
          COMPLETED_CYCLES=$(wc -l < phase5-two-hour-soak/cycles.log | tr -d ' ')
          test "$DURATION_SECONDS" -ge "$MINIMUM_SECONDS"
          test "$COMPLETED_CYCLES" -eq "$REQUIRED_CYCLES"
          manifest_sha=$(awk '{print $1}' phase5-two-hour-soak/tracked-manifest-digest.sha256)
          schema_sha=$(awk '{print $1}' phase5-two-hour-soak/schema-document.sha256)
          migration_sha=$(awk '{print $1}' phase5-two-hour-soak/migration-guide.sha256)
          printf 'status=soak-passed\nhead_sha=%s\nduration_seconds=%s\ncycles=%s\npackage_sha256=%s\ntracked_manifest_sha256=%s\nschema_document_sha256=%s\nmigration_guide_sha256=%s\npublic_gates_enabled=0\nauto_publish_enabled=0\n' "${TEST_SHA}" "$DURATION_SECONDS" "$COMPLETED_CYCLES" "$LAST_PACKAGE_SHA" "$manifest_sha" "$schema_sha" "$migration_sha" > phase5-two-hour-soak/result.env
          rm -rf release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-two-hour-v3-soak-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-two-hour-soak/
          if-no-files-found: error

  final-packaged-playground:
    name: Final packaged WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: two-hour-soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-two-hour-v3-soak-${{ env.TEST_SHA }}
          path: phase5-two-hour-soak
      - run: cd phase5-two-hour-soak && sha256sum -c final-package.sha256 && unzip -tqq final-candidate.zip && test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run final packaged lifecycle
        env:
          SABRI_PLUGIN_ZIP: phase5-two-hour-soak/final-candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase5-playground-tests.mjs 2>&1 | tee final-${{ matrix.wp }}-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-two-hour-v3-final-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: final-${{ matrix.wp }}-${{ matrix.php }}.log
          if-no-files-found: error

  acceptance:
    name: Retain passed two-hour Phase 5 acceptance
    needs: [two-hour-soak, final-packaged-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-two-hour-v3-soak-${{ env.TEST_SHA }}
          path: phase5-two-hour-soak
      - name: Verify and retain acceptance record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fxq 'status=soak-passed' phase5-two-hour-soak/result.env
          grep -Fxq "head_sha=${TEST_SHA}" phase5-two-hour-soak/result.env
          duration=$(awk -F= '$1=="duration_seconds"{print $2}' phase5-two-hour-soak/result.env)
          cycles=$(awk -F= '$1=="cycles"{print $2}' phase5-two-hour-soak/result.env)
          package_sha=$(awk -F= '$1=="package_sha256"{print $2}' phase5-two-hour-soak/result.env)
          test "$duration" -ge 7200
          test "$cycles" -eq 24
          test "${#package_sha}" -eq 64
          test "$(grep -Ec '^cycle=[0-9]{2} .* package_sha256=[0-9a-f]{64}$' phase5-two-hour-soak/cycles.log)" -eq 24
          cmp phase5-two-hour-soak/initial-tracked-files.sha256 phase5-two-hour-soak/final-tracked-files.sha256
          (cd phase5-two-hour-soak && sha256sum -c final-package.sha256)
          mkdir -p phase5-two-hour-acceptance
          cp phase5-two-hour-soak/result.env phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/cycles.log phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/tracked-manifest-digest.sha256 phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/schema-document.sha256 phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/migration-guide.sha256 phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/final-package.sha256 phase5-two-hour-acceptance/
          cp phase5-two-hour-soak/exact-commit.txt phase5-two-hour-acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: sabri-phase5-TWO-HOUR-VISIBLE-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-two-hour-acceptance/
          if-no-files-found: error
