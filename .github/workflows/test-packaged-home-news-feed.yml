name: Test Packaged Home News Feed

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'build/**', 'fix/**' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACKAGE_BASE: 21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE

jobs:
  packaged-playground:
    name: Packaged QA (${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and run release contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fq 'Version: 1.0.3' sabri-complete-home-news-feed.php
          grep -Fq 'Stable tag: 1.0.3' readme.txt
          FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php
          php tests/run-file21-settings-recursion-tests.php
          php tests/run-file21-public-visibility-tests.php
          php tests/run-file21-harmonization-tests.php
      - name: Build canonical candidate ZIP
        run: pwsh -NoProfile -File ./tools/build-release.ps1
      - name: Resolve and verify canonical package
        run: |
          set -euo pipefail
          package="release/${PACKAGE_BASE}.zip"
          checksum="release/${PACKAGE_BASE}.sha256"
          manifest="release/${PACKAGE_BASE}-MANIFEST.sha256"
          test -f "$package" && test -f "$checksum" && test -f "$manifest"
          test "$(awk '{print tolower($1)}' "$checksum")" = "$(sha256sum "$package" | awk '{print $1}')"
          unzip -tqq "$package"
          printf 'SABRI_PLUGIN_ZIP=%s\n' "$package" >> "$GITHUB_ENV"
          printf 'SABRI_PLUGIN_SHA=%s\n' "$checksum" >> "$GITHUB_ENV"
          printf 'SABRI_PLUGIN_MANIFEST=%s\n' "$manifest" >> "$GITHUB_ENV"
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Test exact packaged ZIP through WordPress installer
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-packaged-playground-integration-tests.mjs 2>&1 | tee packaged-playground-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Reproduce Day and name permalink
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-date-permalink-playground-tests.mjs 2>&1 | tee date-permalink-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Verify package inventory
        run: |
          set -euo pipefail
          unzip -Z1 "$SABRI_PLUGIN_ZIP" > package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/sabri-complete-home-news-feed.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-corrective-public-mount.php \
            sabri-complete-home-news-feed/includes/class-public-query-guard.php \
            sabri-complete-home-news-feed/includes/class-integrations.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/includes/class-rest-foundation.php \
            sabri-complete-home-news-feed/public/class-news-routing.php \
            sabri-complete-home-news-feed/public/class-phase5-public-runtime.php \
            sabri-complete-home-news-feed/includes/class-profile-timeline.php \
            sabri-complete-home-news-feed/FILE-21-PRODUCTION-REJECTION-CORRECTIVE-1.0.3.md; do
            grep -Fxq "$entry" package-entries.txt
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-qa-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: |
            packaged-playground-${{ matrix.wp }}-php-${{ matrix.php }}.log
            date-permalink-${{ matrix.wp }}-php-${{ matrix.php }}.log
            package-entries.txt
          if-no-files-found: warn

  second-independent-qa:
    name: Mandatory second independent QA
    needs: packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent source regressions
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './release/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > second-qa-php-lint.log
          FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php | tee second-qa-production-rejection.log
          php tests/run-file21-settings-recursion-tests.php | tee second-qa-safe-boot.log
          php tests/run-phase3-social-features-share-tests.php | tee second-qa-social-features.log
      - run: pwsh -NoProfile -File ./tools/build-release.ps1
      - name: Resolve package
        run: |
          set -euo pipefail
          package="release/${PACKAGE_BASE}.zip"
          checksum="release/${PACKAGE_BASE}.sha256"
          test -f "$package" && test -f "$checksum"
          printf 'SABRI_PLUGIN_ZIP=%s\n' "$package" >> "$GITHUB_ENV"
          printf 'SABRI_PLUGIN_SHA=%s\n' "$checksum" >> "$GITHUB_ENV"
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Re-run packaged lifecycle and social surface
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: |
          node tests/run-packaged-playground-integration-tests.mjs 2>&1 | tee second-qa-packaged-playground.log
          node tests/run-date-permalink-playground-tests.mjs 2>&1 | tee second-qa-date-permalink.log
      - name: Independently verify ZIP and checksum
        run: |
          set -euo pipefail
          test "$(awk '{print tolower($1)}' "$SABRI_PLUGIN_SHA")" = "$(sha256sum "$SABRI_PLUGIN_ZIP" | awk '{print $1}')"
          unzip -tqq "$SABRI_PLUGIN_ZIP"
          unzip -Z1 "$SABRI_PLUGIN_ZIP" > second-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/admin/views/social-features.php' second-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/assets/js/share.js' second-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/templates/action-bar.php' second-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/public/class-news-routing.php' second-package-entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sabri-home-news-feed-PRODUCTION-REJECTION-SECOND-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: |
            release/*PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE.zip
            release/*PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE.sha256
            release/*PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE-TEST-REPORT.md
            release/*PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE-MANIFEST.sha256
            second-qa-php-lint.log
            second-qa-production-rejection.log
            second-qa-safe-boot.log
            second-qa-social-features.log
            second-qa-packaged-playground.log
            second-qa-date-permalink.log
            second-package-entries.txt
          if-no-files-found: error
