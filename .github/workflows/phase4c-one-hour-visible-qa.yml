name: Phase 4C Long QA — Disabled

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/phase4c-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4c-visible-one-hour-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stopped:
    name: Long QA stopped by repository owner
    runs-on: ubuntu-latest
    steps:
      - name: Confirm disabled state
        run: |
          echo "The Phase 4C one-hour/3,900-second QA has been disabled at the repository owner's request."
          echo "No soak cycles or waiting intervals are executed."
