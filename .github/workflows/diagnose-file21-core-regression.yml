name: Diagnose File 21 Core Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-file21-core-regression.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/file-21-public-surface-visibility-1.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-21-public-surface-visibility-1.0.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Capture exact core regression output
        id: core
        shell: bash
        run: |
          set +e
          php tests/run-tests.php > core-regression.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat core-regression.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: file21-core-regression-${{ github.event.pull_request.head.sha }}
          path: core-regression.log
          if-no-files-found: error
      - name: Preserve failing status
        if: steps.core.outputs.status != '0'
        run: exit 1
