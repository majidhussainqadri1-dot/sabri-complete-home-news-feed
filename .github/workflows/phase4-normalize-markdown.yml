name: Phase 4 Normalize Markdown Newlines

on:
  push:
    branches:
      - build/phase-4-editorial-news-1.2.0
    paths:
      - '.github/workflows/phase4-normalize-markdown.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-final-newlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: build/phase-4-editorial-news-1.2.0
          fetch-depth: 0

      - name: Append exactly one final newline where missing
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('PHASE-4-CONTRACTS-ADDENDUM-1.md'),
              Path('PHASE-4-EDITORIAL-POLICY.md'),
              Path('PHASE-4-HOSTINGER-STAGING-ACCEPTANCE-CHECKLIST.md'),
              Path('PHASE-4-ROLLBACK-RUNBOOK.md'),
              Path('PHASE-4-COMPLETENESS-AUDIT.md'),
          ]

          for path in files:
              data = path.read_bytes()
              if not data.endswith(b'\n'):
                  path.write_bytes(data + b'\n')

      - name: Commit normalization only when required
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE-4-CONTRACTS-ADDENDUM-1.md \
                  PHASE-4-EDITORIAL-POLICY.md \
                  PHASE-4-HOSTINGER-STAGING-ACCEPTANCE-CHECKLIST.md \
                  PHASE-4-ROLLBACK-RUNBOOK.md \
                  PHASE-4-COMPLETENESS-AUDIT.md
          if git diff --cached --quiet; then
            echo "All selected Markdown files already have final newlines."
            exit 0
          fi
          git commit -m "Normalize Phase 4 Markdown final newlines"
          git push origin HEAD:build/phase-4-editorial-news-1.2.0
