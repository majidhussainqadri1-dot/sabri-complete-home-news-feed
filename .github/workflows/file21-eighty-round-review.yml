name: File 21 Independent Eighty-Round Review Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'includes/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'docs/FILE21-EIGHTY-ROUND-REVIEW-2026-08-09.md'
      - '.github/workflows/file21-eighty-round-review.yml'
      - '.github/workflows/file21-latest-companion-exact-contracts.yml'
      - '.github/workflows/file21-fourth-fresh-ten-review.yml'
      - '.github/workflows/file21-fifth-fresh-ten-review.yml'
  push:
    branches:
      - main
      - 'file21-eighty-round-review-20260809'
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE21_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE

jobs:
  eighty-round:
    name: Eighty-round exact-source/package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact File 21 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FILE21_EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FILE21_EXPECTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Syntax and eighty-round executable evidence
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/class-next-generation-feed.php
          php -l includes/class-next-generation-hardening.php
          php -l includes/class-next-generation-integrations.php
          php -l includes/class-rest-next-generation.php
          php -l includes/class-feed-renderer.php
          php -l includes/class-news-public-projector.php
          php -l includes/class-profile-timeline.php
          php -l includes/class-comment-service.php
          php -l templates/news-card.php
          php -l tests/run-file21-eighty-round-review-tests.php
          node --check assets/js/next-generation-accessibility.js
          FILE21_ROOT="$PWD" php tests/run-file21-eighty-round-review-tests.php

      - name: Re-run governing and affected regressions
        shell: bash
        run: |
          set -euo pipefail
          FILE21_ROOT="$PWD" php tests/run-file21-next-generation-30-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-fifth-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-fourth-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-third-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-latest-plan-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-four-plan-audit-1.0.5.php
          FILE21_ROOT="$PWD" php tests/run-file21-public-visibility-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-file23-provider-integration-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-file26-connector-contract-tests.php

      - name: Verify current companion pins
        shell: bash
        run: |
          set -euo pipefail
          companion=.github/workflows/file21-latest-companion-exact-contracts.yml
          grep -Fq 'FILE00_SHA: 3a84c32a6ddad151f2ed09d244fa8aa536a58108' "$companion"
          grep -Fq 'FILE02_SHA: e352aab7e3bd32bbbe82fc26424a3623b9c71a56' "$companion"
          grep -Fq 'FILE04_SHA: 4d6266413b377fda451894b1c7076f2ce93f50fc' "$companion"
          grep -Fq 'FILE20_SHA: 7b4019091d1f83ef4cd9dc3f559abb2b3a95955d' "$companion"
          grep -Fq 'FILE23_SHA: a8a8c805f4730998ccb44bd95c87591836561759' "$companion"
          grep -Fq 'FILE24_SHA: 2b303722e68869cc59cfd0a621f770e5b2826ebf' "$companion"
          grep -Fq 'FILE19_CONTRACT_SHA: 5cb83d399f35ae1636415fb83373b6ba282e3685' .github/workflows/file21-file19-exact-contract.yml
          grep -Fq 'FILE22_RUNTIME_SHA: 1274e380268c2ab235c66fd21906cf4b1bcadf9a' .github/workflows/file21-file22-real-contract.yml
          grep -Fq 'FILE26_RUNTIME_SHA: 253f0ec47dd8aa1aff5926b387e980de409859b8' .github/workflows/file21-file26-real-contract.yml

      - name: Deterministic canonical package regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release.py --source-sha "${FILE21_EXPECTED_SHA}"
          package="release/${CANONICAL_BASE}.zip"
          checksum="release/${CANONICAL_BASE}.sha256"
          manifest="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$package" && test -f "$checksum" && test -f "$manifest" && test -f "$report"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          unzip -Z1 "$package" > eighty-package-entries.txt
          for entry in \
            includes/class-next-generation-feed.php \
            includes/class-next-generation-hardening.php \
            includes/class-next-generation-integrations.php \
            includes/class-rest-next-generation.php \
            includes/class-feed-renderer.php \
            includes/class-news-public-projector.php \
            includes/class-profile-timeline.php \
            includes/class-comment-service.php \
            templates/news-card.php \
            assets/js/next-generation-accessibility.js; do
              grep -Fxq "sabri-complete-home-news-feed/${entry}" eighty-package-entries.txt
          done
          if grep -Eq '^sabri-complete-home-news-feed/(\.github|tools|tests|release|vendor|node_modules)/' eighty-package-entries.txt; then
            echo 'Development-only files are present in the package.'
            exit 1
          fi

      - name: Record evidence
        shell: bash
        run: |
          cat > eighty-round-evidence.txt <<REPORT
          File 21 exact head: ${FILE21_EXPECTED_SHA}
          Review rounds: 80
          Defect rounds: 5,6,7,8,10,13,14,15,17,18,19,20,26,30,31,32,33,34,36,41,45,48,53,54,58,62,77,80
          Round 80 stale latest-plan visibility regression: CORRECTED
          Package: 1.0.5
          Runtime/API: 1.0.3
          Schema: 1.0.0
          Database migration: NONE
          Strict-public NG30 boundary: PASS
          Canonical public identity projection: PASS
          Server payload/provider bounds: PASS
          True media-transfer saver semantics: PASS
          Stable digest idempotency: PASS
          Per-object abuse control: PASS
          Authenticated NG30 cache isolation: PASS
          Fresh File 04/20/24 exact pins: PASS
          Deterministic package: PASS
          Hostinger staging acceptance: NOT CLAIMED
          REPORT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file21-eighty-round-review-${{ env.FILE21_EXPECTED_SHA }}
          path: |
            eighty-round-evidence.txt
            eighty-package-entries.txt
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE.zip
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE.sha256
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE-MANIFEST.sha256
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE-TEST-REPORT.md
          if-no-files-found: warn
          retention-days: 30
