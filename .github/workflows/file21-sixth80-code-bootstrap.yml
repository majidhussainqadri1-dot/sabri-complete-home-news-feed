name: Temporary File 21 Sixth Eighty Code Bootstrap

on:
  push:
    branches:
      - file21-sixth-fresh-eighty-review-20260809

permissions:
  contents: write

jobs:
  bootstrap-code:
    if: ${{ !contains(github.event.head_commit.message || '', '[sixth80-code-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Execute code-only corrective script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/file21-sixth-eighty-patch-runner.yml').read_text()
          start="          python3 - <<'PY'\n"
          end="\n          PY\n\n          php -l includes/class-next-generation-feed.php"
          code=textwrap.dedent(wf.split(start,1)[1].split(end,1)[0])
          code=code.replace("for root in (Path('.github/workflows'),Path('tests')):", "for root in (Path('tests'),):")
          exec(compile(code,'sixth80_code_patch','exec'),{})
          PY
          php -l includes/class-next-generation-feed.php
          php -l includes/class-rest-next-generation.php
          git diff --check
      - name: Commit code corrections only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add includes tests
          git commit -m 'File 21 eighty-round code corrections [sixth80-code-patched]'
          git push origin HEAD:file21-sixth-fresh-eighty-review-20260809
