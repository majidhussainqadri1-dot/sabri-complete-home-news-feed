name: Phase 4C Public News Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'PHASE-4C-IMPLEMENTATION-PLAN.md'
      - 'PHASE-4C-IMPLEMENTATION.md'
      - 'includes/class-news-*.php'
      - 'includes/class-assets.php'
      - 'includes/class-interaction-permissions.php'
      - 'includes/class-social-runtime.php'
      - 'includes/class-feed-query.php'
      - 'includes/class-feed-renderer.php'
      - 'includes/class-plugin.php'
      - 'public/class-news-*.php'
      - 'templates/news-*.php'
      - 'assets/css/news.css'
      - 'assets/js/news.js'
      - 'tests/phase4c-stubs.php'
      - 'tests/run-phase4c-*.php'
      - 'tests/run-phase4c-playground-tests.mjs'
      - 'tests/wp-stubs.php'
      - 'tools/build-release.ps1'
      - '.github/workflows/phase4c-public-news-tests.yml'
      - '.github/workflows/phase4c-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4c-public-news-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Exact-head contracts, regressions, and immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1

      - name: Verify exact head and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
          grep -Fq 'Version: 1.0.1' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.1' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php

      - name: Lint complete Phase 4C surface
        shell: bash
        run: |
          set -euo pipefail
          php_files=(
            sabri-complete-home-news-feed.php
            includes/class-plugin.php
            includes/class-assets.php
            includes/class-interaction-permissions.php
            includes/class-social-runtime.php
            includes/class-feed-query.php
            includes/class-feed-renderer.php
            includes/class-news-policy.php
            includes/class-news-service.php
            includes/class-news-public-snapshot.php
            includes/class-news-cache.php
            includes/class-news-public-projector.php
            includes/class-news-query-service.php
            includes/class-news-feed-integration.php
            includes/class-rest-news.php
            public/class-news-public-runtime.php
            public/class-news-routing.php
            templates/news-home.php
            templates/news-archive.php
            templates/news-single.php
            templates/news-card.php
            templates/news-correction-notice.php
            templates/news-retraction-notice.php
            templates/news-empty-state.php
            templates/news-archive-page.php
            templates/news-single-page.php
            tests/phase4c-stubs.php
            tests/run-phase4c-public-news-tests.php
            tests/run-phase4c-security-tests.php
            tests/run-phase4c-ui-completeness-tests.php
          )
          for file in "${php_files[@]}"; do php -l "$file"; done
          node --check assets/js/news.js
          node --check tests/run-phase4c-playground-tests.mjs

      - name: Run Phase 4C behavior, security, and UI tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4c-public-news-tests.php
          php tests/run-phase4c-security-tests.php
          php tests/run-phase4c-ui-completeness-tests.php

      - name: Run Phase 4A, Phase 4B, and core regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build and verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase4c-package phase4c-preflight
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-COMPATIBILITY-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-COMPATIBILITY-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase4c-package phase4c-preflight
          cp "$package" phase4c-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase4c-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > phase4c-package/exact-commit.txt
          unzip -Z1 "$package" > phase4c-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-public-snapshot.php \
            sabri-complete-home-news-feed/includes/class-news-cache.php \
            sabri-complete-home-news-feed/includes/class-news-public-projector.php \
            sabri-complete-home-news-feed/includes/class-news-query-service.php \
            sabri-complete-home-news-feed/includes/class-news-feed-integration.php \
            sabri-complete-home-news-feed/includes/class-rest-news.php \
            sabri-complete-home-news-feed/public/class-news-public-runtime.php \
            sabri-complete-home-news-feed/public/class-news-routing.php \
            sabri-complete-home-news-feed/templates/news-home.php \
            sabri-complete-home-news-feed/templates/news-single.php \
            sabri-complete-home-news-feed/templates/news-correction-notice.php \
            sabri-complete-home-news-feed/assets/css/news.css \
            sabri-complete-home-news-feed/assets/js/news.js; do
            grep -Fxq "$entry" phase4c-package/package-entries.txt
          done
          git rev-parse HEAD > phase4c-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4c-preflight/tracked-files.sha256
          sha256sum phase4c-preflight/tracked-files.sha256 > phase4c-preflight/tracked-manifest-digest.sha256
          printf 'package_sha256=%s\n' "$actual" > phase4c-preflight/package.env
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-immutable-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-package/
          if-no-files-found: error

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-preflight-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-preflight/
          if-no-files-found: error

  source-playground:
    name: Source WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source runtime matrix
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4c-playground-tests.mjs 2>&1 | tee source-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: source-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Packaged WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs:
      - preflight
      - source-playground
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download immutable package
        uses: actions/download-artifact@v4
        with:
          name: phase4c-immutable-package-${{ env.TEST_SHA }}
          path: phase4c-package
      - name: Verify downloaded package
        shell: bash
        run: |
          set -euo pipefail
          cd phase4c-package
          sha256sum -c candidate.sha256
          unzip -tqq candidate.zip
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged runtime matrix
        shell: bash
        env:
          SABRI_PLUGIN_ZIP: phase4c-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4c-playground-tests.mjs 2>&1 | tee packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  acceptance:
    name: Retain Phase 4C exact-head acceptance
    needs:
      - preflight
      - source-playground
      - packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: phase4c-preflight-${{ env.TEST_SHA }}
          path: phase4c-preflight
      - name: Create acceptance record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test "$(cat phase4c-preflight/exact-commit.txt)" = "${TEST_SHA}"
          mkdir -p phase4c-acceptance
          cp phase4c-preflight/* phase4c-acceptance/
          printf 'status=passed\nhead_sha=%s\nsource_matrices=2\npackaged_matrices=2\npublic_gates_enabled=0\nauto_publish_enabled=0\n' "${TEST_SHA}" > phase4c-acceptance/result.env
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload passed Phase 4C artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4c-PUBLIC-NEWS-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-acceptance/
          if-no-files-found: error
