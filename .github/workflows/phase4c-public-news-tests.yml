name: Phase 4C Public News Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'PHASE-4C-*.md'
      - 'FILE-21-*.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/phase4c-public-news-tests.yml'
      - '.github/workflows/phase4c-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4c-public-news-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACKAGE_BASE: 21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE

jobs:
  preflight:
    name: Exact-head contracts, regressions, and immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
          grep -Fq 'Version: 1.0.3' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.3' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php
          grep -Fq "add_action( 'sabri_shell_news_main'" includes/class-home-composition-registry.php
          ! grep -Fq "add_action( 'init', array( __CLASS__, 'maybe_recover'" includes/class-public-surface-recovery.php
      - name: Lint complete public News and corrective surface
        shell: bash
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l sabri-complete-home-news-feed.php
          node --check assets/js/news.js
          node --check assets/js/phase5-public.js
          node --check assets/js/phase5-admin.js
          node --check tests/run-phase4c-playground-tests.mjs
      - name: Run File 21 production-rejection and harmonization contracts
        shell: bash
        run: |
          set -euo pipefail
          FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php
          php tests/run-file21-settings-recursion-tests.php
          php tests/run-file21-public-visibility-tests.php
          php tests/run-file21-harmonization-tests.php
          php tests/run-file21-harmonization-negative-tests.php
          php tests/run-file21-corrective-tests.php
          php tests/run-file21-completion-audit-tests.php
          php tests/run-file21-legacy-interaction-migration-tests.php
      - name: Run Phase 4C behavior, security, and UI tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4c-public-news-tests.php
          php tests/run-phase4c-security-tests.php
          php tests/run-phase4c-ui-completeness-tests.php
          bash tools/run-phase5-local-tests.sh
      - name: Run Phase 4A, Phase 4B, and core regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Build and verify immutable canonical package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase4c-package phase4c-preflight
          pwsh -NoProfile -File ./tools/build-release.ps1
          package="release/${PACKAGE_BASE}.zip"
          checksum="release/${PACKAGE_BASE}.sha256"
          manifest="release/${PACKAGE_BASE}-MANIFEST.sha256"
          test -f "$package" && test -f "$checksum" && test -f "$manifest"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase4c-package phase4c-preflight
          cp "$package" phase4c-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase4c-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > phase4c-package/exact-commit.txt
          cp "$manifest" phase4c-package/runtime-manifest.sha256
          unzip -Z1 "$package" > phase4c-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/sabri-complete-home-news-feed.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-corrective-public-mount.php \
            sabri-complete-home-news-feed/includes/class-public-query-guard.php \
            sabri-complete-home-news-feed/includes/class-integrations.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/includes/class-rest-foundation.php \
            sabri-complete-home-news-feed/public/class-news-routing.php \
            sabri-complete-home-news-feed/public/class-phase5-public-runtime.php \
            sabri-complete-home-news-feed/FILE-21-PRODUCTION-REJECTION-CORRECTIVE-1.0.3.md; do
            grep -Fxq "$entry" phase4c-package/package-entries.txt
          done
          git rev-parse HEAD > phase4c-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4c-preflight/tracked-files.sha256
          sha256sum phase4c-preflight/tracked-files.sha256 > phase4c-preflight/tracked-manifest-digest.sha256
          printf 'package_sha256=%s\nruntime_version=1.0.3\nschema_version=1.0.0\npublic_get_recovery_writes=0\nnews_slot_registered=1\n' "$actual" > phase4c-preflight/package.env
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-immutable-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-package/
          if-no-files-found: error
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-preflight-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-preflight/
          if-no-files-found: error

  source-playground:
    name: Source WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source runtime matrix
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4c-playground-tests.mjs 2>&1 | tee source-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: source-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Packaged WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: [preflight, source-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download immutable package
        uses: actions/download-artifact@v4
        with:
          name: phase4c-immutable-package-${{ env.TEST_SHA }}
          path: phase4c-package
      - name: Verify downloaded package
        shell: bash
        run: |
          set -euo pipefail
          cd phase4c-package
          sha256sum -c candidate.sha256
          unzip -tqq candidate.zip
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged runtime matrix
        shell: bash
        env:
          SABRI_PLUGIN_ZIP: phase4c-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4c-playground-tests.mjs 2>&1 | tee packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  acceptance:
    name: Retain Phase 4C exact-head acceptance
    needs: [preflight, source-playground, packaged-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: phase4c-preflight-${{ env.TEST_SHA }}
          path: phase4c-preflight
      - name: Create acceptance record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test "$(cat phase4c-preflight/exact-commit.txt)" = "${TEST_SHA}"
          mkdir -p phase4c-acceptance
          cp phase4c-preflight/* phase4c-acceptance/
          printf 'status=passed\nhead_sha=%s\nsource_matrices=2\npackaged_matrices=2\nruntime_version=1.0.3\nschema_version=1.0.0\npublic_gates_enabled=0\nauto_publish_enabled=0\npublic_get_recovery_writes=0\nnews_slot_registered=1\nlive_deployed=0\n' "${TEST_SHA}" > phase4c-acceptance/result.env
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload passed Phase 4C artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4c-PUBLIC-NEWS-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4c-acceptance/
          if-no-files-found: error
