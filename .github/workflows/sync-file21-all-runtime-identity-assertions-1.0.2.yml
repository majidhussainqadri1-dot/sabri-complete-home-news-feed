name: Synchronize File 21 Runtime Identity Assertions 1.0.2

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-file21-all-runtime-identity-assertions-1.0.2.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'fix/file-21-public-surface-visibility-1.0.2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-21-public-surface-visibility-1.0.2
          fetch-depth: 0
      - name: Update only exact runtime identity comparisons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patterns = (
              ("'1.0.1' === $identity['version']", "'1.0.2' === $identity['version']"),
              ("$identity['version'] === '1.0.1'", "$identity['version'] === '1.0.2'"),
              ("'1.0.1' === SABRI_HNF_VERSION", "'1.0.2' === SABRI_HNF_VERSION"),
              ("SABRI_HNF_VERSION === '1.0.1'", "SABRI_HNF_VERSION === '1.0.2'"),
          )

          changed = []
          replacements = 0
          for path in sorted(Path('tests').glob('*')):
              if path.suffix not in {'.php', '.mjs', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in patterns:
                  count = text.count(old)
                  if count:
                      replacements += count
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No stale runtime identity comparisons were found.')
          if replacements > 20:
              raise SystemExit(f'Unexpectedly broad replacement count: {replacements}')
          print('Updated files:')
          print('\n'.join(changed))
          print(f'Replacements: {replacements}')
          PY
          find tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run-phase3-contract-tests.php
          php tests/run-phase3-infrastructure-tests.php
          php tests/run-phase4a-content-model-tests.php
      - name: Commit bounded runtime identity updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'Align remaining test identity assertions with File 21 runtime 1.0.2'
          git push origin HEAD:fix/file-21-public-surface-visibility-1.0.2
