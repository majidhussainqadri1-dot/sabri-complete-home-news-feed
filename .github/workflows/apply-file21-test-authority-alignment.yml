name: Apply File 21 Test Authority Alignment

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file21-zero-known-defects-1.0.3.2
          fetch-depth: 0
      - name: Apply authority-aligned test fixtures when pending
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/apply-file21-test-authority-alignment.py; then
            echo 'File 21 test authority alignment is already applied.'
            exit 0
          fi
          python3 tools/apply-file21-test-authority-alignment.py
          php -l tests/wp-stubs.php
          php -l tests/run-tests.php
          php -l tests/run-file21-file22-workflow-adapter-tests.php
          php tools/run-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php
          rm -f tools/apply-file21-test-authority-alignment.py
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'test: align legacy suites with current File 00 authority'
          git push origin HEAD:fix/file21-zero-known-defects-1.0.3.2
