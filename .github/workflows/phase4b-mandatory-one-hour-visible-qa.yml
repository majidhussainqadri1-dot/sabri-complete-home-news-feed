name: Phase 4B Mandatory One-Hour Visible QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'PHASE-4B-IMPLEMENTATION.md'
      - 'PHASE-4B-ONE-HOUR-QA-PROTOCOL.md'
      - 'admin/class-newsroom-admin.php'
      - 'assets/css/newsroom-admin.css'
      - 'assets/js/newsroom-editor.js'
      - 'includes/class-editorial-news-post-type.php'
      - 'includes/class-news-*.php'
      - 'includes/class-newsroom-diagnostics.php'
      - 'includes/class-plugin.php'
      - 'tests/phase4b-stubs.php'
      - 'tests/run-phase4b-newsroom-tests.php'
      - 'tests/run-phase4b-ui-completeness-tests.php'
      - 'tests/run-phase4b-playground-tests.mjs'
      - 'tools/**'
      - '.github/workflows/phase4b-mandatory-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4b-visible-one-hour-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Exact-head preflight and immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1

      - name: Verify exact head and runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          php -v
          node -v
          pwsh -v
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Lint complete Phase 4B surface
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            includes/class-news-policy.php \
            includes/class-news-workflow.php \
            includes/class-news-composer-validator.php \
            includes/class-news-queue-service.php \
            includes/class-news-audit.php \
            includes/class-news-scheduling-service.php \
            includes/class-newsroom-diagnostics.php \
            includes/class-news-service.php \
            includes/class-editorial-news-post-type.php \
            admin/class-newsroom-admin.php \
            includes/class-plugin.php \
            tests/phase4b-stubs.php \
            tests/run-phase4b-newsroom-tests.php \
            tests/run-phase4b-ui-completeness-tests.php; do
            php -l "$file"
          done
          node --check assets/js/newsroom-editor.js
          node --check tests/run-phase4b-playground-tests.mjs

      - name: Run complete regression surface
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build and verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p visible-qa-package visible-qa-preflight
          cp "$package" visible-qa-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > visible-qa-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > visible-qa-package/exact-commit.txt
          unzip -Z1 "$package" > visible-qa-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-policy.php \
            sabri-complete-home-news-feed/includes/class-news-workflow.php \
            sabri-complete-home-news-feed/includes/class-news-composer-validator.php \
            sabri-complete-home-news-feed/includes/class-news-queue-service.php \
            sabri-complete-home-news-feed/includes/class-news-audit.php \
            sabri-complete-home-news-feed/includes/class-news-scheduling-service.php \
            sabri-complete-home-news-feed/includes/class-newsroom-diagnostics.php \
            sabri-complete-home-news-feed/includes/class-news-service.php \
            sabri-complete-home-news-feed/admin/class-newsroom-admin.php \
            sabri-complete-home-news-feed/assets/css/newsroom-admin.css \
            sabri-complete-home-news-feed/assets/js/newsroom-editor.js; do
            grep -Fxq "$entry" visible-qa-package/package-entries.txt
          done
          git rev-parse HEAD > visible-qa-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > visible-qa-preflight/tracked-files.sha256
          sha256sum visible-qa-preflight/tracked-files.sha256 > visible-qa-preflight/manifest-digest.sha256
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-qa-package/
          if-no-files-found: error

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-preflight-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-qa-preflight/
          if-no-files-found: error

  source-playground:
    name: Visible source Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source newsroom integration
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4b-playground-tests.mjs 2>&1 | tee visible-source-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-source-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Visible packaged Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs:
      - preflight
      - source-playground
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download immutable package
        uses: actions/download-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          path: visible-qa-package
      - name: Verify downloaded package
        shell: bash
        run: |
          set -euo pipefail
          cd visible-qa-package
          sha256sum -c candidate.sha256
          unzip -tqq candidate.zip
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged newsroom integration
        shell: bash
        env:
          SABRI_PLUGIN_ZIP: visible-qa-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4b-playground-tests.mjs 2>&1 | tee visible-packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  one-hour-soak:
    name: Observable uninterrupted 3,900-second soak
    needs: packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1

      - name: Run 13 complete cycles for at least 3,900 seconds
        shell: bash
        run: |
          set -euo pipefail
          readonly MINIMUM_SECONDS=3900
          readonly REQUIRED_CYCLES=13
          readonly CYCLE_INTERVAL_SECONDS=300
          readonly START_EPOCH=$(date +%s)
          mkdir -p visible-one-hour-soak
          git rev-parse HEAD > visible-one-hour-soak/exact-commit.txt
          test "$(cat visible-one-hour-soak/exact-commit.txt)" = "${TEST_SHA}"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > visible-one-hour-soak/initial-tracked-files.sha256

          run_local_suite() {
            php tests/run-phase4b-newsroom-tests.php
            php tests/run-phase4b-ui-completeness-tests.php
            php tests/run-phase4a-content-model-tests.php
            php tools/run-tests.php
            node --check assets/js/newsroom-editor.js
            node --check tests/run-phase4b-playground-tests.mjs
            pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
          }

          verify_fresh_package() {
            rm -rf release
            pwsh -NoProfile -File ./tools/build-release.ps1
            local package checksum expected actual
            package=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
            checksum=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
            test -n "$package" && test -n "$checksum"
            expected=$(awk '{print tolower($1)}' "$checksum")
            actual=$(sha256sum "$package" | awk '{print $1}')
            test "$expected" = "$actual"
            unzip -tqq "$package"
            LAST_PACKAGE_SHA="$actual"
          }

          LAST_PACKAGE_SHA=''
          for cycle in $(seq 1 "${REQUIRED_CYCLES}"); do
            cycle_start=$(date +%s)
            printf 'Starting cycle %02d at %s\n' "$cycle" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            test "$(git rev-parse HEAD)" = "${TEST_SHA}"
            run_local_suite
            verify_fresh_package
            test -z "$(git status --porcelain --untracked-files=no)"
            cycle_end=$(date +%s)
            printf 'cycle=%02d start_epoch=%s end_epoch=%s elapsed=%s package_sha256=%s\n' \
              "$cycle" "$cycle_start" "$cycle_end" "$((cycle_end-cycle_start))" "$LAST_PACKAGE_SHA" \
              >> visible-one-hour-soak/cycles.log
            if [ "$cycle" -lt "${REQUIRED_CYCLES}" ]; then
              target_epoch=$((START_EPOCH + cycle * CYCLE_INTERVAL_SECONDS))
              now_epoch=$(date +%s)
              if [ "$now_epoch" -lt "$target_epoch" ]; then
                sleep "$((target_epoch-now_epoch))"
              fi
            fi
          done

          minimum_end=$((START_EPOCH + MINIMUM_SECONDS))
          now_epoch=$(date +%s)
          if [ "$now_epoch" -lt "$minimum_end" ]; then
            sleep "$((minimum_end-now_epoch))"
          fi

          run_local_suite
          verify_fresh_package
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > visible-one-hour-soak/final-tracked-files.sha256
          cmp visible-one-hour-soak/initial-tracked-files.sha256 visible-one-hour-soak/final-tracked-files.sha256
          sha256sum visible-one-hour-soak/initial-tracked-files.sha256 > visible-one-hour-soak/manifest-digest.sha256
          cp "$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)" visible-one-hour-soak/final-candidate.zip
          printf '%s  final-candidate.zip\n' "$LAST_PACKAGE_SHA" > visible-one-hour-soak/final-package.sha256
          END_EPOCH=$(date +%s)
          DURATION_SECONDS=$((END_EPOCH-START_EPOCH))
          COMPLETED_CYCLES=$(wc -l < visible-one-hour-soak/cycles.log | tr -d ' ')
          test "$DURATION_SECONDS" -ge "$MINIMUM_SECONDS"
          test "$COMPLETED_CYCLES" -eq "$REQUIRED_CYCLES"
          manifest_sha=$(awk '{print $1}' visible-one-hour-soak/manifest-digest.sha256)
          printf 'status=passed\nhead_sha=%s\nduration_seconds=%s\ncycles=%s\npackage_sha256=%s\ntracked_manifest_sha256=%s\npublic_gates_enabled=0\nauto_publish_enabled=0\n' \
            "${TEST_SHA}" "$DURATION_SECONDS" "$COMPLETED_CYCLES" "$LAST_PACKAGE_SHA" "$manifest_sha" \
            > visible-one-hour-soak/result.env
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload complete soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-one-hour-soak-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-one-hour-soak/
          if-no-files-found: error

  final-packaged-playground:
    name: Final packaged verification (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: one-hour-soak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download complete soak evidence
        uses: actions/download-artifact@v4
        with:
          name: phase4b-visible-one-hour-soak-${{ env.TEST_SHA }}
          path: visible-one-hour-soak
      - name: Verify final package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd visible-one-hour-soak
          sha256sum -c final-package.sha256
          unzip -tqq final-candidate.zip
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run final packaged newsroom integration
        shell: bash
        env:
          SABRI_PLUGIN_ZIP: visible-one-hour-soak/final-candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4b-playground-tests.mjs 2>&1 | tee visible-final-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload final packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-final-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-final-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  acceptance:
    name: Retain observable passed one-hour acceptance record
    needs:
      - one-hour-soak
      - final-packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download complete soak evidence
        uses: actions/download-artifact@v4
        with:
          name: phase4b-visible-one-hour-soak-${{ env.TEST_SHA }}
          path: visible-one-hour-soak
      - name: Verify and retain acceptance record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fxq 'status=passed' visible-one-hour-soak/result.env
          grep -Fxq "head_sha=${TEST_SHA}" visible-one-hour-soak/result.env
          duration=$(awk -F= '$1=="duration_seconds"{print $2}' visible-one-hour-soak/result.env)
          cycles=$(awk -F= '$1=="cycles"{print $2}' visible-one-hour-soak/result.env)
          test "$duration" -ge 3900
          test "$cycles" -eq 13
          cmp visible-one-hour-soak/initial-tracked-files.sha256 visible-one-hour-soak/final-tracked-files.sha256
          (cd visible-one-hour-soak && sha256sum -c final-package.sha256)
          mkdir -p visible-one-hour-acceptance
          cp visible-one-hour-soak/result.env visible-one-hour-acceptance/
          cp visible-one-hour-soak/cycles.log visible-one-hour-acceptance/
          cp visible-one-hour-soak/manifest-digest.sha256 visible-one-hour-acceptance/
          cp visible-one-hour-soak/final-package.sha256 visible-one-hour-acceptance/
          cp visible-one-hour-soak/exact-commit.txt visible-one-hour-acceptance/
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload passed observable one-hour artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4b-ONE-HOUR-VISIBLE-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-one-hour-acceptance/
          if-no-files-found: error
