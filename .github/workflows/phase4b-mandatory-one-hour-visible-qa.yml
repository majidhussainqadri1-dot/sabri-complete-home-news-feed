name: Phase 4B Mandatory One-Hour Visible QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'admin/**'
      - 'assets/**'
      - 'includes/**'
      - 'public/**'
      - 'templates/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/phase4b-mandatory-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4b-visible-one-hour-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.2-PUBLIC-VISIBILITY-CANDIDATE

jobs:
  preflight:
    name: Exact-head preflight and canonical immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head and runtimes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          php -v
          node -v
          pwsh -v
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Lint Phase 4B and corrective boundaries
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find assets/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run exact-head regression surface
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tests/run-public-query-routing-tests.php
          php tests/run-file21-public-visibility-tests.php
          php tests/run-file21-harmonization-tests.php
          php tests/run-file21-corrective-tests.php
          php tests/run-file21-completion-audit-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Build and verify canonical immutable package
        run: |
          set -euo pipefail
          rm -rf release visible-qa-package visible-qa-preflight
          pwsh -NoProfile -File ./tools/build-release.ps1
          package="release/${CANONICAL_BASE}.zip"
          checksum="release/${CANONICAL_BASE}.sha256"
          manifest="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$package" && test -f "$checksum" && test -f "$manifest" && test -f "$report"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p visible-qa-package visible-qa-preflight
          cp "$package" visible-qa-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > visible-qa-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > visible-qa-package/exact-commit.txt
          cp "$manifest" visible-qa-package/runtime-manifest.sha256
          unzip -Z1 "$package" > visible-qa-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-policy.php \
            sabri-complete-home-news-feed/includes/class-news-workflow.php \
            sabri-complete-home-news-feed/includes/class-public-query-guard.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/admin/class-newsroom-admin.php; do
            grep -Fxq "$entry" visible-qa-package/package-entries.txt
          done
          git rev-parse HEAD > visible-qa-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > visible-qa-preflight/tracked-files.sha256
          sha256sum visible-qa-preflight/tracked-files.sha256 > visible-qa-preflight/manifest-digest.sha256
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-qa-package/
          if-no-files-found: error
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-preflight-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-qa-preflight/
          if-no-files-found: error

  playground:
    name: Source and packaged Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Download immutable package
        uses: actions/download-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          path: visible-qa-package
      - name: Verify immutable package
        run: |
          set -euo pipefail
          cd visible-qa-package
          sha256sum -c candidate.sha256
          unzip -tqq candidate.zip
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source and packaged newsroom integration
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          node tests/run-phase4b-playground-tests.mjs 2>&1 | tee visible-source-${{ matrix.wp }}-php-${{ matrix.php }}.log
          SABRI_PLUGIN_ZIP=visible-qa-package/candidate.zip node tests/run-phase4b-playground-tests.mjs 2>&1 | tee visible-packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - name: Upload Playground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-playground-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 30
          path: visible-*.log
          if-no-files-found: error

  one-hour-soak:
    name: Observable uninterrupted 3,900-second soak
    needs: playground
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Run 13 exact-head cycles for at least 3,900 seconds
        run: |
          set -euo pipefail
          readonly MINIMUM_SECONDS=3900
          readonly REQUIRED_CYCLES=13
          readonly CYCLE_INTERVAL_SECONDS=300
          readonly START_EPOCH=$(date +%s)
          mkdir -p visible-one-hour-soak
          printf '%s\n' "${TEST_SHA}" > visible-one-hour-soak/exact-commit.txt
          for cycle in $(seq 1 "${REQUIRED_CYCLES}"); do
            cycle_start=$(date +%s)
            test "$(git rev-parse HEAD)" = "${TEST_SHA}"
            php tests/run-phase4b-newsroom-tests.php
            php tests/run-phase4b-ui-completeness-tests.php
            php tests/run-public-query-routing-tests.php
            php tests/run-file21-public-visibility-tests.php
            php tests/run-file21-completion-audit-tests.php
            php tools/run-tests.php
            rm -rf release
            pwsh -NoProfile -File ./tools/build-release.ps1
            package="release/${CANONICAL_BASE}.zip"
            checksum="release/${CANONICAL_BASE}.sha256"
            test -f "$package" && test -f "$checksum"
            expected=$(awk '{print tolower($1)}' "$checksum")
            actual=$(sha256sum "$package" | awk '{print $1}')
            test "$expected" = "$actual"
            unzip -tqq "$package"
            cycle_end=$(date +%s)
            printf 'cycle=%02d start=%s end=%s elapsed=%s package_sha256=%s\n' "$cycle" "$cycle_start" "$cycle_end" "$((cycle_end-cycle_start))" "$actual" >> visible-one-hour-soak/cycles.log
            if [ "$cycle" -lt "${REQUIRED_CYCLES}" ]; then
              target=$((START_EPOCH + cycle * CYCLE_INTERVAL_SECONDS))
              now=$(date +%s)
              if [ "$now" -lt "$target" ]; then sleep "$((target-now))"; fi
            fi
          done
          elapsed=$(( $(date +%s) - START_EPOCH ))
          test "$elapsed" -ge "$MINIMUM_SECONDS"
          printf 'elapsed_seconds=%s\ncycles=%s\nstatus=passed\n' "$elapsed" "$REQUIRED_CYCLES" > visible-one-hour-soak/result.env
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload one-hour acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-one-hour-soak-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-one-hour-soak/
          if-no-files-found: error
