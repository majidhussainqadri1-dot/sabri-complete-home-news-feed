name: Phase 4B Mandatory One-Hour Visible QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'PHASE-4B-*.md'
      - 'FILE-21-*.md'
      - 'admin/**'
      - 'assets/**'
      - 'includes/**'
      - 'public/**'
      - 'templates/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/phase4b-mandatory-one-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4b-visible-one-hour-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACKAGE_BASE: 21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE

jobs:
  preflight:
    name: Exact-head preflight and immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head and run complete newsroom regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fq 'Version: 1.0.3' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php
          php tests/run-file21-settings-recursion-tests.php
          php tests/run-file21-public-visibility-tests.php
          php tests/run-file21-harmonization-tests.php
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          node --check assets/js/newsroom-editor.js
          node --check tests/run-phase4b-playground-tests.mjs
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build immutable canonical package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release visible-qa-package visible-qa-preflight
          pwsh -NoProfile -File ./tools/build-release.ps1
          package="release/${PACKAGE_BASE}.zip"
          checksum="release/${PACKAGE_BASE}.sha256"
          manifest="release/${PACKAGE_BASE}-MANIFEST.sha256"
          test -f "$package" && test -f "$checksum" && test -f "$manifest"
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$(awk '{print tolower($1)}' "$checksum")" = "$actual"
          unzip -tqq "$package"
          mkdir -p visible-qa-package visible-qa-preflight
          cp "$package" visible-qa-package/candidate.zip
          cp "$manifest" visible-qa-package/runtime-manifest.sha256
          printf '%s  candidate.zip\n' "$actual" > visible-qa-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > visible-qa-package/exact-commit.txt
          unzip -Z1 "$package" > visible-qa-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-policy.php \
            sabri-complete-home-news-feed/includes/class-news-workflow.php \
            sabri-complete-home-news-feed/includes/class-news-composer-validator.php \
            sabri-complete-home-news-feed/includes/class-news-queue-service.php \
            sabri-complete-home-news-feed/includes/class-news-audit.php \
            sabri-complete-home-news-feed/includes/class-news-scheduling-service.php \
            sabri-complete-home-news-feed/includes/class-newsroom-diagnostics.php \
            sabri-complete-home-news-feed/includes/class-news-service.php \
            sabri-complete-home-news-feed/admin/class-newsroom-admin.php \
            sabri-complete-home-news-feed/assets/css/newsroom-admin.css \
            sabri-complete-home-news-feed/assets/js/newsroom-editor.js; do
            grep -Fxq "$entry" visible-qa-package/package-entries.txt
          done
          git rev-parse HEAD > visible-qa-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > visible-qa-preflight/tracked-files.sha256
          sha256sum visible-qa-preflight/tracked-files.sha256 > visible-qa-preflight/manifest-digest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-qa-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: phase4b-visible-preflight-${{ env.TEST_SHA }}
          retention-days: 60
          path: visible-qa-preflight/
          if-no-files-found: error

  source-playground:
    name: Source newsroom WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source newsroom matrix
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: |
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          node tests/run-phase4b-playground-tests.mjs 2>&1 | tee source-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: source-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Packaged newsroom WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: [preflight, source-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase4b-visible-package-${{ env.TEST_SHA }}
          path: visible-qa-package
      - run: |
          (cd visible-qa-package && sha256sum -c candidate.sha256 && unzip -tqq candidate.zip)
          test "$(cat visible-qa-package/exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged newsroom matrix
        env:
          SABRI_PLUGIN_ZIP: visible-qa-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4b-playground-tests.mjs 2>&1 | tee packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: packaged-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  one-hour-soak:
    name: Exactly 13 complete cycles and at least 3,900 seconds
    needs: packaged-playground
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Run visible newsroom soak
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly MINIMUM_SECONDS=3900
          readonly REQUIRED_CYCLES=13
          readonly CYCLE_INTERVAL_SECONDS=325
          readonly START_EPOCH=$(date +%s)
          mkdir -p phase4b-one-hour-soak/cycle-logs
          git rev-parse HEAD > phase4b-one-hour-soak/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4b-one-hour-soak/initial-tracked-files.sha256
          current_cycle=0
          on_error() {
            status=$?
            now=$(date +%s)
            printf 'status=failed\nhead_sha=%s\ncycle=%s\nelapsed_seconds=%s\nexit_status=%s\n' "${TEST_SHA}" "$current_cycle" "$((now-START_EPOCH))" "$status" > phase4b-one-hour-soak/failure.env
            exit "$status"
          }
          trap on_error ERR
          run_suite() {
            FILE21_ROOT="$PWD" php tests/run-file21-production-rejection-tests.php
            php tests/run-file21-settings-recursion-tests.php
            php tests/run-file21-public-visibility-tests.php
            php tests/run-file21-harmonization-tests.php
            php tests/run-phase4b-newsroom-tests.php
            php tests/run-phase4b-ui-completeness-tests.php
            php tests/run-phase4a-content-model-tests.php
            php tools/run-tests.php
            node --check assets/js/newsroom-editor.js
            pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
          }
          build_package() {
            rm -rf release
            pwsh -NoProfile -File ./tools/build-release.ps1
            LAST_PACKAGE="release/${PACKAGE_BASE}.zip"
            checksum="release/${PACKAGE_BASE}.sha256"
            LAST_MANIFEST="release/${PACKAGE_BASE}-MANIFEST.sha256"
            test -f "$LAST_PACKAGE" && test -f "$checksum" && test -f "$LAST_MANIFEST"
            LAST_PACKAGE_SHA=$(sha256sum "$LAST_PACKAGE" | awk '{print $1}')
            test "$(awk '{print tolower($1)}' "$checksum")" = "$LAST_PACKAGE_SHA"
            unzip -tqq "$LAST_PACKAGE"
          }
          LAST_PACKAGE=''; LAST_PACKAGE_SHA=''; LAST_MANIFEST=''
          for cycle in $(seq 1 "$REQUIRED_CYCLES"); do
            current_cycle=$cycle
            cycle_start=$(date +%s)
            log_file=$(printf 'phase4b-one-hour-soak/cycle-logs/cycle-%02d.log' "$cycle")
            {
              printf 'Starting cycle %02d at %s\n' "$cycle" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              test "$(git rev-parse HEAD)" = "${TEST_SHA}"
              run_suite
              build_package
              test -z "$(git status --porcelain --untracked-files=no)"
            } > >(tee "$log_file") 2>&1
            wait
            cycle_end=$(date +%s)
            printf 'cycle=%02d start_epoch=%s end_epoch=%s elapsed=%s package_sha256=%s\n' "$cycle" "$cycle_start" "$cycle_end" "$((cycle_end-cycle_start))" "$LAST_PACKAGE_SHA" >> phase4b-one-hour-soak/cycles.log
            if [ "$cycle" -lt "$REQUIRED_CYCLES" ]; then
              target_epoch=$((START_EPOCH + cycle * CYCLE_INTERVAL_SECONDS))
              now_epoch=$(date +%s)
              if [ "$now_epoch" -lt "$target_epoch" ]; then sleep "$((target_epoch-now_epoch))"; fi
            fi
          done
          END_EPOCH=$(date +%s)
          DURATION_SECONDS=$((END_EPOCH-START_EPOCH))
          test "$current_cycle" -eq "$REQUIRED_CYCLES"
          test "$DURATION_SECONDS" -ge "$MINIMUM_SECONDS"
          test "$(wc -l < phase4b-one-hour-soak/cycles.log)" -eq "$REQUIRED_CYCLES"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4b-one-hour-soak/final-tracked-files.sha256
          cmp phase4b-one-hour-soak/initial-tracked-files.sha256 phase4b-one-hour-soak/final-tracked-files.sha256
          sha256sum phase4b-one-hour-soak/initial-tracked-files.sha256 > phase4b-one-hour-soak/tracked-manifest-digest.sha256
          cp "$LAST_PACKAGE" phase4b-one-hour-soak/final-candidate.zip
          cp "$LAST_MANIFEST" phase4b-one-hour-soak/runtime-manifest.sha256
          printf '%s  final-candidate.zip\n' "$LAST_PACKAGE_SHA" > phase4b-one-hour-soak/final-package.sha256
          printf 'status=soak-passed\nhead_sha=%s\nduration_seconds=%s\ncycles=%s\npackage_sha256=%s\nruntime_version=1.0.3\nschema_version=1.0.0\npublic_get_recovery_writes=0\nlive_deployed=0\n' "${TEST_SHA}" "$DURATION_SECONDS" "$REQUIRED_CYCLES" "$LAST_PACKAGE_SHA" > phase4b-one-hour-soak/result.env
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-one-hour-soak-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4b-one-hour-soak/
          if-no-files-found: error

  final-packaged-playground:
    name: Final packaged newsroom WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: one-hour-soak
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase4b-one-hour-soak-${{ env.TEST_SHA }}
          path: phase4b-one-hour-soak
      - run: |
          (cd phase4b-one-hour-soak && sha256sum -c final-package.sha256 && unzip -tqq final-candidate.zip)
          test "$(cat phase4b-one-hour-soak/exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run final packaged matrix
        env:
          SABRI_PLUGIN_ZIP: phase4b-one-hour-soak/final-candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4b-playground-tests.mjs 2>&1 | tee final-${{ matrix.wp }}-php-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-one-hour-final-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: final-${{ matrix.wp }}-php-${{ matrix.php }}.log
          if-no-files-found: error

  acceptance:
    name: Retain passed Phase 4B acceptance
    needs: [one-hour-soak, final-packaged-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase4b-one-hour-soak-${{ env.TEST_SHA }}
          path: phase4b-one-hour-soak
      - name: Verify and retain acceptance record
        run: |
          set -euo pipefail
          grep -Fxq 'status=soak-passed' phase4b-one-hour-soak/result.env
          grep -Fxq "head_sha=${TEST_SHA}" phase4b-one-hour-soak/result.env
          grep -Fxq 'runtime_version=1.0.3' phase4b-one-hour-soak/result.env
          grep -Fxq 'schema_version=1.0.0' phase4b-one-hour-soak/result.env
          grep -Fxq 'public_get_recovery_writes=0' phase4b-one-hour-soak/result.env
          test "$(awk -F= '$1=="duration_seconds"{print $2}' phase4b-one-hour-soak/result.env)" -ge 3900
          test "$(awk -F= '$1=="cycles"{print $2}' phase4b-one-hour-soak/result.env)" -eq 13
          cmp phase4b-one-hour-soak/initial-tracked-files.sha256 phase4b-one-hour-soak/final-tracked-files.sha256
          (cd phase4b-one-hour-soak && sha256sum -c final-package.sha256)
          mkdir -p phase4b-one-hour-acceptance
          cp phase4b-one-hour-soak/{result.env,cycles.log,tracked-manifest-digest.sha256,final-package.sha256,runtime-manifest.sha256,exact-commit.txt} phase4b-one-hour-acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: sabri-phase4b-ONE-HOUR-VISIBLE-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase4b-one-hour-acceptance/
          if-no-files-found: error
