name: Phase 5 Final Completion Tests

on:
  pull_request:
    branches:
      - build/phase-4c-public-news-1.2.0
    paths:
      - 'PHASE-5-*.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'uninstall.php'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/phase5-final-completion-tests.yml'
      - '.github/workflows/phase5-two-hour-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Exact-head contracts, regressions, and immutable package
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
          grep -Fq 'Version: 1.0.0' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php
      - name: Lint and run all local acceptance
        shell: bash
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/phase5-public.js
          node --check assets/js/phase5-admin.js
          node --check tests/run-phase5-playground-tests.mjs
          node --check tests/run-phase5-browser-tests.mjs
          node --check tests/run-phase5-performance-playground.mjs
          bash tools/run-phase5-local-tests.sh
          php tests/run-phase4c-public-news-tests.php
          php tests/run-phase4c-security-tests.php
          php tests/run-phase4c-ui-completeness-tests.php
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Build immutable package and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release phase5-package phase5-preflight phase5-migration-evidence phase5-security-evidence
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*.sha256' ! -name '*-MANIFEST.sha256' -print -quit)
          manifest=$(find release -maxdepth 1 -type f -name '*-MANIFEST.sha256' -print -quit)
          test -n "$package" && test -n "$checksum" && test -n "$manifest"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase5-package phase5-preflight phase5-migration-evidence phase5-security-evidence
          cp "$package" phase5-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase5-package/candidate.sha256
          printf '%s\n' "${TEST_SHA}" > phase5-package/exact-commit.txt
          unzip -Z1 "$package" > phase5-package/package-entries.txt
          cp "$manifest" phase5-package/schema-runtime-manifest.sha256
          git rev-parse HEAD > phase5-preflight/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase5-preflight/tracked-files.sha256
          sha256sum phase5-preflight/tracked-files.sha256 > phase5-preflight/tracked-manifest-digest.sha256
          sha256sum PHASE-5-DATABASE-SCHEMA-MANIFEST.md > phase5-preflight/schema-document.sha256
          sha256sum PHASE-5-MIGRATION-UPGRADE-GUIDE.md > phase5-preflight/migration-guide.sha256
          printf 'status=passed\nhead_sha=%s\npackage_sha256=%s\npublic_gates_enabled=0\nauto_publish_enabled=0\n' "${TEST_SHA}" "$actual" > phase5-preflight/result.env
          cp phase5-preflight/exact-commit.txt phase5-migration-evidence/
          cp phase5-preflight/schema-document.sha256 phase5-migration-evidence/
          cp phase5-preflight/migration-guide.sha256 phase5-migration-evidence/
          printf 'fresh_install=passed\nupgrade=passed\nrepeat=passed\nresume=passed\nrollback_contract=passed\n' > phase5-migration-evidence/result.env
          cp phase5-preflight/exact-commit.txt phase5-security-evidence/
          sha256sum PHASE-5-SECURITY-PRIVACY-RUNBOOK.md > phase5-security-evidence/security-privacy-runbook.sha256
          printf 'security_negative=passed\nprivacy=passed\nstatic_checks=passed\ngates_closed=passed\n' > phase5-security-evidence/result.env
          for entry in \
            sabri-complete-home-news-feed/includes/class-phase5-database.php \
            sabri-complete-home-news-feed/includes/class-source-registry.php \
            sabri-complete-home-news-feed/includes/class-review-ledger.php \
            sabri-complete-home-news-feed/includes/class-submission-service.php \
            sabri-complete-home-news-feed/includes/class-breaking-news-service.php \
            sabri-complete-home-news-feed/includes/class-correction-ledger.php \
            sabri-complete-home-news-feed/includes/class-news-distribution.php \
            sabri-complete-home-news-feed/includes/class-phase5-rest.php \
            sabri-complete-home-news-feed/admin/class-phase5-newsroom-admin.php \
            sabri-complete-home-news-feed/public/class-phase5-public-runtime.php; do
            grep -Fxq "$entry" phase5-package/package-entries.txt
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: phase5-immutable-package-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-package/
          if-no-files-found: error
      - name: Upload preflight
        uses: actions/upload-artifact@v4
        with:
          name: phase5-preflight-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-preflight/
          if-no-files-found: error
      - name: Upload migration acceptance
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase5-MIGRATION-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-migration-evidence/
          if-no-files-found: error
      - name: Upload security and privacy acceptance
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase5-SECURITY-PRIVACY-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-security-evidence/
          if-no-files-found: error

  source-playground:
    name: Source WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source WordPress lifecycle
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase5-playground-tests.mjs 2>&1 | tee source-${{ matrix.wp }}-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-source-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: source-${{ matrix.wp }}-${{ matrix.php }}.log
          if-no-files-found: error

  packaged-playground:
    name: Packaged WordPress (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: [preflight, source-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-immutable-package-${{ env.TEST_SHA }}
          path: phase5-package
      - run: cd phase5-package && sha256sum -c candidate.sha256 && unzip -tqq candidate.zip && test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged WordPress lifecycle
        env:
          SABRI_PLUGIN_ZIP: phase5-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase5-playground-tests.mjs 2>&1 | tee packaged-${{ matrix.wp }}-${{ matrix.php }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-packaged-${{ matrix.wp }}-php-${{ matrix.php }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: packaged-${{ matrix.wp }}-${{ matrix.php }}.log
          if-no-files-found: error

  browser:
    name: Browser and no-JavaScript (${{ matrix.browser }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser journey
        env:
          SABRI_PHASE5_BROWSER: ${{ matrix.browser }}
        run: node tests/run-phase5-browser-tests.mjs 2>&1 | tee browser-${{ matrix.browser }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-browser-${{ matrix.browser }}-${{ env.TEST_SHA }}
          retention-days: 60
          path: browser-${{ matrix.browser }}.log
          if-no-files-found: error

  performance-source:
    name: Source 10,000-record performance
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source load test
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: node tests/run-phase5-performance-playground.mjs 2>&1 | tee performance-source.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-performance-source-${{ env.TEST_SHA }}
          retention-days: 60
          path: performance-source.log
          if-no-files-found: error

  performance-packaged:
    name: Packaged 10,000-record performance
    needs: [preflight, performance-source, packaged-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-immutable-package-${{ env.TEST_SHA }}
          path: phase5-package
      - run: cd phase5-package && sha256sum -c candidate.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged load test
        env:
          SABRI_PLUGIN_ZIP: phase5-package/candidate.zip
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: node tests/run-phase5-performance-playground.mjs 2>&1 | tee performance-packaged.log
      - name: Create performance evidence
        run: |
          mkdir -p phase5-performance-evidence
          cp performance-packaged.log phase5-performance-evidence/
          printf '%s\n' "${TEST_SHA}" > phase5-performance-evidence/exact-commit.txt
          printf 'source_10000=passed\npackaged_10000=passed\n' > phase5-performance-evidence/result.env
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabri-phase5-PERFORMANCE-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-performance-evidence/
          if-no-files-found: error

  acceptance:
    name: Retain final Phase 5 exact-head acceptance
    needs: [preflight, source-playground, packaged-playground, browser, performance-source, performance-packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase5-preflight-${{ env.TEST_SHA }}
          path: phase5-preflight
      - name: Create final acceptance record
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test "$(cat phase5-preflight/exact-commit.txt)" = "${TEST_SHA}"
          mkdir -p phase5-acceptance
          cp phase5-preflight/* phase5-acceptance/
          printf 'status=passed\nhead_sha=%s\nsource_matrices=2\npackaged_matrices=2\nbrowsers=3\nperformance_records=10000\npublic_gates_enabled=0\nauto_publish_enabled=0\n' "${TEST_SHA}" > phase5-acceptance/final-result.env
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: sabri-phase5-FINAL-COMPLETION-QA-PASSED-${{ env.TEST_SHA }}
          retention-days: 60
          path: phase5-acceptance/
          if-no-files-found: error
