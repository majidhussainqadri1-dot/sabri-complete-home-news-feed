name: Phase 4C Verified Completion Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.phase4c-completion/**'
      - '.github/workflows/phase4c-overlay-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: phase4c-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-verified-completion:
    name: Apply and verify complete Phase 4C implementation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and extract immutable completion archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(find .phase4c-completion -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')" = '18'
          cat \
            .phase4c-completion/chunk-000 .phase4c-completion/chunk-001 \
            .phase4c-completion/chunk-002 .phase4c-completion/chunk-003 \
            .phase4c-completion/chunk-004 .phase4c-completion/chunk-005 \
            .phase4c-completion/chunk-006 .phase4c-completion/chunk-007 \
            .phase4c-completion/chunk-008 .phase4c-completion/chunk-009 \
            .phase4c-completion/chunk-010 .phase4c-completion/chunk-011 \
            .phase4c-completion/chunk-012 .phase4c-completion/chunk-013 \
            .phase4c-completion/chunk-014 .phase4c-completion/chunk-015 \
            .phase4c-completion/chunk-016 .phase4c-completion/chunk-017 \
            | base64 --decode > /tmp/phase4c-completion.tar.gz
          actual=$(sha256sum /tmp/phase4c-completion.tar.gz | awk '{print $1}')
          printf 'completion_archive_sha256=%s\n' "$actual" | tee phase4c-completion-transport.log
          test "$actual" = '62b1bab7f4eb72cfcc2f1fa07b058f49b4c1bd575918210074c4bbd1f91dc236'
          tar -tzf /tmp/phase4c-completion.tar.gz > phase4c-completion-entries.log
          test "$(wc -l < phase4c-completion-entries.log | tr -d ' ')" = '28'
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' phase4c-completion-entries.log
          tar -xzf /tmp/phase4c-completion.tar.gz -C .
          rm -rf .phase4c-completion

      - name: Normalize Phase 4C test harness shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          public_path = Path('tests/run-phase4c-public-news-tests.php')
          public_text = public_path.read_text()
          public_replacements = {
              "$unknown_payload = isset($unknown_rest['payload'])?$unknown_rest['payload']:array();": "$unknown_payload = is_object( $unknown_rest ) && method_exists( $unknown_rest, 'get_data' ) ? $unknown_rest->get_data() : ( isset( $unknown_rest['payload'] ) ? $unknown_rest['payload'] : array() );",
              "sabri_phase4c_assert( empty($sabri_test_enqueued_styles['sabri-hnf-news']), 'News CSS loaded on a feed with no News card.' );": "sabri_phase4c_assert( !in_array('sabri-hnf-news',$sabri_test_enqueued_styles,true), 'News CSS loaded on a feed with no News card.' );",
              "sabri_phase4c_assert( !empty($sabri_test_enqueued_styles['sabri-hnf-news']) && !empty($sabri_test_enqueued_scripts['sabri-hnf-news']), 'News assets did not load when a News card rendered.' );": "sabri_phase4c_assert( in_array('sabri-hnf-news',$sabri_test_enqueued_styles,true) && in_array('sabri-hnf-news',$sabri_test_enqueued_scripts,true), 'News assets did not load when a News card rendered.' );",
          }
          for old, new in public_replacements.items():
              if old not in public_text:
                  raise SystemExit('Expected public test assertion anchor was not found: ' + old[:60])
              public_text = public_text.replace(old, new, 1)
          public_path.write_text(public_text)

          security_path = Path('tests/run-phase4c-security-tests.php')
          security_text = security_path.read_text()
          old = "$payload = isset( $unknown['payload'] ) ? $unknown['payload'] : array();\n$assert( 400 === ( isset( $unknown['status'] ) ? $unknown['status'] : 0 ) && 'public_news_filter_invalid' === ( isset( $payload['code'] ) ? $payload['code'] : '' ), 'REST unknown parameters were not rejected.' );"
          new = "$payload = is_object( $unknown ) && method_exists( $unknown, 'get_data' ) ? $unknown->get_data() : ( isset( $unknown['payload'] ) ? $unknown['payload'] : array() );\n$unknown_status = is_object( $unknown ) && method_exists( $unknown, 'get_status' ) ? $unknown->get_status() : ( isset( $unknown['status'] ) ? $unknown['status'] : 0 );\n$assert( 400 === $unknown_status && 'public_news_filter_invalid' === ( isset( $payload['code'] ) ? $payload['code'] : '' ), 'REST unknown parameters were not rejected.' );"
          if old not in security_text:
              raise SystemExit('Expected security REST response assertion anchor was not found.')
          security_path.write_text(security_text.replace(old, new, 1))
          PY
          php -l tests/run-phase4c-public-news-tests.php
          php -l tests/run-phase4c-security-tests.php

      - name: Lint complete Phase 4C surface
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            includes/class-news-public-snapshot.php \
            includes/class-news-public-projector.php \
            includes/class-news-service.php \
            includes/class-news-query-service.php \
            includes/class-news-cache.php \
            includes/class-interaction-permissions.php \
            includes/class-social-runtime.php \
            includes/class-assets.php \
            includes/class-news-feed-integration.php \
            includes/class-rest-news.php \
            includes/class-plugin.php \
            public/class-news-public-runtime.php \
            public/class-news-routing.php \
            templates/news-home.php \
            templates/news-correction-notice.php \
            templates/news-single.php \
            tests/phase4c-stubs.php \
            tests/run-phase4c-public-news-tests.php \
            tests/run-phase4c-security-tests.php \
            tests/run-phase4c-ui-completeness-tests.php; do
            php -l "$file"
          done
          node --check assets/js/news.js
          node --check tests/run-phase4c-playground-tests.mjs
          git diff --check

      - name: Run complete Phase 4C and regression suite
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4c-public-news-tests.php 2>&1 | tee phase4c-completion-public.log
          php tests/run-phase4c-security-tests.php 2>&1 | tee phase4c-completion-security.log
          php tests/run-phase4c-ui-completeness-tests.php 2>&1 | tee phase4c-completion-ui.log
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4b-ui-completeness-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tools/run-tests.php 2>&1 | tee phase4c-completion-core.log
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build and verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*-PHASE-3-STAGING-CANDIDATE.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          test "$(awk '{print tolower($1)}' "$checksum")" = "$(sha256sum "$package" | awk '{print $1}')"
          unzip -tqq "$package"
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-public-snapshot.php \
            sabri-complete-home-news-feed/includes/class-news-public-projector.php \
            sabri-complete-home-news-feed/includes/class-news-query-service.php \
            sabri-complete-home-news-feed/includes/class-news-cache.php \
            sabri-complete-home-news-feed/includes/class-news-feed-integration.php \
            sabri-complete-home-news-feed/includes/class-rest-news.php \
            sabri-complete-home-news-feed/public/class-news-public-runtime.php \
            sabri-complete-home-news-feed/public/class-news-routing.php \
            sabri-complete-home-news-feed/templates/news-home.php \
            sabri-complete-home-news-feed/templates/news-correction-notice.php \
            sabri-complete-home-news-feed/templates/news-single.php \
            sabri-complete-home-news-feed/assets/css/news.css \
            sabri-complete-home-news-feed/assets/js/news.js; do
            unzip -Z1 "$package" | grep -Fxq "$entry"
          done
          grep -Fq 'Version: 1.0.0' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php

      - name: Commit clean Phase 4C runtime implementation
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf release
          rm -f phase4c-completion-*.log
          rm -f .github/workflows/phase4c-public-news-tests.yml
          rm -f .github/workflows/phase4c-one-hour-visible-qa.yml
          git config user.name 'Sabri Phase 4C QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/phase4c-overlay-bootstrap.yml
          git reset -- .github/workflows/phase4c-completion-diagnostic.yml
          test -n "$(git status --porcelain)"
          test ! -e .phase4c-completion
          git diff --cached --check
          git commit -m 'Complete Phase 4C public News implementation'
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload completion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-completion-diagnostics-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          path: |
            phase4c-completion-transport.log
            phase4c-completion-entries.log
            phase4c-completion-public.log
            phase4c-completion-security.log
            phase4c-completion-ui.log
            phase4c-completion-core.log
          if-no-files-found: ignore
