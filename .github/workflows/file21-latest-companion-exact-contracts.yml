name: File 21 Latest Companion Exact Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'includes/**'
      - 'tests/run-file21-third-fresh-ten-review-tests.php'
      - 'tests/run-file21-fourth-fresh-ten-review-tests.php'
      - 'tests/run-file21-fifth-fresh-ten-review-tests.php'
      - '.github/workflows/file21-latest-companion-exact-contracts.yml'
      - '.github/workflows/file21-file22-real-contract.yml'
  push:
    branches:
      - main
      - 'file21-**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE21_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FILE00_SHA: 2fa7c022ee9cd1b65432e900579512f304532442
  FILE01_SHA: adf6dbb9980a85f25f7cf4c2ee679b52703c2e71
  FILE02_SHA: 224c39bcb8c28f77504c7348dbad41226753c7e8
  FILE03_SHA: 636e3ef965423887f810718abec3cd1c11c3659d
  FILE04_SHA: a27119a7d006ae25896e5d0b24f14c11727a7c54
  FILE07_SHA: 2f4a89707724fd2b9946600afe10ddab27ec3c2d
  FILE09_SHA: cfc5f781a766330314dc98c42abeca0eb7786eba
  FILE17_SHA: 8ae656e51796d1f05865d8be5dca2480443d79ca
  FILE20_SHA: 8a4dbcaf4fef8e926b9b834ecfde16c21a0f00ca
  FILE23_SHA: dcae138e6073f4d0ff596623deb05b9940b8271b
  FILE24_SHA: a5b8d49968a7a5a7d6f3f4655bea541bf38a9acb
  FILE25_SHA: e35563b7f3d8ebf0acbbc80982b7bcf2e1b78c0a

jobs:
  exact-current-companions:
    name: Exact current File 00/01/02/03/04/07/09/17/20/23/24/25 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact File 21 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FILE21_EXPECTED_SHA }}
          path: file21
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 00
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: ${{ env.FILE00_SHA }}
          path: file00
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 01
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/01-sabri-platform-foundation
          ref: ${{ env.FILE01_SHA }}
          path: file01
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 02
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/02-sabri-authentication
          ref: ${{ env.FILE02_SHA }}
          path: file02
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 03
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/03-sabri-profiles-and-doctors
          ref: ${{ env.FILE03_SHA }}
          path: file03
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 04
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/04-sabri-news-feed-and-publishing
          ref: ${{ env.FILE04_SHA }}
          path: file04
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 07
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/07-doctors-directory-and-discovery
          ref: ${{ env.FILE07_SHA }}
          path: file07
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 09
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/09-global-doctor-onboarding-and-verification-completion
          ref: ${{ env.FILE09_SHA }}
          path: file09
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 17
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/17-sabri-network
          ref: ${{ env.FILE17_SHA }}
          path: file17
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 20
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/20-sabri-unified-application-shell
          ref: ${{ env.FILE20_SHA }}
          path: file20
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 23
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/23-sabri-doctor-founder-publishing-dashboard
          ref: ${{ env.FILE23_SHA }}
          path: file23
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact File 24
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/24-sabri-platform-security-privacy-compliance-and-resilience-center
          ref: ${{ env.FILE24_SHA }}
          path: file24
          fetch-depth: 1
          persist-credentials: false


      - name: Check out exact File 25
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/25-sabri-public-ui-profile-timeline-visual-experience
          ref: ${{ env.FILE25_SHA }}
          path: file25
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file21 rev-parse HEAD)" = "${FILE21_EXPECTED_SHA}"
          test "$(git -C file00 rev-parse HEAD)" = "${FILE00_SHA}"
          test "$(git -C file01 rev-parse HEAD)" = "${FILE01_SHA}"
          test "$(git -C file02 rev-parse HEAD)" = "${FILE02_SHA}"
          test "$(git -C file03 rev-parse HEAD)" = "${FILE03_SHA}"
          test "$(git -C file04 rev-parse HEAD)" = "${FILE04_SHA}"
          test "$(git -C file07 rev-parse HEAD)" = "${FILE07_SHA}"
          test "$(git -C file09 rev-parse HEAD)" = "${FILE09_SHA}"
          test "$(git -C file17 rev-parse HEAD)" = "${FILE17_SHA}"
          test "$(git -C file20 rev-parse HEAD)" = "${FILE20_SHA}"
          test "$(git -C file23 rev-parse HEAD)" = "${FILE23_SHA}"
          test "$(git -C file24 rev-parse HEAD)" = "${FILE24_SHA}"
          test "$(git -C file25 rev-parse HEAD)" = "${FILE25_SHA}"

      - name: Verify current ownership and authorization boundaries
        shell: bash
        run: |
          set -euo pipefail
          php -l file00/source/sabri-membership-core/includes/class-smc-contracts.php
          grep -Fq 'class SMC_Contracts' file00/source/sabri-membership-core/includes/class-smc-contracts.php

          php -l file01/includes/class-spf-reconciler.php
          grep -Fq "'spf_owner_reconciliation_plan'" file01/includes/class-spf-reconciler.php
          grep -Fq "'spf_execute_owner_reconciliation'" file01/includes/class-spf-reconciler.php
          grep -Fq "'spf_rollback_owner_reconciliation'" file01/includes/class-spf-reconciler.php
          php file21/tests/run-file01-reconciliation-adapter.php

          php -l file02/includes/class-sa-membership-adapter.php
          ! grep -Eq 'class[[:space:]]+SA_.*(Membership|Identity).*(Authority|Owner)' file02/includes/class-sa-membership-adapter.php
          grep -Eqi 'membership|File 00|SMC_' file02/includes/class-sa-membership-adapter.php

          php -l file03/includes/class-spd-timeline.php
          grep -Fq "const PROVIDER_CONTRACT_MIN = '1.0.0'" file03/includes/class-spd-timeline.php
          grep -Fq 'sabri_file21_profile_timeline_provider_health_v1' file03/includes/class-spd-timeline.php
          grep -Fq 'sabri_file21_profile_timeline_items_v1' file03/includes/class-spd-timeline.php
          php -l file21/includes/class-profile-timeline.php
          php file21/tests/run-file21-file03-profile-timeline-contract.php
          php file21/tests/run-file21-file04-migration-completeness-tests.php

          php -l file04/includes/class-snfla-central-plan.php
          grep -Eqi 'File 21|file.?21|canonical' file04/includes/class-snfla-central-plan.php
          grep -Eqi 'read.only|write.*disable|migration|cutover|legacy_writes.*forbidden' file04/includes/class-snfla-central-plan.php
          php -l file04/includes/class-snfla-file21-adapter.php
          php -l file04/includes/class-snfla-plan-completion.php
          grep -Fq 'sabri_file21_legacy_metadata_preflight_v1' file04/includes/class-snfla-plan-completion.php
          grep -Fq 'sabri_file21_verify_migrated_legacy_metadata_v1' file04/includes/class-snfla-plan-completion.php
          grep -Fq "'legacy_metadata_context'=> \$metadata_context" file04/includes/class-snfla-file21-adapter.php
          grep -Fq 'spdb/file04_migration_state' file04/includes/class-snfla-cross-file-contracts.php
          python3 file04/tests/run-runtime-contract-regressions.py

          # File 07 remains the public doctor-directory/discovery owner; File 21 may consume only public-safe current projections.
          grep -Fq 'DoctorDirectoryEligibilityChanged.v1' file07/docs/API-CONTRACTS.md
          grep -Fq 'public static function get_live_status' file07/doctors-directory/includes/class-sdd-directory.php
          grep -Fq 'public static function public_dto' file07/doctors-directory/includes/class-sdd-directory.php
          grep -Fq 'eligible=1' file07/doctors-directory/includes/class-sdd-directory.php
          python3 file07/tests/source-contracts.py

          # File 09 remains doctor-verification truth; File 21 must consume its current projection through the File 03 verification bridge.
          grep -Fq "const VERSION = '1.1.0'" file09/includes/class-gdo-integration-contracts.php
          grep -Fq "const FILE21 = 'gdo.file21.publishing-eligibility'" file09/includes/class-gdo-integration-contracts.php
          grep -Fq 'function gdo_file21_publishing_eligibility' file09/includes/class-gdo-integration-contracts.php
          grep -Fq 'sabri_doctor_verification_public_projection_v1' file09/includes/class-gdo-integration-contracts.php
          grep -Fq 'sabri_doctor_verification_public_projection_v1' file03/includes/class-spd-verification-adapter.php
          grep -Fq 'gdo_validate_public_projection' file03/includes/class-spd-verification-adapter.php
          grep -Fq 'SPD_Verification_Adapter::directory_eligible' file21/includes/class-canonical-identity-adapter.php
          grep -Fq 'SPD_Verification_Adapter::approved_fields' file21/includes/class-canonical-identity-adapter.php
          php file09/tests/cross-file-contracts.php

          php -l file17/sabri-network/includes/class-sn-relationships.php
          php -l file17/sabri-network/includes/class-sn-relationship-runtime-hardening.php
          grep -Fq 'public static function state' file17/sabri-network/includes/class-sn-relationships.php
          grep -Fq 'public static function lists' file17/sabri-network/includes/class-sn-relationships.php
          grep -Fq "do_action('sn_network_follow_changed'" file17/sabri-network/includes/class-sn-relationships.php
          grep -Fq "do_action('sn_network_block_changed'" file17/sabri-network/includes/class-sn-relationship-runtime-hardening.php
          grep -Fq 'SN_Relationships::state' file21/includes/class-network-relationship-bridge.php
          grep -Fq 'SN_Relationships::lists' file21/includes/class-network-relationship-bridge.php

          php -l file20/sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq "'21' => array( 'Complete Home and News Feed'" file20/sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'five-exact-slots-fallback-suppressed' file20/sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'suppress-writes-after-cutover' file20/sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'private-route-mount-only' file20/sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'sanitized-events-native-controls-remain' file20/sabri-unified-application-shell/includes/class-central-plan-contract.php

          grep -Fq 'Native data and native state remain authoritative' file23/docs/ADAPTER-CONTRACT.md
          grep -Fq 'Production writes require `production_accepted`' file23/docs/ADAPTER-CONTRACT.md
          grep -Fq 'Generic unregistered action strings are prohibited' file23/docs/ADAPTER-CONTRACT.md

          grep -Eqi 'native enforcement|native module|native authorization|Native modules own.*object-level authorization' file24/docs/ARCHITECTURE.md file24/README.md
          grep -Eqi 'single point of failure|fail.safe|fail-closed' file24/docs/ARCHITECTURE.md file24/README.md
          grep -Fq "apply_filters('spcrc/module_manifests'" file24/plugin/sabri-security-center/src/Registry/ModuleRegistry.php
          grep -Fq "do_action('spcrc/module_registry_ready'" file24/plugin/sabri-security-center/src/Registry/ModuleRegistry.php
          php -l file21/includes/class-security-assurance-integration.php
          grep -Fq "'module_key' => 'file21-home-news-feed'" file21/includes/class-security-assurance-integration.php
          grep -Fq "'canonical_data_owner' => 'File 21'" file21/includes/class-security-assurance-integration.php
          grep -Fq "MANIFEST_CURRENT = '1.2.0'" file24/plugin/sabri-security-center/src/Integration/ContractCompatibilityPolicy.php
          grep -Fq "MANIFEST_CONTRACT_VERSION = '1.2.0'" file21/includes/class-security-assurance-integration.php

          php -l file25/includes/class-content-cards.php
          grep -Fq "CONTRACT_VERSION = '1.2.0'" file25/includes/class-content-cards.php
          grep -Fq "sabri_visual_experience/content_cards" file25/includes/class-design-system.php
          grep -Fq "sabri_visual_experience/content_cards" file21/includes/class-next-generation-integrations.php

      - name: Verify File 21 side remains within current boundaries
        shell: bash
        run: |
          set -euo pipefail
          php -l file21/includes/class-third-fresh-review-hardening.php
          php -l file21/includes/class-fourth-fresh-review-hardening.php
          php -l file21/includes/class-fifth-fresh-review-hardening.php
          php file21/tests/run-file21-file03-profile-timeline-contract.php
          php file21/tests/run-file21-file23-provider-integration-tests.php
          php file21/tests/run-file21-third-fresh-ten-review-tests.php
          php file21/tests/run-file21-fourth-fresh-ten-review-tests.php
          php file21/tests/run-file21-fifth-fresh-ten-review-tests.php

      - name: Record exact companion evidence
        shell: bash
        run: |
          cat > latest-companion-contracts.txt <<REPORT
          File 21: ${FILE21_EXPECTED_SHA}
          File 00: ${FILE00_SHA}
          File 01: ${FILE01_SHA}
          File 02: ${FILE02_SHA}
          File 03: ${FILE03_SHA}
          File 04: ${FILE04_SHA}
          File 07: ${FILE07_SHA}
          File 09: ${FILE09_SHA}
          File 17: ${FILE17_SHA}
          File 20: ${FILE20_SHA}
          File 23: ${FILE23_SHA}
          File 24: ${FILE24_SHA}
          File 25: ${FILE25_SHA}
          Current identity/auth boundary: PASS
          File 01 Home/News reconciliation owner contract: PASS
          File 03 profile timeline owner contract: PASS
          Legacy cutover/no-new-owner boundary: PASS
          File 07 doctor-directory public projection boundary: PASS
          File 09 current verification -> File 03 -> File 21 authority chain: PASS
          File 17 relationship/block runtime boundary: PASS
          Shell five-slot/canonical-owner boundary: PASS
          Dashboard native-owner boundary: PASS
          Security assurance/native-enforcement boundary: PASS
          File 21 -> File 24 module manifest contract: PASS
          File 21 -> File 25 visual content-card contract: PASS
          Fifth-review social-publication and Editorial News share hardening: PASS
          Hostinger staging acceptance: NOT CLAIMED
          REPORT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file21-latest-companion-contracts-${{ env.FILE21_EXPECTED_SHA }}
          path: latest-companion-contracts.txt
          if-no-files-found: warn
          retention-days: 30