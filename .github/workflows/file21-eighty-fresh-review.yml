name: File 21 Eighty Fresh Review Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'includes/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/FILE21-EIGHTY-FRESH-ROUND-REVIEW-2026-08-09.md'
      - '.github/workflows/**'
      - 'readme.txt'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - 'file21-eighty-fresh-review-20260809'
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE21_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE

jobs:
  eighty-fresh-review:
    name: Eighty fresh rounds, governing regressions and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact File 21 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FILE21_EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FILE21_EXPECTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: PHP syntax for changed policy and eighty-round gate
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/class-composer-permissions.php
          php -l tests/run-file21-eighty-fresh-review-v3-tests.php

      - name: Execute all eighty source and contract review rounds
        shell: bash
        run: |
          set -euo pipefail
          FILE21_ROOT="$PWD" php tests/run-file21-eighty-fresh-review-v3-tests.php

      - name: Re-run governing historical and NG30 regressions
        shell: bash
        run: |
          set -euo pipefail
          FILE21_ROOT="$PWD" php tests/run-file21-next-generation-30-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-third-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-fourth-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-fifth-fresh-ten-review-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-four-plan-audit-1.0.5.php
          FILE21_ROOT="$PWD" php tests/run-file21-file23-provider-integration-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-file26-connector-contract-tests.php
          FILE21_ROOT="$PWD" php tests/run-file21-public-visibility-tests.php

      - name: Verify current publisher-class fix is permanent
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'subject_is_public_publisher_class' includes/class-composer-permissions.php
          grep -Fq 'CanonicalIdentityAdapter::is_verified_doctor' includes/class-composer-permissions.php
          php tests/run-file21-file00-authorization-tests.php

      - name: Deterministic canonical package regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release.py --source-sha "${FILE21_EXPECTED_SHA}"
          package="release/${CANONICAL_BASE}.zip"
          checksum="release/${CANONICAL_BASE}.sha256"
          manifest="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$package"
          test -f "$checksum"
          test -f "$manifest"
          test -f "$report"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          unzip -Z1 "$package" > eighty-review-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/includes/class-composer-permissions.php' eighty-review-package-entries.txt
          grep -Fxq 'sabri-complete-home-news-feed/includes/class-fifth-fresh-review-hardening.php' eighty-review-package-entries.txt
          if grep -Eq '^sabri-complete-home-news-feed/(\.github|tools|tests|release|vendor|node_modules)/' eighty-review-package-entries.txt; then
            echo 'Development-only files are present in the package.'
            exit 1
          fi

      - name: Record eighty-round evidence
        shell: bash
        run: |
          cat > file21-eighty-fresh-review-evidence.txt <<REPORT
          File 21 exact head: ${FILE21_EXPECTED_SHA}
          Review rounds: 80
          Review method: fresh sequential source/contract review with same-round correction
          Package: 1.0.5
          Runtime/API: 1.0.3
          Schema: 1.0.0
          Database migration: NONE
          Public publisher classes: Founder / Administrator / currently verified public doctor only
          File 00 external production blocker: NOT CLAIMED FIXED BY FILE 21
          Deterministic package: PASS
          Hostinger staging acceptance: NOT CLAIMED
          Live deployment: NOT CLAIMED
          Operational completion: NOT CLAIMED
          REPORT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file21-eighty-fresh-review-${{ env.FILE21_EXPECTED_SHA }}
          path: |
            file21-eighty-fresh-review-evidence.txt
            eighty-review-package-entries.txt
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE.zip
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE.sha256
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE-MANIFEST.sha256
            release/21-sabri-complete-home-news-feed-1.0.5-CONTROLLED-STAGING-CANDIDATE-TEST-REPORT.md
          if-no-files-found: warn
          retention-days: 30
