name: Apply File 21 1.0.3.2 Correction

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file21-zero-known-defects-1.0.3.2
          fetch-depth: 0

      - name: Apply reviewed root-level corrective patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .file21-correction/READY
          base64 --decode tools/file21-1.0.3.2-root.patch.gz.b64 | gzip -dc > /tmp/file21-1.0.3.2.patch
          git apply --check /tmp/file21-1.0.3.2.patch
          git apply /tmp/file21-1.0.3.2.patch
          rm -f .file21-correction/READY
          rmdir .file21-correction 2>/dev/null || true
          rm -f tools/file21-1.0.3.2.patch.gz.b64 tools/file21-1.0.3.2-root.patch.gz.b64
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/apply-file21-1.0.3.2-correction.yml

      - name: Validate corrected source before commit
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/run-file00-authorization-integrity.php
          grep -Fq '* Version: 1.0.3.2' sabri-complete-home-news-feed.php
          grep -Fq "SMC_Contracts::assertions" includes/class-canonical-identity-adapter.php
          grep -Fq "guard_file21_capabilities" includes/class-canonical-identity-adapter.php
          ! grep -Fq "smc_assertions_v1" includes/class-canonical-identity-adapter.php
          ! grep -Eq "get_user_meta|_smc_doctor_verified|_sabri_doctor_verified|_smc_trusted_publisher|_sabri_trusted_publisher|first_public_meta" includes/class-canonical-identity-adapter.php
          test "$(grep -RIl 'CanonicalIdentityAdapter::current_action_ready' includes admin | wc -l | tr -d ' ')" -ge 15

      - name: Commit corrected File 21 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: close File 21 authority privacy and action-assurance defects'
          git push origin HEAD:fix/file21-zero-known-defects-1.0.3.2
