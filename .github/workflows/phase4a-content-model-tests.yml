name: Phase 4A Content Model Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Feature branches are tested by pull_request only. Push runs are reserved for
# main after merge, preventing duplicate checks and unnecessary Actions usage.
env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE

concurrency:
  group: phase4a-content-model-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase4a:
    name: Contracts, security model, WordPress, package, and full regression
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1

      - name: Show and verify exact commit and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          git rev-parse HEAD
          php -v
          node -v
          pwsh -v
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: PHP syntax lint
        run: find . -name '*.php' -not -path './release/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find assets/js tests \( -name '*.js' -o -name '*.mjs' \) -type f -print0 | xargs -0 -n1 node --check

      - name: Phase 4 planning and security contract tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4-contract-tests.php
          php tests/run-phase4a-security-contract-tests.php

      - name: Phase 4 document audit
        run: php tests/run-phase4-document-audit.php

      - name: Phase 4A content model and security behavior tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4a-content-model-tests.php 2>&1 | tee phase4a-content-model-test.log

      - name: Complete Phase 2 behavior and Safe Boot regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/run-tests.php 2>&1 | tee phase2-safe-boot-regression.log

      - name: Complete Phase 3 regression matrix
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase3-contract-tests.php
          php tests/run-phase3-infrastructure-tests.php
          php tests/run-phase3b-reactions-saves-tests.php
          php tests/run-phase3b-race-shortcode-tests.php
          php tests/run-phase3c-comments-tests.php
          php tests/run-phase3d-follows-tests.php
          php tests/run-phase3e-reports-tests.php
          php tests/run-phase3f-polls-tests.php
          php tests/run-phase3g-notifications-views-tests.php
          php tests/run-phase3h-hardening-tests.php
          php tests/run-phase3-social-features-share-tests.php
          php tests/run-public-query-routing-tests.php
          php tests/run-wordpress-option-filter-compatibility-tests.php
          php tests/run-duplicate-plugin-compat-tests.php

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official WordPress Playground CLI
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest

      - name: Real source WordPress Phase 4A security integration
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: |
          set -euo pipefail
          node tests/run-phase4a-playground-tests.mjs 2>&1 | tee phase4a-playground-security.log

      - name: Static security and whitespace checks
        shell: pwsh
        run: ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests

      - name: Build canonical File 21 package from a clean release directory
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          ./tools/build-release.ps1

      - name: Verify Phase 4A canonical package structure and checksum
        shell: bash
        run: |
          set -euo pipefail
          zip_file="release/${CANONICAL_BASE}.zip"
          sha_file="release/${CANONICAL_BASE}.sha256"
          manifest_file="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report_file="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$zip_file" && test -f "$sha_file" && test -f "$manifest_file" && test -f "$report_file"
          expected=$(awk '{print tolower($1)}' "$sha_file")
          actual=$(sha256sum "$zip_file" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$zip_file"
          python3 - "$zip_file" <<'PY'
          import sys, zipfile
          zip_path = sys.argv[1]
          required = {
              'sabri-complete-home-news-feed/sabri-complete-home-news-feed.php',
              'sabri-complete-home-news-feed/includes/class-phase4-contracts.php',
              'sabri-complete-home-news-feed/includes/class-news-feature-settings.php',
              'sabri-complete-home-news-feed/includes/class-news-statuses.php',
              'sabri-complete-home-news-feed/includes/class-news-capabilities.php',
              'sabri-complete-home-news-feed/includes/class-editorial-news-post-type.php',
              'sabri-complete-home-news-feed/includes/class-news-taxonomies.php',
              'sabri-complete-home-news-feed/includes/class-public-query-guard.php',
              'sabri-complete-home-news-feed/includes/class-public-surface-recovery.php',
              'sabri-complete-home-news-feed/includes/class-home-composition-registry.php',
              'sabri-complete-home-news-feed/includes/class-snapshot.php',
              'sabri-complete-home-news-feed/includes/class-rollback.php',
          }
          with zipfile.ZipFile(zip_path) as archive:
              names = {name.replace('\\', '/') for name in archive.namelist()}
          missing = sorted(required - names)
          if missing:
              raise SystemExit('Missing Phase 4A package files: ' + ', '.join(missing))
          print('Phase 4A canonical package structure and checksum passed.')
          PY
          echo "SABRI_PLUGIN_ZIP=$zip_file" >> "$GITHUB_ENV"

      - name: Real packaged WordPress Phase 4A security integration
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: |
          set -euo pipefail
          node tests/run-phase4a-playground-tests.mjs 2>&1 | tee phase4a-packaged-playground-security.log

      - name: Verify exact commit remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Phase 4A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-content-model-evidence-${{ env.TEST_SHA }}
          retention-days: 30
          path: |
            phase4a-content-model-test.log
            phase2-safe-boot-regression.log
            phase4a-playground-security.log
            phase4a-packaged-playground-security.log
            release/21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE.zip
            release/21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE.sha256
            release/21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE-MANIFEST.sha256
            release/21-sabri-complete-home-news-feed-1.0.3-PRODUCTION-REJECTION-CORRECTIVE-CANDIDATE-TEST-REPORT.md
          if-no-files-found: warn
