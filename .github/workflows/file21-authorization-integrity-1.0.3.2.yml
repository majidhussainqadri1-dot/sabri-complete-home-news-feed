name: File 21 1.0.4 Authorization and Cross-Owner Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-authority:
    name: PHP ${{ matrix.php }} authority regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every PHP file
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run subject-bound and cross-owner regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-file00-authorization-integrity.php
          php tests/run-file21-file22-founder-gateway-regression.php
          php tests/run-file21-file23-provider-integration-tests.php
          php tests/run-file21-file26-connector-contract-tests.php
          php tests/run-file21-four-plan-final-completion-tests.php

  package-and-boundaries:
    name: Static boundaries and deterministic package
    needs: php-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Verify authority, privacy, version and owner boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '* Version: 1.0.4' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_PACKAGE_VERSION', '1.0.4' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.3' );" sabri-complete-home-news-feed.php
          grep -Fq "const MINIMUM_CONTRACT_VERSION = '1.1.2';" includes/class-canonical-identity-adapter.php
          grep -Fq "SMC_Contracts::assertions" includes/class-canonical-identity-adapter.php
          grep -Fq "guard_file21_capabilities" includes/class-canonical-identity-adapter.php
          grep -Fq "array_intersect_key" includes/class-canonical-identity-adapter.php
          ! grep -Fq "smc_assertions_v1" includes/class-canonical-identity-adapter.php
          ! grep -Eq "get_user_meta|_smc_doctor_verified|_sabri_doctor_verified|_smc_trusted_publisher|_sabri_trusted_publisher|first_public_meta" includes/class-canonical-identity-adapter.php
          test "$(grep -RIl 'CanonicalIdentityAdapter::current_action_ready' includes admin | wc -l | tr -d ' ')" -ge 15
          grep -Fq "required_capability(): string { return 'read'; }" includes/class-universal-composer-subject-schema-adapter.php
          grep -Fq "spdb/register_adapters" includes/class-file23-publishing-dashboard-bridge.php
          grep -Fq "'global_search_owner' => '26'" includes/class-search-provider-registry.php
          grep -Fq "'status' => 'proposed'" includes/class-search-provider-registry.php
          ! grep -Fq "'status' => 'active'" includes/class-search-provider-registry.php
          php tests/run-file00-authorization-integrity.php
          php tests/run-file21-file22-founder-gateway-regression.php
          php tests/run-file21-file23-provider-integration-tests.php
          php tests/run-file21-file26-connector-contract-tests.php
          php tests/run-file21-four-plan-final-completion-tests.php

      - name: Build deterministic installable ZIP with embedded manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release.py --source-sha "${GITHUB_SHA}"

      - name: Verify ZIP, embedded manifest and extracted identity
        shell: bash
        run: |
          set -euo pipefail
          base='21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"
          rm -rf /tmp/file21-104
          mkdir -p /tmp/file21-104
          unzip -q "release/${base}.zip" -d /tmp/file21-104
          (cd /tmp/file21-104/sabri-complete-home-news-feed && sha256sum -c MANIFEST.sha256)
          grep -Fq '* Version: 1.0.4' /tmp/file21-104/sabri-complete-home-news-feed/sabri-complete-home-news-feed.php
          grep -Fq 'class-file23-publishing-dashboard-adapter-runtime.php' <(unzip -Z1 "release/${base}.zip")
          grep -Fq 'class-search-provider-registry.php' <(unzip -Z1 "release/${base}.zip")
          php /tmp/file21-104/sabri-complete-home-news-feed/sabri-complete-home-news-feed.php >/dev/null 2>&1 || test $? -eq 0

      - name: Write exact-head evidence
        shell: bash
        run: |
          cat > release/FILE-21-1.0.4-CROSS-OWNER-TEST-REPORT.md <<REPORT
          # File 21 1.0.4 Cross-Owner Corrective Evidence

          - Exact workflow SHA: ${{ github.sha }}
          - PHP 8.1 syntax and authority regression: PASS
          - PHP 8.3 syntax and authority regression: PASS
          - Subject-bound File 00 contract: PASS
          - File 22 Founder gateway with native final authorization: PASS
          - File 23 provider projections and fail-closed writes: PASS
          - File 26 canonical search connector registration and tombstones: PASS
          - File 26 connector self-activation by File 21: DENIED
          - Stale capability and cross-subject denial: PASS
          - Public projection allowlist/privacy: PASS
          - Deterministic package, embedded manifest, SHA-256 and ZIP CRC: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file21-1.0.4-cross-owner-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE.zip
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE.sha256
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE-MANIFEST.sha256
            release/21-sabri-complete-home-news-feed-1.0.4-CONTROLLED-STAGING-CANDIDATE-TEST-REPORT.md
            release/FILE-21-1.0.4-CROSS-OWNER-TEST-REPORT.md
