name: File 21 Corrective 3900-Second Visible QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'FILE-21-*.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/file21-corrective-tests.yml'
      - '.github/workflows/file21-corrective-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file21-corrective-visible-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  visible-qa:
    name: Observable uninterrupted 3,900-second, 13-cycle corrective QA
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          grep -Fq 'Version: 1.0.2' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_VERSION', '1.0.2' );" sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run exactly 13 complete cycles for at least 3,900 seconds
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly MINIMUM_SECONDS=3900
          readonly REQUIRED_CYCLES=13
          readonly CYCLE_INTERVAL_SECONDS=325
          readonly START_EPOCH=$(date +%s)
          mkdir -p file21-visible-qa/cycle-logs
          git rev-parse HEAD > file21-visible-qa/exact-commit.txt
          test "$(cat file21-visible-qa/exact-commit.txt)" = "${TEST_SHA}"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > file21-visible-qa/initial-tracked-files.sha256

          current_cycle=0
          on_error() {
            status=$?
            now=$(date +%s)
            printf 'status=failed\nhead_sha=%s\ncycle=%s\nelapsed_seconds=%s\nexit_status=%s\n' "${TEST_SHA}" "$current_cycle" "$((now-START_EPOCH))" "$status" > file21-visible-qa/failure.env
            exit "$status"
          }
          trap on_error ERR

          run_complete_suite() {
            php tests/run-file21-public-visibility-tests.php
            php tests/run-file21-harmonization-tests.php
            php tests/run-file21-harmonization-negative-tests.php
            php tests/run-file21-legacy-interaction-migration-tests.php
            bash tools/run-phase5-local-tests.sh
            php tests/run-phase4c-public-news-tests.php
            php tests/run-phase4c-security-tests.php
            php tests/run-phase4c-ui-completeness-tests.php
            php tests/run-phase4b-newsroom-tests.php
            php tests/run-phase4b-ui-completeness-tests.php
            php tests/run-phase4a-content-model-tests.php
            php tools/run-tests.php
            node --check assets/js/phase5-public.js
            node --check assets/js/phase5-admin.js
            pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
          }

          verify_fresh_package() {
            rm -rf release
            pwsh -NoProfile -File ./tools/build-release.ps1
            local package checksum manifest expected actual
            package=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE.zip' -print -quit)
            checksum=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE.sha256' ! -name '*-MANIFEST.sha256' -print -quit)
            manifest=$(find release -maxdepth 1 -type f -name '*-PUBLIC-VISIBILITY-CANDIDATE-MANIFEST.sha256' -print -quit)
            test -n "$package" && test -n "$checksum" && test -n "$manifest"
            expected=$(awk '{print tolower($1)}' "$checksum")
            actual=$(sha256sum "$package" | awk '{print $1}')
            test "$expected" = "$actual"
            test "${#actual}" -eq 64
            unzip -tqq "$package"
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-public-surface-recovery.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-corrective-activation-wizard.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-profile-timeline.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-canonical-identity-adapter.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/includes/class-legacy-interaction-migration-adapter.php'
            unzip -Z1 "$package" | grep -Fxq 'sabri-complete-home-news-feed/admin/views/corrective-wizard.php'
            LAST_PACKAGE="$package"
            LAST_PACKAGE_SHA="$actual"
            LAST_MANIFEST="$manifest"
          }

          LAST_PACKAGE=''
          LAST_PACKAGE_SHA=''
          LAST_MANIFEST=''
          for cycle in $(seq 1 "${REQUIRED_CYCLES}"); do
            current_cycle=$cycle
            cycle_start=$(date +%s)
            log_file=$(printf 'file21-visible-qa/cycle-logs/cycle-%02d.log' "$cycle")
            {
              printf 'Starting corrective cycle %02d at %s\n' "$cycle" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              test "$(git rev-parse HEAD)" = "${TEST_SHA}"
              run_complete_suite
              verify_fresh_package
              test -n "$LAST_PACKAGE"
              test "${#LAST_PACKAGE_SHA}" -eq 64
              test -z "$(git status --porcelain --untracked-files=no)"
            } > >(tee "$log_file") 2>&1
            wait
            cycle_end=$(date +%s)
            printf 'cycle=%02d start_epoch=%s end_epoch=%s elapsed=%s package_sha256=%s\n' "$cycle" "$cycle_start" "$cycle_end" "$((cycle_end-cycle_start))" "$LAST_PACKAGE_SHA" >> file21-visible-qa/cycles.log
            if [ "$cycle" -lt "${REQUIRED_CYCLES}" ]; then
              target_epoch=$((START_EPOCH + cycle * CYCLE_INTERVAL_SECONDS))
              now_epoch=$(date +%s)
              if [ "$now_epoch" -lt "$target_epoch" ]; then
                sleep "$((target_epoch-now_epoch))"
              fi
            fi
          done

          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH-START_EPOCH))
          test "$current_cycle" -eq "$REQUIRED_CYCLES"
          test "$ELAPSED" -ge "$MINIMUM_SECONDS"
          test "$(wc -l < file21-visible-qa/cycles.log)" -eq "$REQUIRED_CYCLES"
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > file21-visible-qa/final-tracked-files.sha256
          cmp file21-visible-qa/initial-tracked-files.sha256 file21-visible-qa/final-tracked-files.sha256
          cp "$LAST_PACKAGE" file21-visible-qa/candidate.zip
          cp "$LAST_MANIFEST" file21-visible-qa/runtime-manifest.sha256
          printf '%s  candidate.zip\n' "$LAST_PACKAGE_SHA" > file21-visible-qa/candidate.sha256
          printf 'status=passed\nhead_sha=%s\ncycles=%s\nelapsed_seconds=%s\npackage_sha256=%s\nruntime_version=1.0.2\nschema_version=1.0.0\nlive_deployed=0\n' "${TEST_SHA}" "$REQUIRED_CYCLES" "$ELAPSED" "$LAST_PACKAGE_SHA" > file21-visible-qa/result.env
      - name: Upload visible QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file21-corrective-3900-second-QA-${{ env.TEST_SHA }}
          retention-days: 60
          path: file21-visible-qa/
          if-no-files-found: error
