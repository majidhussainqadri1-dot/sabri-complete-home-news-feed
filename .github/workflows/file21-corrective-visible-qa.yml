name: File 21 Corrective Long QA — Disabled

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/file21-corrective-visible-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file21-corrective-visible-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stopped:
    name: Long QA stopped by repository owner
    runs-on: ubuntu-latest
    steps:
      - name: Confirm disabled state
        run: |
          echo "The 3,900-second File 21 QA has been disabled at the repository owner's request."
          echo "No soak cycles or waiting intervals are executed."
