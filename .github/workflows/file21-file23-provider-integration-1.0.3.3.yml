name: File 21 File 23 Provider Integration 1.0.3.3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-review-test-package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/file21-file23-provider-integration-1.0.3.3

      - name: Apply reviewed release-identity and adapter corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('sabri-complete-home-news-feed.php')
          text = plugin.read_text(encoding='utf-8')
          replacements = {
              'Version: 1.0.3.2': 'Version: 1.0.3.3',
              "'version' => $basename === $current_basename ? '1.0.3.2' : '0.0.0'": "'version' => $basename === $current_basename ? '1.0.3.3' : '0.0.0'",
              "define( 'SABRI_HNF_PACKAGE_VERSION', '1.0.3.2' );": "define( 'SABRI_HNF_PACKAGE_VERSION', '1.0.3.3' );",
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Expected File 21 release marker missing: {old}')
              text = text.replace(old, new)
          plugin.write_text(text, encoding='utf-8')

          adapter = Path('includes/class-file23-publishing-dashboard-adapter-runtime.php')
          text = adapter.read_text(encoding='utf-8')
          replacements = {
              "return defined( 'SABRI_HNF_VERSION' ) && preg_match( '/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/', (string) SABRI_HNF_VERSION )\n\t\t\t? (string) SABRI_HNF_VERSION\n\t\t\t: '1.0.3';": "return defined( 'SABRI_HNF_PACKAGE_VERSION' ) && preg_match( '/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/', (string) SABRI_HNF_PACKAGE_VERSION )\n\t\t\t? (string) SABRI_HNF_PACKAGE_VERSION\n\t\t\t: '1.0.3.3';",
              "$own_counts       = count_user_posts( $user_id, 'post', false );\n\t\t$news_counts      = post_type_exists( 'sabri_news' ) ? count_user_posts( $user_id, 'sabri_news', false ) : null;": "$own_counts       = max( 0, (int) count_user_posts( $user_id, 'post', false ) );\n\t\t$news_counts      = post_type_exists( 'sabri_news' ) ? max( 0, (int) count_user_posts( $user_id, 'sabri_news', false ) ) : null;",
              "'value'            => $this->count_statuses( $own_counts ),": "'value'            => $own_counts,",
              "if ( is_object( $news_counts ) ) {": "if ( null !== $news_counts ) {",
              "'value'            => $this->count_statuses( $news_counts ),": "'value'            => $news_counts,",
              "\t\t$reviewer    = $reviewer_id > 0 ? get_userdata( $reviewer_id ) : null;": "\t\tif ( empty( $context['is_founder'] ) && $reviewer_id > 0 && $reviewer_id !== (int) $context['user_id'] ) {\n\t\t\treturn null;\n\t\t}\n\t\t$reviewer    = $reviewer_id > 0 ? get_userdata( $reviewer_id ) : null;",
              "'native_timezone'    => wp_timezone_string() ?: 'UTC',": "'native_timezone'    => $this->native_timezone(),",
              "\t\tif ( $operator && ( current_user_can( 'spdb_view_review_queue' ) || current_user_can( 'manage_options' ) ) ) {\n\t\t\treturn true;\n\t\t}": "\t\tif ( ( $operator && current_user_can( 'spdb_view_review_queue' ) ) || current_user_can( 'spdb_view_global_analytics' ) || current_user_can( 'manage_options' ) ) {\n\t\t\treturn true;\n\t\t}",
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Expected File 21 adapter marker missing: {old[:100]}')
              text = text.replace(old, new)

          obsolete = "\n\tprivate function count_statuses( $counts ): int {\n\t\tif ( ! is_object( $counts ) ) {\n\t\t\treturn 0;\n\t\t}\n\t\t$total = 0;\n\t\tforeach ( get_object_vars( $counts ) as $value ) {\n\t\t\tif ( is_numeric( $value ) ) {\n\t\t\t\t$total += max( 0, (int) $value );\n\t\t\t}\n\t\t}\n\t\treturn $total;\n\t}\n"
          timezone = "\n\tprivate function native_timezone(): string {\n\t\t$timezone = function_exists( 'wp_timezone_string' ) ? (string) wp_timezone_string() : '';\n\t\treturn in_array( $timezone, timezone_identifiers_list(), true ) ? $timezone : 'UTC';\n\t}\n"
          if obsolete in text:
              text = text.replace(obsolete, timezone)
          elif timezone not in text:
              raise SystemExit('Expected obsolete count helper or corrected timezone helper missing.')
          adapter.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## File 23 provider integration in package 1.0.3.3'
          if marker not in text:
              insertion = '''\n## File 23 provider integration in package 1.0.3.3\n\nFile 21 now registers a load-order-safe Adapter Contract 2.0.0 provider with File 23. The provider supplies bounded, authorization-filtered native inventory, Founder/Doctor workspace counts, review-queue projections and publishing-calendar projections. File 21 remains the canonical owner and exposes no direct File 23 write operations. Package identity 1.0.3.3 invalidates prior provider-acceptance evidence; production writes remain fail-closed pending new staging/production acceptance.\n'''
              text = text.replace('\n## Production-Rejection Corrective Release in 1.0.3\n', insertion + '\n## Production-Rejection Corrective Release in 1.0.3\n', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text(encoding='utf-8')
              marker = '## 1.0.3.3 — File 23 Provider Integration'
              if marker not in text:
                  entry = '''## 1.0.3.3 — File 23 Provider Integration\n\n- Register bounded File 21 inventory, workspace, review and calendar projections with File 23.\n- Preserve File 21 native ownership and deny direct File 23 writes.\n- Bind acceptance evidence to the new package/provider version.\n- Add load-order, authorization, privacy and no-duplicate-backend regression gates.\n\n'''
                  text = entry + text
              changelog.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/file21-file23-provider-integration-1.0.3.3.yml

      - name: Commit corrected exact source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 21 1.0.3.3: finalize File 23 provider integration and review fixes'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax and focused adversarial gates
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-file21-file23-provider-integration-tests.php

      - name: Deterministic installable package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile

          root = Path.cwd()
          build = root / '.file21-package-build'
          package_root = build / 'sabri-complete-home-news-feed'
          if build.exists(): shutil.rmtree(build)
          package_root.mkdir(parents=True)
          excluded_top = {'.git', '.github', '.file21-package-build', 'tests', 'tools', 'vendor', 'node_modules'}
          excluded_suffixes = {'.zip', '.sha256'}
          for source in sorted(root.rglob('*')):
              rel = source.relative_to(root)
              if not rel.parts or rel.parts[0] in excluded_top: continue
              if any(part in {'.git', 'node_modules'} for part in rel.parts): continue
              if source.is_dir(): continue
              if source.suffix in excluded_suffixes: continue
              target = package_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          out = root / '21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip'
          if out.exists(): out.unlink()
          epoch = (2020, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for source in sorted(package_root.rglob('*')):
                  if source.is_dir(): continue
                  arc = source.relative_to(build).as_posix()
                  info = zipfile.ZipInfo(arc, epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, source.read_bytes())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          (root / f'{out.name}.sha256').write_text(f'{digest}  {out.name}\n', encoding='utf-8')
          print(digest)
          PY
          sha256sum -c 21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip.sha256
          unzip -t 21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip
          unzip -p 21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip sabri-complete-home-news-feed/sabri-complete-home-news-feed.php | grep -F 'Version: 1.0.3.3'
          unzip -l 21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip | grep -F 'class-file23-publishing-dashboard-adapter-runtime.php'

      - name: Push exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/file21-file23-provider-integration-1.0.3.3

      - uses: actions/upload-artifact@v4
        with:
          name: file21-1.0.3.3-file23-provider-candidate
          if-no-files-found: error
          path: |
            21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip
            21-sabri-complete-home-news-feed-1.0.3.3-FILE23-INTEGRATION-R1.zip.sha256
