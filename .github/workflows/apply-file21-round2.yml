name: Apply File 21 Round Two

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file21-zero-known-defects-1.0.3.2
          fetch-depth: 0
      - name: Apply round-two correction when pending
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/file21-round2.patch.gz.b64; then
            echo 'Round-two patch is already applied.'
            exit 0
          fi
          base64 --decode tools/file21-round2.patch.gz.b64 | gzip -dc > /tmp/file21-round2.patch
          git apply --check /tmp/file21-round2.patch
          git apply /tmp/file21-round2.patch
          rm -f tools/file21-round2.patch.gz.b64
          rmdir tools 2>/dev/null || true
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-file00-authorization-integrity.php
          grep -Fq "define( 'SABRI_HNF_PACKAGE_VERSION', '1.0.3.2' );" sabri-complete-home-news-feed.php
          grep -Fq "return 'doctor' === ( \$assertions['membership_type'] ?? '' );" includes/class-canonical-identity-adapter.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'test: align legacy suites with subject-bound File 00 authority'
          git push origin HEAD:fix/file21-zero-known-defects-1.0.3.2
