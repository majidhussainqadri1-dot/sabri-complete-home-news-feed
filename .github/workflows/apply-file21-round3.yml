name: Apply File 21 Round Three

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file21-zero-known-defects-1.0.3.2
          fetch-depth: 0
      - name: Align legacy test fixtures with subject-bound File 00 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stubs = Path('tests/wp-stubs.php')
          text = stubs.read_text(encoding='utf-8')
          old_current = "function current_user_can( $capability ) { global $sabri_test_current_caps, $sabri_test_current_user_id, $sabri_test_user_roles, $sabri_test_roles; if ( (int) $sabri_test_current_user_id <= 0 ) { return false; } if ( ! empty( $sabri_test_current_caps[ $capability ] ) ) { return true; } foreach ( isset( $sabri_test_user_roles[ $sabri_test_current_user_id ] ) ? $sabri_test_user_roles[ $sabri_test_current_user_id ] : array() as $role_slug ) { if ( ! empty( $sabri_test_roles[ $role_slug ]->capabilities[ $capability ] ) ) { return true; } } return false; }"
          new_current = """function current_user_can( $capability ) {
          \tglobal $sabri_test_current_caps, $sabri_test_current_user_id, $sabri_test_user_roles, $sabri_test_roles;
          \tif ( (int) $sabri_test_current_user_id <= 0 ) {
          \t\treturn false;
          \t}
          \tif ( ! empty( $sabri_test_current_caps[ $capability ] ) ) {
          \t\treturn true;
          \t}
          \t$roles = isset( $sabri_test_user_roles[ $sabri_test_current_user_id ] ) ? $sabri_test_user_roles[ $sabri_test_current_user_id ] : array();
          \t$default_map = class_exists( '\\Sabri\\HomeNewsFeed\\Capabilities' )
          \t\t? \\Sabri\\HomeNewsFeed\\Capabilities::default_role_map()
          \t\t: array();
          \tforeach ( $roles as $role_slug ) {
          \t\tif ( ! empty( $sabri_test_roles[ $role_slug ]->capabilities[ $capability ] ) ) {
          \t\t\treturn true;
          \t\t}
          \t\tif ( ! empty( $default_map[ $role_slug ] ) && in_array( $capability, $default_map[ $role_slug ], true ) ) {
          \t\t\treturn true;
          \t\t}
          \t}
          \treturn false;
          }"""
          if new_current not in text:
              if old_current not in text:
                  raise SystemExit('Expected current_user_can test stub not found.')
              text = text.replace(old_current, new_current, 1)

          user_can = """
          function user_can( $user_id, $capability ) {
          \tglobal $sabri_test_current_caps, $sabri_test_current_user_id, $sabri_test_user_roles, $sabri_test_roles;
          \t$user_id = (int) $user_id;
          \tif ( $user_id <= 0 ) {
          \t\treturn false;
          \t}
          \tif ( $user_id === (int) $sabri_test_current_user_id && ! empty( $sabri_test_current_caps[ $capability ] ) ) {
          \t\treturn true;
          \t}
          \t$roles = isset( $sabri_test_user_roles[ $user_id ] ) ? $sabri_test_user_roles[ $user_id ] : array();
          \t$default_map = class_exists( '\\Sabri\\HomeNewsFeed\\Capabilities' )
          \t\t? \\Sabri\\HomeNewsFeed\\Capabilities::default_role_map()
          \t\t: array();
          \tforeach ( $roles as $role_slug ) {
          \t\tif ( ! empty( $sabri_test_roles[ $role_slug ]->capabilities[ $capability ] ) ) {
          \t\t\treturn true;
          \t\t}
          \t\tif ( ! empty( $default_map[ $role_slug ] ) && in_array( $capability, $default_map[ $role_slug ], true ) ) {
          \t\t\treturn true;
          \t\t}
          \t}
          \treturn false;
          }
          """
          if 'function user_can( $user_id, $capability )' not in text:
              marker = new_current + "\n"
              if marker not in text:
                  raise SystemExit('Expanded current_user_can stub marker not found.')
              text = text.replace(marker, marker + user_can, 1)
          stubs.write_text(text, encoding='utf-8')

          tests = Path('tests/run-tests.php')
          test_text = tests.read_text(encoding='utf-8')
          old_publish = """\t$settings['capabilities']['verified_doctor_policy'] = 'publish';
          \t$sabri_test_current_user_id = 3;
          \t$verified_publish = ComposerPermissions::resolve_status_for_action( 'publish', 3, $settings );
          \tsabri_assert( ! empty( $verified_publish['allowed'] ) && 'publish' === $verified_publish['status'], 'Verified doctor publish policy must be configurable.' );
          """
          new_publish = """\t$settings['capabilities']['verified_doctor_policy'] = 'publish';
          \t$sabri_test_current_user_id = 3;
          \t$GLOBALS['sabri_test_membership_assertions'][3] = array(
          \t\t'account_class' => 'member',
          \t\t'membership_type' => 'doctor',
          \t\t'status' => 'active',
          \t\t'approved' => true,
          \t\t'eligible' => true,
          \t\t'guardian_verified' => true,
          \t\t'identity_evidence_current' => true,
          \t\t'two_factor_ready' => true,
          \t\t'session_two_factor' => true,
          \t\t'sensitive_action_ready' => true,
          \t\t'professional_verified' => true,
          \t\t'can_publish' => true,
          \t\t'can_practice' => true,
          \t\t'public_profile_allowed' => true,
          \t\t'suspended' => false,
          \t);
          \t$sabri_test_current_caps['sabri_feed_publish_posts'] = true;
          \t$verified_publish = ComposerPermissions::resolve_status_for_action( 'publish', 3, $settings );
          \tsabri_assert( ! empty( $verified_publish['allowed'] ) && 'publish' === $verified_publish['status'], 'Verified doctor publish policy must be configurable when File 00 also authorizes publication.' );
          \tunset( $GLOBALS['sabri_test_membership_assertions'][3], $sabri_test_current_caps['sabri_feed_publish_posts'] );
          """
          if new_publish not in test_text:
              if old_publish not in test_text:
                  raise SystemExit('Verified-doctor publish test block not found.')
              test_text = test_text.replace(old_publish, new_publish, 1)
              tests.write_text(test_text, encoding='utf-8')
          PY
          rm -f tools/file21-round3-test-fixture.patch.gz.b64
          rmdir tools 2>/dev/null || true
          php -l tests/wp-stubs.php
          php -l tests/run-tests.php
          php tools/run-tests.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Round-three correction already present.'
            exit 0
          fi
          git commit -m 'test: align legacy suites with File 00 authority'
          git push origin HEAD:fix/file21-zero-known-defects-1.0.3.2
