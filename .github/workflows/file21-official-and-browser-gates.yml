name: File 21 Official Quality and Ten Browser Gates

on:
  push:
    branches:
      - fix/file21-zero-known-defects-1.0.3.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  official-php-quality-gates:
    name: Official PHPUnit, PHPStan, and WordPress Coding Standards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${TEST_SHA}"
      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install official PHP quality tools
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run official PHPUnit
        run: composer test:phpunit
      - name: Run official PHPStan
        run: composer test:phpstan
      - name: Run official WordPress Coding Standards
        run: composer test:wpcs

  mandatory-ten-browser-suites:
    name: Mandatory ten Playground and Playwright suites
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${TEST_SHA}"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official WordPress Playground and Playwright
        run: npm install --no-save --no-package-lock @wp-playground/cli@latest playwright@latest
      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build exact-head canonical package
        shell: bash
        run: python3 tools/build-release.py --source-sha "${TEST_SHA}"
      - name: Run all ten mandatory suites
        shell: bash
        env:
          SABRI_PLAYGROUND_WP: latest
          SABRI_PLAYGROUND_PHP: '8.3'
        run: |
          set -euo pipefail
          package="release/21-sabri-complete-home-news-feed-1.0.3.2-CONTROLLED-STAGING-CANDIDATE.zip"
          test -f "$package"
          export SABRI_PLUGIN_ZIP="$package"
          suites=(
            tests/run-playground-integration-tests.mjs
            tests/run-packaged-playground-integration-tests.mjs
            tests/run-date-permalink-playground-tests.mjs
            tests/run-file21-production-playground-tests.mjs
            tests/run-phase4a-playground-tests.mjs
            tests/run-phase4b-playground-tests.mjs
            tests/run-phase4c-playground-tests.mjs
            tests/run-phase5-playground-tests.mjs
            tests/run-phase5-performance-playground.mjs
            tests/run-phase5-browser-tests.mjs
          )
          : > mandatory-ten-browser-suites.log
          for suite in "${suites[@]}"; do
            printf '\n===== %s =====\n' "$suite" | tee -a mandatory-ten-browser-suites.log
            node "$suite" 2>&1 | tee -a mandatory-ten-browser-suites.log
          done
          test "${#suites[@]}" -eq 10
      - name: Upload ten-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandatory-ten-browser-suites-${{ env.TEST_SHA }}
          path: mandatory-ten-browser-suites.log
          if-no-files-found: warn
          retention-days: 30
