name: Phase 5 Verified Runtime Bootstrap

on:
  pull_request:
    branches:
      - build/phase-4c-public-news-1.2.0
    paths:
      - '.phase5-runtime-overlay/**'
      - '.github/workflows/phase5-runtime-bootstrap.yml'
      - '.github/workflows/phase5-final-completion-tests.yml'
      - '.github/workflows/phase5-two-hour-visible-qa.yml'

permissions:
  contents: write

concurrency:
  group: phase5-runtime-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    name: Apply verified Phase 5 runtime
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact Draft PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect pending overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .phase5-runtime-overlay ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Runtime overlay already applied; no-op validation run.'
          fi

      - name: Reconstruct and safely extract immutable overlay
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .phase5-runtime-overlay/chunk-* | base64 --decode > /tmp/phase5-runtime-overlay.tar.xz
          actual=$(sha256sum /tmp/phase5-runtime-overlay.tar.xz | awk '{print $1}')
          printf 'overlay_sha256=%s\n' "$actual" | tee phase5-runtime-bootstrap.log
          test "$actual" = '119214391a620724a42e82c2720a5fcc8c0a582d5fe6a633e26dad1b1e7d48c2'
          tar -tJf /tmp/phase5-runtime-overlay.tar.xz > phase5-runtime-overlay-entries.txt
          test "$(wc -l < phase5-runtime-overlay-entries.txt | tr -d ' ')" = '57'
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' phase5-runtime-overlay-entries.txt
          ! grep -Eq '(^|/)\.git(/|$)|(^|/)release(/|$)|(^|/)node_modules(/|$)|(^|/)vendor(/|$)' phase5-runtime-overlay-entries.txt
          tar -xJf /tmp/phase5-runtime-overlay.tar.xz -C .
          rm -rf .phase5-runtime-overlay

      - name: Lint Phase 5 implementation
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/phase5-public.js
          node --check assets/js/phase5-admin.js
          node --check tests/run-phase5-playground-tests.mjs
          node --check tests/run-phase5-browser-tests.mjs
          node --check tests/run-phase5-performance-playground.mjs
          git diff --check

      - name: Run Phase 5 local acceptance
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-phase5-local-tests.sh 2>&1 | tee phase5-runtime-phase5.log

      - name: Run Phase 4C regressions
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4c-public-news-tests.php 2>&1 | tee phase5-runtime-phase4c-public.log
          php tests/run-phase4c-security-tests.php 2>&1 | tee phase5-runtime-phase4c-security.log
          php tests/run-phase4c-ui-completeness-tests.php 2>&1 | tee phase5-runtime-phase4c-ui.log

      - name: Run Phase 4B regressions
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php 2>&1 | tee phase5-runtime-phase4b-newsroom.log
          php tests/run-phase4b-ui-completeness-tests.php 2>&1 | tee phase5-runtime-phase4b-ui.log

      - name: Run Phase 4A and core regressions
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-phase4a-content-model-tests.php 2>&1 | tee phase5-runtime-phase4a.log
          php tools/run-tests.php 2>&1 | tee phase5-runtime-core.log

      - name: Run static security checks
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests 2>&1 | tee phase5-runtime-static.log

      - name: Build and verify immutable Phase 5 package
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          pwsh -NoProfile -File ./tools/build-release.ps1
          package=$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)
          checksum=$(find release -maxdepth 1 -type f -name '*.sha256' -print -quit)
          test -n "$package" && test -n "$checksum"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          for entry in \
            sabri-complete-home-news-feed/includes/class-phase5-database.php \
            sabri-complete-home-news-feed/includes/class-source-registry.php \
            sabri-complete-home-news-feed/includes/class-review-ledger.php \
            sabri-complete-home-news-feed/includes/class-submission-service.php \
            sabri-complete-home-news-feed/includes/class-breaking-news-service.php \
            sabri-complete-home-news-feed/includes/class-correction-ledger.php \
            sabri-complete-home-news-feed/includes/class-news-distribution.php \
            sabri-complete-home-news-feed/includes/class-phase5-rest.php \
            sabri-complete-home-news-feed/admin/class-phase5-newsroom-admin.php \
            sabri-complete-home-news-feed/public/class-phase5-public-runtime.php; do
            unzip -Z1 "$package" | grep -Fxq "$entry"
          done
          grep -Fq 'Version: 1.0.0' sabri-complete-home-news-feed.php
          grep -Fq "define( 'SABRI_HNF_SCHEMA_VERSION', '1.0.0' );" sabri-complete-home-news-feed.php
          grep -Fq "const CHECKPOINT = '4A';" includes/class-phase4-contracts.php

      - name: Commit clean verified runtime
        if: steps.overlay.outputs.apply == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf release
          rm -f phase5-runtime-*.log phase5-runtime-overlay-entries.txt
          git config user.name 'Sabri Phase 5 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/phase5-runtime-bootstrap.yml
          test -n "$(git status --porcelain)"
          test ! -e .phase5-runtime-overlay
          git diff --cached --check
          git commit -m 'Implement Phase 5 final completion runtime'
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload bootstrap diagnostics
        if: always() && steps.overlay.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-runtime-bootstrap-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          path: |
            phase5-runtime-bootstrap.log
            phase5-runtime-overlay-entries.txt
            phase5-runtime-phase5.log
            phase5-runtime-phase4c-public.log
            phase5-runtime-phase4c-security.log
            phase5-runtime-phase4c-ui.log
            phase5-runtime-phase4b-newsroom.log
            phase5-runtime-phase4b-ui.log
            phase5-runtime-phase4a.log
            phase5-runtime-core.log
            phase5-runtime-static.log
          if-no-files-found: ignore
