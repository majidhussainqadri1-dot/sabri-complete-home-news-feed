name: Apply File 21 public Markdown and layout correction R3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  correct-review-commit:
    if: github.head_ref == 'fix/file21-public-markdown-layout-1.0.3.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/file21-public-markdown-layout-1.0.3.3
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Apply bounded public-content correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          class_source = r'''<?php
          /**
           * Public content integrity and single-post presentation safeguards.
           *
           * @package SabriCompleteHomeNewsFeed
           */

          namespace Sabri\HomeNewsFeed;

          if ( ! defined( 'ABSPATH' ) ) {
          	exit;
          }

          /**
           * Keeps File 21 public projections bound to their canonical post and provides
           * conservative Markdown compatibility for legacy/plain-text publications.
           */
          final class PublicContentIntegrity {
          	/** Guard against recursive content filtering. */
          	private static $formatting = false;

          	/** Register public safeguards. */
          	public static function register() {
          		if ( function_exists( 'add_filter' ) ) {
          			add_filter( 'get_the_excerpt', array( __CLASS__, 'canonical_excerpt' ), PHP_INT_MAX, 2 );
          			add_filter( 'get_the_terms', array( __CLASS__, 'filter_automatic_default_category' ), PHP_INT_MAX, 3 );
          			add_filter( 'the_title', array( __CLASS__, 'format_single_title' ), 12, 2 );
          			add_filter( 'the_content', array( __CLASS__, 'format_single_content' ), 12 );
          			add_filter( 'the_content', array( __CLASS__, 'wrap_single_content' ), 18 );
          			add_filter( 'body_class', array( __CLASS__, 'body_classes' ) );
          		}
          		if ( function_exists( 'add_action' ) ) {
          			add_action( 'wp_enqueue_scripts', array( __CLASS__, 'enqueue_single_assets' ), 30 );
          		}
          	}

          	/** Whether a specific post is owned by File 21 public publishing metadata. */
          	private static function is_managed_post( $post_id ) {
          		return (int) $post_id > 0
          			&& function_exists( 'get_post_meta' )
          			&& '' !== trim( (string) get_post_meta( (int) $post_id, PostMetadata::META_TYPE, true ) );
          	}

          	/** Whether a public post needs conservative Markdown display repair. */
          	private static function requires_integrity( $post_id ) {
          		$post_id = (int) $post_id;
          		if ( $post_id <= 0 ) {
          			return false;
          		}
          		if ( self::is_managed_post( $post_id ) ) {
          			return true;
          		}
          		if ( ! function_exists( 'get_post' ) ) {
          			return false;
          		}
          		$post = get_post( $post_id );
          		if ( ! is_object( $post ) || ! isset( $post->ID ) || $post_id !== (int) $post->ID ) {
          			return false;
          		}
          		$title   = isset( $post->post_title ) ? (string) $post->post_title : '';
          		$content = isset( $post->post_content ) ? (string) $post->post_content : '';
          		return self::contains_markdown_artifact( $title, true ) || self::contains_markdown_artifact( $content, false );
          	}

          	/** Detect only the explicit Markdown artifacts repaired by this class. */
          	private static function contains_markdown_artifact( $text, $title = false ) {
          		if ( ! is_string( $text ) || '' === trim( $text ) ) {
          			return false;
          		}
          		if ( $title && 1 === preg_match( '/^\s*#{1,6}\s+\S/u', $text ) ) {
          			return true;
          		}
          		if ( ! $title && 1 === preg_match( '/(?:^|[\r\n])\s*#{1,5}\s+\S/u', $text ) ) {
          			return true;
          		}
          		return 1 === preg_match( '/(?:\*\*[^*\r\n]{1,1000}\*\*|__[^_\r\n]{1,1000}__|(?<![\\*])\*[^*\r\n]{1,1000}\*(?!\*))/u', $text );
          	}

          	/** Resolve the post for managed-only filters or broader integrity display. */
          	private static function request_post_id( $require_loop = false, $managed_only = false ) {
          		if ( ! class_exists( __NAMESPACE__ . '\\HomeIntegration' ) || ! HomeIntegration::is_single_post_request() ) {
          			return 0;
          		}
          		if ( $require_loop ) {
          			if ( function_exists( 'in_the_loop' ) && ! in_the_loop() ) {
          				return 0;
          			}
          			if ( function_exists( 'is_main_query' ) && ! is_main_query() ) {
          				return 0;
          			}
          		}
          		$post_id = $require_loop && function_exists( 'get_the_ID' ) ? (int) get_the_ID() : 0;
          		if ( $post_id <= 0 && function_exists( 'get_queried_object_id' ) ) {
          			$post_id = (int) get_queried_object_id();
          		}
          		if ( $managed_only ) {
          			return self::is_managed_post( $post_id ) ? $post_id : 0;
          		}
          		return self::requires_integrity( $post_id ) ? $post_id : 0;
          	}

          	/**
          	 * Force excerpt projection to the explicitly requested canonical post.
          	 *
          	 * Some themes/plugins ignore the post argument and read the global loop,
          	 * which paired the acceptance-test title with unrelated Global Clinic text.
          	 */
          	public static function canonical_excerpt( $excerpt, $post = null ) {
          		$post_id = is_object( $post ) && isset( $post->ID ) ? (int) $post->ID : ( is_numeric( $post ) ? (int) $post : 0 );
          		if ( $post_id <= 0 || ! self::is_managed_post( $post_id ) || ! function_exists( 'get_post' ) ) {
          			return $excerpt;
          		}
          		$canonical = get_post( $post_id );
          		if ( ! is_object( $canonical ) || ! isset( $canonical->ID ) || (int) $canonical->ID !== $post_id ) {
          			return '';
          		}
          		$source = isset( $canonical->post_excerpt ) ? trim( (string) $canonical->post_excerpt ) : '';
          		if ( '' === $source ) {
          			$source = isset( $canonical->post_content ) ? (string) $canonical->post_content : '';
          		}
          		if ( function_exists( 'strip_shortcodes' ) ) {
          			$source = strip_shortcodes( $source );
          		}
          		$plain = function_exists( 'wp_strip_all_tags' ) ? wp_strip_all_tags( $source, true ) : strip_tags( $source );
          		$plain = preg_replace( '/(^|\s)#{1,6}\s+/u', '$1', (string) $plain );
          		$plain = preg_replace( '/\*\*([^*\r\n]{1,1000})\*\*/u', '$1', (string) $plain );
          		$plain = preg_replace( '/__([^_\r\n]{1,1000})__/u', '$1', (string) $plain );
          		$plain = preg_replace( '/(?<![\\*])\*([^*\r\n]{1,1000})\*(?!\*)/u', '$1', (string) $plain );
          		$plain = preg_replace( '/\s+/u', ' ', trim( (string) $plain ) );
          		if ( function_exists( 'wp_trim_words' ) ) {
          			return wp_trim_words( $plain, 45, '…' );
          		}
          		return function_exists( 'mb_substr' ) ? mb_substr( $plain, 0, 280 ) : substr( $plain, 0, 280 );
          	}

          	/** Hide only an unambiguous automatic default Category projection. */
          	public static function filter_automatic_default_category( $terms, $post_id, $taxonomy ) {
          		if (
          			'category' !== $taxonomy ||
          			! is_array( $terms ) ||
          			1 !== count( $terms ) ||
          			! self::is_managed_post( $post_id ) ||
          			! function_exists( 'get_option' ) ||
          			! function_exists( 'get_the_terms' )
          		) {
          			return $terms;
          		}
          		$default_category = (int) get_option( 'default_category', 0 );
          		$only_term        = reset( $terms );
          		if (
          			$default_category <= 0 ||
          			! is_object( $only_term ) ||
          			! isset( $only_term->term_id ) ||
          			$default_category !== (int) $only_term->term_id
          		) {
          			return $terms;
          		}
          		$topics = get_the_terms( (int) $post_id, 'sabri_feed_topic' );
          		return is_array( $topics ) && array() !== $topics ? array() : $terms;
          	}

          	/** Strip raw heading/emphasis markers from only the queried singular title. */
          	public static function format_single_title( $title, $post_id = 0 ) {
          		$post_id    = (int) $post_id;
          		$queried_id = function_exists( 'get_queried_object_id' ) ? (int) get_queried_object_id() : $post_id;
          		if ( $post_id <= 0 || $queried_id !== $post_id || ! self::requires_integrity( $post_id ) || ! is_string( $title ) ) {
          			return $title;
          		}
          		$title = preg_replace( '/^\s*#{1,6}\s+/u', '', $title );
          		$title = preg_replace( '/\*\*([^*\r\n]{1,1000})\*\*/u', '$1', (string) $title );
          		$title = preg_replace( '/__([^_\r\n]{1,1000})__/u', '$1', (string) $title );
          		$title = preg_replace( '/(?<![\\*])\*([^*\r\n]{1,1000})\*(?!\*)/u', '$1', (string) $title );
          		return trim( (string) $title );
          	}

          	/** Convert a deliberately small Markdown subset after WordPress wpautop. */
          	public static function format_single_content( $content ) {
          		if ( self::$formatting || self::request_post_id( true ) <= 0 || ! is_string( $content ) || '' === trim( $content ) ) {
          			return $content;
          		}
          		self::$formatting = true;
          		try {
          			$content = preg_replace_callback(
          				'/<p>\s*(#{1,5})\s+(.+?)\s*<\/p>/isu',
          				static function ( $match ) {
          					$level = min( 6, strlen( $match[1] ) + 1 );
          					return '<h' . $level . '>' . $match[2] . '</h' . $level . '>';
          				},
          				$content
          			);
          			return self::format_text_nodes( (string) $content );
          		} finally {
          			self::$formatting = false;
          		}
          	}

          	/** Format text nodes while preserving code, preformatted, script and style blocks. */
          	private static function format_text_nodes( $content ) {
          		$parts = preg_split( '/(<[^>]+>)/u', $content, -1, PREG_SPLIT_DELIM_CAPTURE );
          		if ( ! is_array( $parts ) ) {
          			return $content;
          		}
          		$excluded_depth = 0;
          		foreach ( $parts as $index => $part ) {
          			if ( 1 === $index % 2 ) {
          				if ( 1 === preg_match( '/^<\s*\/\s*(?:pre|code|script|style)\b/iu', $part ) ) {
          					$excluded_depth = max( 0, $excluded_depth - 1 );
          				} elseif ( 1 === preg_match( '/^<\s*(?:pre|code|script|style)\b/iu', $part ) && 0 !== preg_match( '/\/\s*>$/u', $part ) ) {
          					++$excluded_depth;
          				}
          				continue;
          			}
          			if ( 0 !== $excluded_depth || '' === $part ) {
          				continue;
          			}
          			$part = preg_replace( '/\*\*([^*\r\n]{1,1000})\*\*/u', '<strong>$1</strong>', $part );
          			$part = preg_replace( '/__([^_\r\n]{1,1000})__/u', '<strong>$1</strong>', (string) $part );
          			$part = preg_replace( '/(?<![\\*])\*([^\s*\r\n](?:[^*\r\n]{0,998}[^\s*\r\n])?)\*(?!\*)/u', '<em>$1</em>', (string) $part );
          			$parts[ $index ] = $part;
          		}
          		return implode( '', $parts );
          	}

          	/** Add a stable content-width and overflow containment wrapper once. */
          	public static function wrap_single_content( $content ) {
          		if ( self::request_post_id( true ) <= 0 || false !== strpos( (string) $content, 'sabri-hnf-single-content' ) ) {
          			return $content;
          		}
          		return '<div class="sabri-hnf-single-content" data-sabri-hnf-post-content="1">' . $content . '</div>';
          	}

          	/** Add stable page-level classes for Shell/File 25 integration. */
          	public static function body_classes( $classes ) {
          		if ( ! is_array( $classes ) ) {
          			$classes = array();
          		}
          		$post_id = self::request_post_id();
          		if ( $post_id > 0 ) {
          			$classes[] = 'sabri-hnf-content-integrity-single';
          			if ( self::is_managed_post( $post_id ) ) {
          				$classes[] = 'sabri-hnf-managed-single';
          			}
          		}
          		return array_values( array_unique( $classes ) );
          	}

          	/** Ensure the single-post containment rules are always present. */
          	public static function enqueue_single_assets() {
          		if ( self::request_post_id() <= 0 ) {
          			return;
          		}
          		if ( class_exists( __NAMESPACE__ . '\\Assets' ) ) {
          			Assets::enqueue_interactions();
          		}
          		if ( function_exists( 'wp_enqueue_style' ) ) {
          			$version = defined( 'SABRI_HNF_PACKAGE_VERSION' ) ? SABRI_HNF_PACKAGE_VERSION . '-public-content-r3' : '1.0.3.2-public-content-r3';
          			wp_enqueue_style(
          				'sabri-hnf-public-content-integrity',
          				SABRI_HNF_URL . 'assets/css/public-content-integrity.css',
          				array(),
          				$version
          			);
          		}
          	}
          }
          '''
          class_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in class_source.splitlines()) + '\n'
          (root / 'includes/class-public-content-integrity.php').write_text(class_source, encoding='utf-8')

          css = r'''/* File 21 public content integrity and single-post containment. */
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content,
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-actions,
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-comments {
          	box-sizing: border-box;
          	width: min(100%, 880px);
          	max-width: 880px;
          	min-width: 0;
          	margin-inline: auto;
          }

          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content {
          	padding: clamp(1rem, 2.4vw, 2rem);
          	border: 1px solid #e0e6e2;
          	border-radius: 14px;
          	background: #ffffff;
          	color: #17231d;
          	font-size: clamp(1rem, 0.95rem + 0.18vw, 1.12rem);
          	line-height: 1.75;
          	overflow-wrap: anywhere;
          	word-break: normal;
          }

          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content > :first-child { margin-top: 0; }
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content > :last-child { margin-bottom: 0; }
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content :is(h2, h3, h4, h5, h6) {
          	clear: both;
          	margin: 1.65em 0 0.55em;
          	line-height: 1.3;
          	text-wrap: balance;
          }

          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content :is(img, video, iframe, table, pre) {
          	max-width: 100%;
          }

          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content :is(table, pre) {
          	overflow-x: auto;
          }

          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) :is(.sabri-hnf-actions, .sabri-hnf-comments) {
          	position: relative;
          	inset-inline: auto;
          	transform: none;
          }

          @media (max-width: 780px) {
          	:is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) .sabri-hnf-single-content {
          		border-radius: 10px;
          		padding: 1rem;
          	}
          }
          '''
          css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines()) + '\n'
          (root / 'assets/css/public-content-integrity.css').write_text(css, encoding='utf-8')

          tests = r'''<?php
          /** Runtime regression for File 21 public content integrity. */
          declare(strict_types=1);

          namespace {
              define('ABSPATH', __DIR__ . '/');
              define('SABRI_HNF_URL', 'https://example.test/wp-content/plugins/sabri-complete-home-news-feed/');

              $GLOBALS['hnf_posts'] = [
                  42 => (object) [
                      'ID' => 42,
                      'post_title' => 'Controlled File 21 post',
                      'post_excerpt' => '',
                      'post_content' => "This is the controlled canonical body.\n\n## Sluggish Liver\n\n**Cellular Inflammation** and *Sulphur* must be formatted.",
                  ],
                  43 => (object) [
                      'ID' => 43,
                      'post_title' => 'Ordinary WordPress content',
                      'post_excerpt' => '',
                      'post_content' => 'Ordinary WordPress content.',
                  ],
                  44 => (object) [
                      'ID' => 44,
                      'post_title' => '# Sabri Homeopathic Empirical Treatment for High Cholesterol',
                      'post_excerpt' => '',
                      'post_content' => "*Sulphur* and *Chelidonium*: **A Summary of My Discovery and Research**",
                  ],
              ];
              $GLOBALS['hnf_meta'] = [42 => ['_sabri_feed_type' => 'standard-post'], 43 => [], 44 => []];
              $GLOBALS['hnf_default_category'] = 9;
              $GLOBALS['hnf_queried_id'] = 42;
              $GLOBALS['hnf_filters'] = [];
              $GLOBALS['hnf_actions'] = [];
              $GLOBALS['hnf_styles'] = [];

              function add_filter($hook, $callback, $priority = 10, $accepted_args = 1) { $GLOBALS['hnf_filters'][] = [$hook, $callback, $priority, $accepted_args]; }
              function add_action($hook, $callback, $priority = 10, $accepted_args = 1) { $GLOBALS['hnf_actions'][] = [$hook, $callback, $priority, $accepted_args]; }
              function get_post_meta($post_id, $key, $single = true) { return $GLOBALS['hnf_meta'][(int)$post_id][$key] ?? ''; }
              function get_post($post_id) { return $GLOBALS['hnf_posts'][(int)$post_id] ?? null; }
              function get_option($key, $default = false) { return 'default_category' === $key ? $GLOBALS['hnf_default_category'] : $default; }
              function get_the_terms($post_id, $taxonomy) { return 42 === (int)$post_id && 'sabri_feed_topic' === $taxonomy ? [(object)['term_id' => 101]] : []; }
              function strip_shortcodes($text) { return preg_replace('/\[[^\]]+\]/', '', (string)$text); }
              function wp_strip_all_tags($text, $remove_breaks = false) { $value = strip_tags((string)$text); return $remove_breaks ? preg_replace('/[\r\n\t ]+/', ' ', $value) : $value; }
              function wp_trim_words($text, $num_words = 55, $more = null) { $words = preg_split('/\s+/', trim((string)$text)); return count($words) > $num_words ? implode(' ', array_slice($words, 0, $num_words)) . ($more ?? '…') : implode(' ', $words); }
              function wp_kses_post($html) { throw new \RuntimeException('Whole rendered content must not be re-sanitized.'); }
              function in_the_loop() { return true; }
              function is_main_query() { return true; }
              function get_the_ID() { return (int)$GLOBALS['hnf_queried_id']; }
              function get_queried_object_id() { return (int)$GLOBALS['hnf_queried_id']; }
              function wp_enqueue_style($handle, $src = '', $deps = [], $version = false) { $GLOBALS['hnf_styles'][$handle] = [$src, $deps, $version]; }
          }

          namespace Sabri\HomeNewsFeed {
              final class PostMetadata { public const META_TYPE = '_sabri_feed_type'; }
              final class HomeIntegration { public static function is_single_post_request() { return true; } }
              final class Assets { public static function enqueue_interactions() {} }

              require dirname(__DIR__) . '/includes/class-public-content-integrity.php';

              $failures = [];
              $passed = 0;
              $assert = static function ($condition, $message) use (&$failures, &$passed) {
                  if ($condition) { ++$passed; return; }
                  $failures[] = $message;
              };

              PublicContentIntegrity::register();
              $assert(count($GLOBALS['hnf_filters']) >= 6, 'Public filters, including title repair, must register.');
              $assert(count($GLOBALS['hnf_actions']) >= 1, 'Public asset action must register.');

              $excerpt = PublicContentIntegrity::canonical_excerpt('Wrong global text.', $GLOBALS['hnf_posts'][42]);
              $assert(str_contains($excerpt, 'controlled canonical body'), 'Excerpt must use the explicitly requested canonical post body.');
              $assert(!str_contains($excerpt, '**') && !str_contains($excerpt, '##') && !str_contains($excerpt, '*Sulphur*'), 'Excerpt must not expose raw Markdown markers.');
              $assert('Ordinary original excerpt' === PublicContentIntegrity::canonical_excerpt('Ordinary original excerpt', $GLOBALS['hnf_posts'][43]), 'Ordinary posts must remain untouched.');

              $default_only = [(object)['term_id' => 9]];
              $assert([] === PublicContentIntegrity::filter_automatic_default_category($default_only, 42, 'category'), 'Sole automatic default category must be hidden when an explicit File 21 topic exists.');
              $assert(1 === count(PublicContentIntegrity::filter_automatic_default_category($default_only, 43, 'category')), 'Ordinary post categories must remain untouched.');

              $source = '<p>## Sluggish Liver</p><figure class="wp-block-embed"><iframe src="https://example.test/embed"></iframe></figure><p>**Cellular Inflammation** and *Sulphur* remain important.</p><pre>**literal** *literal*</pre>';
              $formatted = PublicContentIntegrity::format_single_content($source);
              $assert(str_contains($formatted, '<h3>Sluggish Liver</h3>'), 'Markdown heading must become semantic heading.');
              $assert(str_contains($formatted, '<strong>Cellular Inflammation</strong>'), 'Markdown bold must become strong text.');
              $assert(str_contains($formatted, '<em>Sulphur</em>'), 'Single-asterisk emphasis must become em text.');
              $assert(str_contains($formatted, '<pre>**literal** *literal*</pre>'), 'Code/preformatted text must remain literal.');
              $assert(str_contains($formatted, '<iframe'), 'Existing embed output must be preserved.');

              $wrapped = PublicContentIntegrity::wrap_single_content($formatted);
              $assert(str_contains($wrapped, 'sabri-hnf-single-content'), 'Managed content must receive containment wrapper.');
              $assert($wrapped === PublicContentIntegrity::wrap_single_content($wrapped), 'Containment wrapper must be idempotent.');
              $classes = PublicContentIntegrity::body_classes(['single']);
              $assert(in_array('sabri-hnf-managed-single', $classes, true), 'Managed page must expose managed body class.');
              $assert(in_array('sabri-hnf-content-integrity-single', $classes, true), 'Managed page must expose broader integrity body class.');

              $GLOBALS['hnf_queried_id'] = 44;
              $clean_title = PublicContentIntegrity::format_single_title($GLOBALS['hnf_posts'][44]->post_title, 44);
              $assert('Sabri Homeopathic Empirical Treatment for High Cholesterol' === $clean_title, 'Leading Markdown heading marker must be removed from the queried title.');
              $legacy_content = PublicContentIntegrity::format_single_content('<p>*Sulphur* and *Chelidonium*: **A Summary**</p>');
              $assert(str_contains($legacy_content, '<em>Sulphur</em>') && str_contains($legacy_content, '<em>Chelidonium</em>') && str_contains($legacy_content, '<strong>A Summary</strong>'), 'Legacy public article Markdown must render semantically.');
              $legacy_classes = PublicContentIntegrity::body_classes(['single']);
              $assert(in_array('sabri-hnf-content-integrity-single', $legacy_classes, true), 'Legacy Markdown article must expose the Shell integration class.');
              $assert(!in_array('sabri-hnf-managed-single', $legacy_classes, true), 'Legacy article must not be falsely claimed as File 21-owned.');

              PublicContentIntegrity::enqueue_single_assets();
              $assert(isset($GLOBALS['hnf_styles']['sabri-hnf-public-content-integrity']), 'Integrity stylesheet must enqueue for legacy Markdown articles.');
              $assert('1.0.3.2-public-content-r3' === $GLOBALS['hnf_styles']['sabri-hnf-public-content-integrity'][2], 'Corrective asset version must invalidate stale caches.');
              $assert([] === $GLOBALS['hnf_styles']['sabri-hnf-public-content-integrity'][1], 'Integrity CSS must not depend on an absent feed stylesheet.');

              $GLOBALS['hnf_queried_id'] = 43;
              $assert('Ordinary WordPress content' === PublicContentIntegrity::format_single_title('Ordinary WordPress content', 43), 'Ordinary title must remain untouched.');
              $assert('Ordinary body' === PublicContentIntegrity::format_single_content('Ordinary body'), 'Ordinary body must remain untouched.');

              if ($failures) {
                  fwrite(STDERR, "File21 public content integrity: {$passed} PASS, " . count($failures) . " FAIL\n- " . implode("\n- ", $failures) . "\n");
                  exit(1);
              }
              echo "File21 public content integrity: {$passed} PASS, 0 FAIL\n";
          }
          '''
          tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in tests.splitlines()) + '\n'
          (root / 'tests/run-public-content-integrity-tests.php').write_text(tests, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          current = changelog.read_text(encoding='utf-8')
          entry = "# Changelog\n\n## 1.0.3.2 Public Rendering R3 — 2026-08-04\n\n- Normalize raw Markdown heading markers in the queried singular title without altering stored content.\n- Render conservative bold and italic Markdown in legacy public articles while preserving code/pre blocks and existing HTML.\n- Add `sabri-hnf-content-integrity-single` for non-owned legacy articles so File 20 can recover the correct theme content column without false ownership.\n- Load containment CSS independently and add an explicit cache-busting asset identity.\n- Preserve File 21 ownership, taxonomy, authorization, privacy and runtime/API boundaries.\n\n"
          if current.startswith('# Changelog\n'):
              current = current[len('# Changelog\n'):].lstrip('\n')
          changelog.write_text(entry + current, encoding='utf-8')

          doc = '''# File 21 Public Markdown and Shell Integration Correction R3\n\n## Confirmed defect\n\nA legacy/general singular WordPress article containing raw Markdown was not File 21-owned and therefore bypassed File 21 public formatting and the File 20 managed-layout recovery hook. The public title exposed a leading `#`; body emphasis markers remained literal; and the fixed desktop sidebar could cover the theme content column.\n\n## Correction\n\n- Ownership remains strict: legacy articles are not reclassified as File 21-owned.\n- Explicit raw Markdown artifacts opt only the queried public singular article into display-integrity repair.\n- The queried title is normalized to plain title text.\n- Body headings, bold and single-asterisk emphasis are rendered conservatively; code/pre/script/style blocks are excluded.\n- A neutral `sabri-hnf-content-integrity-single` body class and stable content wrapper provide the cross-file layout signal.\n- Ordinary WordPress content without supported Markdown artifacts remains untouched.\n\n## Review rounds\n\n1. Full PHP syntax, targeted public-content regression, PHPUnit, PHPStan and WordPress Coding Standards.\n2. Fresh adversarial regression for ordinary-content isolation, title scoping, code/pre preservation, ownership boundaries, asset dependency removal and cache invalidation.\n\n## Lifecycle boundary\n\nRepository coding and automated QA do not equal Hostinger staging or live acceptance.\n'''
          (root / 'docs/FILE21-PUBLIC-MARKDOWN-SHELL-INTEGRATION-R3-2026-08-04.md').write_text(doc, encoding='utf-8')
          trigger = root / '.file21-public-markdown-trigger'
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Review cycle 1
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './release/*' -print0 | xargs -0 -n1 php -l
          php tests/run-public-content-integrity-tests.php
          composer test:phpunit
          composer test:phpstan
          composer test:wpcs
          git diff --check

      - name: Review cycle 2 fresh adversarial
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-public-content-integrity-tests.php
          grep -Fq "add_filter( 'the_title'" includes/class-public-content-integrity.php
          grep -Fq "sabri-hnf-content-integrity-single" includes/class-public-content-integrity.php assets/css/public-content-integrity.css
          grep -Fq "<em>\$1</em>" includes/class-public-content-integrity.php
          grep -Fq "array()," includes/class-public-content-integrity.php
          ! grep -Fq "wp_update_post" includes/class-public-content-integrity.php
          ! grep -Fq "update_post_meta" includes/class-public-content-integrity.php
          composer test:phpunit
          composer test:phpstan
          composer test:wpcs
          python3 tools/build-release.py --source-sha "$(git rev-parse HEAD)"
          git diff --check

      - name: Commit reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor release .phpunit.cache
          git restore --source=HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-public-content-integrity.php assets/css/public-content-integrity.css tests/run-public-content-integrity-tests.php CHANGELOG.md docs/FILE21-PUBLIC-MARKDOWN-SHELL-INTEGRATION-R3-2026-08-04.md
          git add -A .file21-public-markdown-trigger 2>/dev/null || true
          git commit -m 'fix: normalize legacy public Markdown and expose neutral layout signal'
          git push origin HEAD:fix/file21-public-markdown-layout-1.0.3.3
