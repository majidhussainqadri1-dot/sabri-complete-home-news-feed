name: File 21 Historical Package Alias Sync

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/build-release.ps1'
      - '.github/workflows/file21-package-alias-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file21-package-alias-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Add one immutable historical alias
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/build-release.ps1')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              (
                  "$legacyBase = '21-sabri-complete-home-news-feed-1.0.1-COMPATIBILITY-CANDIDATE'\n",
                  "$legacyBase = '21-sabri-complete-home-news-feed-1.0.1-COMPATIBILITY-CANDIDATE'\n$historicalBase = '21-sabri-complete-home-news-feed-1.0.1-PHASE-3-STAGING-CANDIDATE'\n",
              ),
              (
                  "$legacyShaPath = Join-Path $releaseDir \"$legacyBase.sha256\"\n",
                  "$legacyShaPath = Join-Path $releaseDir \"$legacyBase.sha256\"\n$historicalZipPath = Join-Path $releaseDir \"$historicalBase.zip\"\n$historicalShaPath = Join-Path $releaseDir \"$historicalBase.sha256\"\n$historicalReportPath = Join-Path $releaseDir \"$historicalBase-TEST-REPORT.md\"\n",
              ),
              (
                  "$legacyZipPath, $legacyShaPath)) {\n",
                  "$legacyZipPath, $legacyShaPath, $historicalZipPath, $historicalShaPath, $historicalReportPath)) {\n",
              ),
              (
                  "$legacyHash = (Get-FileHash -LiteralPath $legacyZipPath -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($legacyHash -ne $hash) {\n    throw 'Compatibility package digest does not match the canonical harmonized package.'\n}\n",
                  "$legacyHash = (Get-FileHash -LiteralPath $legacyZipPath -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($legacyHash -ne $hash) {\n    throw 'Compatibility package digest does not match the canonical harmonized package.'\n}\nCopy-Item -LiteralPath $zipPath -Destination $historicalZipPath -Force\n\"$hash  $(Split-Path $historicalZipPath -Leaf)\" | Set-Content -LiteralPath $historicalShaPath -Encoding ASCII\n$historicalHash = (Get-FileHash -LiteralPath $historicalZipPath -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($historicalHash -ne $hash) {\n    throw 'Historical Phase 3 alias digest does not match the canonical harmonized package.'\n}\n",
              ),
              (
                  "$report | Set-Content -LiteralPath $reportPath -Encoding UTF8\n",
                  "$report | Set-Content -LiteralPath $reportPath -Encoding UTF8\nCopy-Item -LiteralPath $reportPath -Destination $historicalReportPath -Force\n",
              ),
              (
                  "Write-Output \"Built compatibility alias $legacyZipPath\"\n",
                  "Write-Output \"Built compatibility alias $legacyZipPath\"\nWrite-Output \"Built historical Phase 3 alias $historicalZipPath\"\n",
              ),
          ]

          for old, new in replacements:
              if old not in text and new not in text:
                  raise SystemExit(f'Expected build-release anchor missing: {old!r}')
              if new not in text:
                  text = text.replace(old, new, 1)

          if text != original:
              path.write_text(text, encoding='utf-8')

      - name: Build and verify all aliases
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          ./tools/build-release.ps1
          $canonical = Get-ChildItem release/*-HARMONIZED-CANDIDATE.zip
          $compatibility = Get-ChildItem release/*-COMPATIBILITY-CANDIDATE.zip
          $historical = Get-ChildItem release/*-PHASE-3-STAGING-CANDIDATE.zip
          if ($canonical.Count -ne 1 -or $compatibility.Count -ne 1 -or $historical.Count -ne 1) { throw 'Expected exactly one canonical and two compatibility ZIPs.' }
          $hashes = @(
            (Get-FileHash $canonical.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),
            (Get-FileHash $compatibility.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),
            (Get-FileHash $historical.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          ) | Select-Object -Unique
          if ($hashes.Count -ne 1) { throw 'Package aliases are not byte-identical.' }
          if (-not (Test-Path release/*-PHASE-3-STAGING-CANDIDATE-TEST-REPORT.md)) { throw 'Historical test-report alias is missing.' }

      - name: Commit build compatibility update
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/build-release.ps1; then
            echo 'No package alias changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-release.ps1
          git commit -m 'Add byte-identical historical package alias'
          git push origin HEAD:"${HEAD_BRANCH}"
