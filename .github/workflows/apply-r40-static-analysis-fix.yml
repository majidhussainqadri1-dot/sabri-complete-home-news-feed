name: Apply R40 Static Analysis Fix

on:
  push:
    branches:
      - audit/file21-forty-round-review-2026-08-07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r40-static-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file21-forty-round-review-2026-08-07
          fetch-depth: 0
      - name: Apply source corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'includes/class-comment-experience.php': [
                  ("\t\t$tokens = isset( $matches[1] ) && is_array( $matches[1] ) ? $matches[1] : array();", "\t\t$tokens = is_array( $matches[1] ) ? $matches[1] : array();"),
              ],
              'includes/class-feed-user-agency.php': [
                  ("\t\treturn is_object( $term ) && isset( $term->slug ) ? self::clean_key( $term->slug ) : '';", "\t\treturn is_object( $term ) ? self::clean_key( (string) $term->slug ) : '';"),
              ],
              'includes/class-network-relationship-bridge.php': [
                  ("return class_exists( 'SN_Relationships' ) && method_exists( 'SN_Relationships', 'state' );", "return class_exists( 'SN_Relationships' ) && is_callable( array( 'SN_Relationships', 'state' ) );"),
                  ("$state = \\SN_Relationships::state( $viewer_id, $author_id );", "$state = call_user_func( array( 'SN_Relationships', 'state' ), $viewer_id, $author_id );"),
                  ("if ( self::native_available() && method_exists( 'SN_Relationships', 'lists' ) ) {", "if ( self::native_available() && is_callable( array( 'SN_Relationships', 'lists' ) ) ) {"),
                  ("$result = \\SN_Relationships::lists( $user_id, 'following', $page_limit, $cursor );", "$result = call_user_func( array( 'SN_Relationships', 'lists' ), $user_id, 'following', $page_limit, $cursor );"),
                  ("$state = \\SN_Relationships::state( $viewer_user_id, $target_user_id );", "$state = call_user_func( array( 'SN_Relationships', 'state' ), $viewer_user_id, $target_user_id );"),
                  ("if ( ! self::native_available() || ! method_exists( 'SN_Relationships', 'follow' ) ) {", "if ( ! self::native_available() || ! is_callable( array( 'SN_Relationships', 'follow' ) ) ) {"),
                  ("return \\SN_Relationships::follow( (int) $follower_id, (int) $target_user_id );", "return call_user_func( array( 'SN_Relationships', 'follow' ), (int) $follower_id, (int) $target_user_id );"),
                  ("if ( ! self::native_available() || ! method_exists( 'SN_Relationships', 'unfollow' ) ) {", "if ( ! self::native_available() || ! is_callable( array( 'SN_Relationships', 'unfollow' ) ) ) {"),
                  ("$state = \\SN_Relationships::state( (int) $follower_id, (int) $target_user_id );", "$state = call_user_func( array( 'SN_Relationships', 'state' ), (int) $follower_id, (int) $target_user_id );"),
                  ("return \\SN_Relationships::unfollow( (int) $follower_id, (int) $target_user_id, $version );", "return call_user_func( array( 'SN_Relationships', 'unfollow' ), (int) $follower_id, (int) $target_user_id, $version );"),
              ],
              'includes/class-saved-collection-service.php': [
                  ("$rows = $wpdb->get_results( $sql, ARRAY_A );", "$rows = $wpdb->get_results( $sql, 'ARRAY_A' );"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected source in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          php -l includes/class-comment-experience.php
          php -l includes/class-feed-user-agency.php
          php -l includes/class-network-relationship-bridge.php
          php -l includes/class-saved-collection-service.php
          php tests/run-file21-network-relationship-bridge-tests.php
          php tests/run-phase3c-comments-tests.php
          php tests/run-phase3b-reactions-saves-tests.php
          git rm -f .audit/r40-static-analysis-fix.patch
          git add includes/class-comment-experience.php includes/class-feed-user-agency.php includes/class-network-relationship-bridge.php includes/class-saved-collection-service.php
          git config user.name 'sabri-forty-round-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix R40 official static-analysis findings [r40-static-applied]'
          git push origin HEAD:audit/file21-forty-round-review-2026-08-07
