name: Apply R40 Static Analysis Fix

on:
  push:
    branches:
      - audit/file21-forty-round-review-2026-08-07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r40-static-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file21-forty-round-review-2026-08-07
          fetch-depth: 0
      - name: Apply source corrections
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .audit/r40-static-analysis-fix.patch
          git apply --index .audit/r40-static-analysis-fix.patch
          git rm -f .audit/r40-static-analysis-fix.patch
          git config user.name 'sabri-forty-round-review-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix R40 official static-analysis findings [r40-static-applied]'
          git push origin HEAD:audit/file21-forty-round-review-2026-08-07
