name: File 21 Focused Core Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'includes/**'
      - 'public/**'
      - 'tests/**'
      - 'tools/**'
      - 'sabri-complete-home-news-feed.php'
      - '.github/workflows/file21-core-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax for changed production boundaries
        run: |
          set -euo pipefail
          php -l includes/class-public-query-guard.php
          php -l includes/class-public-surface-recovery.php
          php -l includes/class-corrective-public-mount.php
          php -l includes/class-home-composition-registry.php
          php -l includes/class-integrations.php
          php -l public/class-phase5-public-runtime.php
      - name: Capture File 21 contract suite
        id: contracts
        shell: bash
        run: |
          set +e
          : > file21-contracts.log
          status=0
          for test in \
            tests/run-file21-public-visibility-tests.php \
            tests/run-file21-harmonization-tests.php \
            tests/run-file21-harmonization-negative-tests.php \
            tests/run-file21-corrective-tests.php \
            tests/run-file21-completion-audit-tests.php \
            tests/run-file21-legacy-interaction-migration-tests.php; do
            echo "=== $test ===" | tee -a file21-contracts.log
            php "$test" >> file21-contracts.log 2>&1
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              echo "FAILED: $test ($test_status)" | tee -a file21-contracts.log
              status=1
            fi
          done
          cat file21-contracts.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture core regression output
        id: core_regression
        shell: bash
        run: |
          set +e
          php tools/run-tests.php > file21-core-regression.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat file21-core-regression.log
          exit 0
      - name: Upload core and contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file21-core-contract-logs
          path: |
            file21-core-regression.log
            file21-contracts.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce contract suite
        if: steps.contracts.outputs.status != '0'
        run: |
          echo 'File 21 contract suite failed. Download file21-core-contract-logs for exact failures.'
          exit 1
      - name: Enforce core regression result
        if: steps.core_regression.outputs.status != '0'
        run: |
          echo 'File 21 core regression failed. Download file21-core-contract-logs for exact failures.'
          exit 1

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Capture canonical package build output
        id: package_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & ./tools/build-release.ps1 *> file21-package-build.log
          $status = $LASTEXITCODE
          if ($null -eq $status) { $status = 0 }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content file21-package-build.log
          if (Test-Path release) {
            Get-ChildItem release -File | Sort-Object Name | ForEach-Object { $_.Name } | Out-File -FilePath file21-package-files.log -Encoding utf8
          } else {
            'release-directory-missing' | Out-File -FilePath file21-package-files.log -Encoding utf8
          }
          exit 0
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file21-package-diagnostics
          path: |
            file21-package-build.log
            file21-package-files.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce canonical package build
        if: steps.package_build.outputs.status != '0'
        run: |
          echo 'Canonical File 21 package build failed. Download file21-package-diagnostics for the exact error.'
          exit 1
