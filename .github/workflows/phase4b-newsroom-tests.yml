name: Phase 4B Newsroom Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'PHASE-4B-IMPLEMENTATION.md'
      - 'includes/**'
      - 'admin/**'
      - 'public/**'
      - 'templates/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/phase4b-newsroom-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4b-newsroom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANONICAL_BASE: 21-sabri-complete-home-news-feed-1.0.2-PUBLIC-VISIBILITY-CANDIDATE

jobs:
  contracts:
    name: Phase 4B contracts and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TEST_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: PHP and JavaScript syntax
        run: |
          set -euo pipefail
          find includes admin public templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check tests/run-phase4b-playground-tests.mjs
      - name: Newsroom and full regressions
        run: |
          set -euo pipefail
          php tests/run-phase4b-newsroom-tests.php
          php tests/run-phase4a-content-model-tests.php
          php tests/run-public-query-routing-tests.php
          php tests/run-file21-public-visibility-tests.php
          php tests/run-file21-completion-audit-tests.php
          php tools/run-tests.php
      - name: Static checks
        shell: pwsh
        run: ./tools/run-local-static-checks.ps1 -SkipPhpLint -SkipPhpTests
      - name: Create contract evidence
        run: |
          set -euo pipefail
          mkdir -p phase4b-contracts
          git rev-parse HEAD > phase4b-contracts/exact-commit.txt
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > phase4b-contracts/tracked-files.sha256
          sha256sum phase4b-contracts/tracked-files.sha256 > phase4b-contracts/manifest-digest.sha256
          printf 'status=passed\nhead_sha=%s\n' "${TEST_SHA}" > phase4b-contracts/result.env
      - uses: actions/upload-artifact@v4
        with:
          name: phase4b-contract-evidence-${{ env.TEST_SHA }}
          path: phase4b-contracts/
          retention-days: 30
          if-no-files-found: error

  package:
    name: Canonical Phase 4B package
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - name: Build canonical package
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Verify immutable package
        run: |
          set -euo pipefail
          package="release/${CANONICAL_BASE}.zip"
          checksum="release/${CANONICAL_BASE}.sha256"
          manifest="release/${CANONICAL_BASE}-MANIFEST.sha256"
          report="release/${CANONICAL_BASE}-TEST-REPORT.md"
          test -f "$package" && test -f "$checksum" && test -f "$manifest" && test -f "$report"
          expected=$(awk '{print tolower($1)}' "$checksum")
          actual=$(sha256sum "$package" | awk '{print $1}')
          test "$expected" = "$actual"
          unzip -tqq "$package"
          mkdir -p phase4b-package
          cp "$package" phase4b-package/candidate.zip
          printf '%s  candidate.zip\n' "$actual" > phase4b-package/candidate.sha256
          cp "$manifest" phase4b-package/runtime-manifest.sha256
          printf '%s\n' "${TEST_SHA}" > phase4b-package/exact-commit.txt
          unzip -Z1 "$package" > phase4b-package/package-entries.txt
          for entry in \
            sabri-complete-home-news-feed/includes/class-news-policy.php \
            sabri-complete-home-news-feed/includes/class-news-workflow.php \
            sabri-complete-home-news-feed/includes/class-public-query-guard.php \
            sabri-complete-home-news-feed/includes/class-public-surface-recovery.php \
            sabri-complete-home-news-feed/includes/class-home-composition-registry.php \
            sabri-complete-home-news-feed/admin/class-newsroom-admin.php; do
            grep -Fxq "$entry" phase4b-package/package-entries.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phase4b-immutable-package-${{ env.TEST_SHA }}
          path: phase4b-package/
          retention-days: 30
          if-no-files-found: error

  source-playground:
    name: Source Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run source newsroom integration
        env:
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4b-playground-tests.mjs

  packaged-playground:
    name: Packaged Playground (${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: [ package, source-playground ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: '6.8'
            php: '8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: phase4b-immutable-package-${{ env.TEST_SHA }}
          path: phase4b-package
      - run: |
          cd phase4b-package
          sha256sum -c candidate.sha256
          test "$(cat exact-commit.txt)" = "${TEST_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @wp-playground/cli@latest
      - name: Run packaged newsroom integration
        env:
          SABRI_PLUGIN_ZIP: phase4b-package/candidate.zip
          SABRI_PLAYGROUND_WP: ${{ matrix.wp }}
          SABRI_PLAYGROUND_PHP: ${{ matrix.php }}
        run: node tests/run-phase4b-playground-tests.mjs
