name: File 21 File 22 Real Contract

on:
  pull_request:
    paths:
      - 'includes/**'
      - 'templates/**'
      - 'assets/**'
      - 'tests/run-file21-file22-*.php'
      - 'tests/run-file21-four-plan-audit-1.0.5.php'
      - '.github/workflows/file21-file22-real-contract.yml'
  push:
    branches:
      - main
      - 'file21-**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE21_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FILE22_RUNTIME_SHA: c3b775b66fbbda4a9dd9891d63c08c74e2178741

concurrency:
  group: file21-file22-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-contract:
    name: Actual File 22 coordinator contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact File 21 corrective head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.FILE21_EXPECTED_SHA }}
          path: file21
          persist-credentials: false

      - name: Check out exact corrected File 22 runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: majidhussainqadri1-dot/sabri-universal-post-composer
          ref: ${{ env.FILE22_RUNTIME_SHA }}
          path: file22
          persist-credentials: false

      - name: Verify source pins and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file21 rev-parse HEAD)" = "${FILE21_EXPECTED_SHA}"
          test "$(git -C file22 rev-parse HEAD)" = "${FILE22_RUNTIME_SHA}"
          php -v
          php -l file22/includes/core/class-version.php
          php -l file22/includes/core/class-contract-boundary.php
          php -l file22/includes/core/class-workflow-validator.php
          php -l file22/includes/core/class-workflow-coordinator.php
          php -l file22/includes/contracts/interface-governed-workflow-adapter.php
          php -l file22/includes/contracts/interface-lifecycle-adapter.php
          grep -Fq 'interface Governed_Workflow_Adapter extends Workflow_Adapter' file22/includes/contracts/interface-governed-workflow-adapter.php
          grep -Fq 'interface Lifecycle_Adapter extends Governed_Workflow_Adapter' file22/includes/contracts/interface-lifecycle-adapter.php
          grep -Fq "define( 'SUPC_GOVERNANCE_API_VERSION', '1.0.0' )" file22/sabri-universal-post-composer.php
          grep -Fq "define( 'SUPC_LIFECYCLE_API_VERSION', '1.0.0' )" file22/sabri-universal-post-composer.php
          php -l file21/includes/class-universal-composer-workflow-store.php
          php -l file21/includes/class-universal-composer-workflow-maintenance.php
          php -l file21/includes/class-universal-composer-execution-lock-maintenance.php
          php -l file21/includes/class-universal-composer-workflow-adapter.php
          php -l file21/includes/class-universal-composer-publication-adapter.php
          php -l file21/includes/class-universal-composer-subject-schema-adapter.php
          grep -Fq 'implements Lifecycle_Adapter, Diagnostic_Adapter' file21/includes/class-universal-composer-subject-schema-adapter.php
          grep -Fq 'function governance_profile' file21/includes/class-universal-composer-workflow-adapter.php
          grep -Fq 'function execute_lifecycle' file21/includes/class-universal-composer-workflow-adapter.php
          php -l file21/tests/run-file21-file22-real-contract-tests.php
          php -l file21/tests/run-file21-file22-maintenance-tests.php
          php -l file21/tests/run-file21-file22-lock-maintenance-tests.php
          php -l file21/tests/run-file21-file22-founder-gateway-regression.php
          php -l file21/tests/run-file21-four-plan-audit-1.0.5.php

      - name: Run actual current File 22 Coordinator with File 21 adapter
        shell: bash
        env:
          FILE22_ROOT: ${{ github.workspace }}/file22
        run: |
          set -euo pipefail
          php -r '
            error_reporting(E_ALL & ~E_WARNING);
            define("ABSPATH", getcwd() . "/file21/tests/");
            $root = getenv("FILE22_ROOT");
            require $root . "/includes/core/class-version.php";
            require $root . "/includes/core/class-contract-boundary.php";
            require $root . "/includes/core/class-workflow-validator.php";
            require "file21/tests/run-file21-file22-real-contract-tests.php";
          '

      - name: Run Founder gateway and four-plan regressions
        shell: bash
        run: |
          set -euo pipefail
          FILE21_ROOT="$PWD/file21" php file21/tests/run-file21-file22-founder-gateway-regression.php
          FILE21_ROOT="$PWD/file21" php file21/tests/run-file21-four-plan-audit-1.0.5.php

      - name: Run bounded retention and maintenance tests
        shell: bash
        run: |
          set -euo pipefail
          php file21/tests/run-file21-file22-maintenance-tests.php
          php file21/tests/run-file21-file22-lock-maintenance-tests.php
